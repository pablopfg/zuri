# SonarQube Cloud, free plan for open source (decision of 13/11/2026). The
# analysis runs in .github/workflows/sonarqube.yml with the SONAR_TOKEN secret.
# Setup and how to read the results: docs/qa/varreduras-de-seguranca.md.
sonar.organization=pablopfg
sonar.projectKey=pablopfg_Zuri
sonar.projectName=Zuri

sonar.sources=apps,packages,scripts
sonar.tests=apps,packages,tests
sonar.test.inclusions=**/test/**,**/*.test.ts,**/*.test.tsx,tests/**
sonar.exclusions=**/node_modules/**,**/dist/**,**/test/**,**/*.test.ts,**/*.test.tsx,apps/web/src/fonts/**
# The web screens are covered by the e2e suite, which the coverage report does
# not count; the scripts run in CI, not in the product.
sonar.coverage.exclusions=scripts/**,apps/web/src/main.tsx
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.sourceEncoding=UTF-8
