<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Zuri Gestão</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600&display=swap">
<style>
/* Protótipo da área Gestão no visual Sinal: menu lateral à esquerda, uma tela por vez à direita.
   Todos os dados são inventados. Tokens copiados de prototipo-interativo.html. */
:root{
  color-scheme:light;
  --f-ui:"Figtree",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --r-sm:8px;--r-md:10px;--r-lg:14px;--r-pill:999px;
  --t-xs:13px;--t-sm:14px;--t-md:16px;--t-lg:18px;--t-xl:22px;--t-2xl:28px;
  --bg:#f1f1f3;--surface:#ffffff;--sunken:#e8e8eb;--hover:#e6e6ea;
  --line:#d0d0d6;--line-soft:#e0e0e5;--line-strong:#b4b4bd;
  --ink:#0f0f12;--ink-2:#2e2e35;--muted:#4d4d57;
  --accent:#15803d;--accent-hover:#14532d;--on-accent:#ffffff;--accent-ink:#166534;--accent-soft:#dcfce7;--accent-soft-ink:#14532d;--focus:#15803d;
  --warn-ink:#92400e;--warn-soft:#fef3c7;--warn-line:#e5b84a;--danger-ink:#b91c1c;--danger-soft:#fee2e2;--danger-line:#f5a3a3;--ok-ink:#166534;
  --info-ink:#0c4a6e;--info-soft:#e0f2fe;
  --side-bg:#e9e9ec;--side-ink:#2e2e35;--side-head:#0f0f12;--side-muted:#4d4d57;--side-hover:#dcdce1;--side-active-bg:#ffffff;--side-line:#d0d0d6;
  --side-active-shadow:0 1px 2px rgb(24 24 27 / .10),0 0 0 1px rgb(24 24 27 / .12);
  --tile:#18181b;--mark:#ffffff;--signal:#22c55e;
  /* séries dos gráficos (ordem fixa por entidade) */
  --s-in:#2a78d6;--s-out:#eb6834;--s-est:#1baf7a;--s-cmp:#8a8a94;
  --s-came:#1baf7a;--s-open:#eda100;--s-miss:#e87ba4;--s-off:#6250d6;
  --grid:#e0e0e5;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  color-scheme:dark;
  --bg:#111113;--surface:#18181b;--sunken:#222226;--hover:#26262b;
  --line:rgb(255 255 255 / .08);--line-soft:rgb(255 255 255 / .05);--line-strong:rgb(255 255 255 / .14);
  --ink:#ededef;--ink-2:#c9c9cf;--muted:#a1a1aa;
  --accent:#4ade80;--accent-hover:#86efac;--on-accent:#052e16;--accent-ink:#4ade80;--accent-soft:#12291c;--accent-soft-ink:#bbf7d0;--focus:#4ade80;
  --warn-ink:#fbbf24;--warn-soft:#2a210f;--warn-line:#5c4614;--danger-ink:#fca5a5;--danger-soft:#2a1414;--danger-line:#5c2323;--ok-ink:#4ade80;
  --info-ink:#bae6fd;--info-soft:#0f2433;
  --side-bg:#0c0c0e;--side-ink:#c9c9cf;--side-head:#ededef;--side-muted:#a1a1aa;--side-hover:#1a1a1e;--side-active-bg:#222226;--side-line:rgb(255 255 255 / .06);
  --side-active-shadow:inset 0 0 0 1px rgb(255 255 255 / .06);
  --tile:#26262b;--mark:#fafafa;--signal:#4ade80;
  --s-in:#3987e5;--s-out:#d95926;--s-est:#199e70;--s-cmp:#8a8a94;
  --s-came:#199e70;--s-open:#c98500;--s-miss:#d55181;--s-off:#9085e9;
  --grid:rgb(255 255 255 / .08);
}}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#111113;--surface:#18181b;--sunken:#222226;--hover:#26262b;
  --line:rgb(255 255 255 / .08);--line-soft:rgb(255 255 255 / .05);--line-strong:rgb(255 255 255 / .14);
  --ink:#ededef;--ink-2:#c9c9cf;--muted:#a1a1aa;
  --accent:#4ade80;--accent-hover:#86efac;--on-accent:#052e16;--accent-ink:#4ade80;--accent-soft:#12291c;--accent-soft-ink:#bbf7d0;--focus:#4ade80;
  --warn-ink:#fbbf24;--warn-soft:#2a210f;--warn-line:#5c4614;--danger-ink:#fca5a5;--danger-soft:#2a1414;--danger-line:#5c2323;--ok-ink:#4ade80;
  --info-ink:#bae6fd;--info-soft:#0f2433;
  --side-bg:#0c0c0e;--side-ink:#c9c9cf;--side-head:#ededef;--side-muted:#a1a1aa;--side-hover:#1a1a1e;--side-active-bg:#222226;--side-line:rgb(255 255 255 / .06);
  --side-active-shadow:inset 0 0 0 1px rgb(255 255 255 / .06);
  --tile:#26262b;--mark:#fafafa;--signal:#4ade80;
  --s-in:#3987e5;--s-out:#d95926;--s-est:#199e70;--s-cmp:#8a8a94;
  --s-came:#199e70;--s-open:#c98500;--s-miss:#d55181;--s-off:#9085e9;
  --grid:rgb(255 255 255 / .08);
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:400 var(--t-md)/1.5 var(--f-ui);-webkit-font-smoothing:antialiased;display:flex;flex-direction:column}
button,input,select{font:inherit;color:inherit}
h1,h2,h3,p{margin:0}
h1,h2,h3{font-weight:600;text-wrap:balance}
ul{margin:0;padding:0;list-style:none}
a{color:var(--accent-ink);text-underline-offset:3px}
.num{font-variant-numeric:tabular-nums}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:var(--r-sm)}

.proto{margin:0;border:0;min-width:0;display:flex;flex-wrap:wrap;gap:12px;align-items:center;padding:8px 16px;background:#0b0f19;color:#f8fafc;font:500 13px/1.4 system-ui,sans-serif}
.proto select{background:#1a2233;color:#f8fafc;border:1px solid #56627a;border-radius:6px;padding:4px 8px;min-height:32px}
.proto span{opacity:.85}
[data-captura] .proto{display:none}

.app{flex:1;min-height:0;display:grid;grid-template-columns:272px minmax(0,1fr)}
.side{background:var(--side-bg);color:var(--side-ink);border-right:1px solid var(--side-line);padding:12px;overflow:auto;display:flex;flex-direction:column}
.brand{display:flex;align-items:center;gap:10px;color:var(--side-head);font:600 19px/1 var(--f-ui);padding:4px 4px 12px}
.logo{width:30px;height:30px;border-radius:8px;background:var(--tile);position:relative;flex:none}
.logo::before{content:"";position:absolute;inset:8px 8px 13px 8px;border-top:3px solid var(--mark);border-bottom:3px solid var(--mark);transform:skewY(-28deg)}
.logo::after{content:"";position:absolute;right:5px;top:5px;width:6px;height:6px;border-radius:50%;background:var(--signal)}
.nav-h{font:600 var(--t-xs)/1 var(--f-ui);color:var(--side-muted);padding:20px 10px 8px;display:flex;align-items:center;gap:8px}
.nav-h .new{font-weight:600;color:var(--accent-soft-ink);background:var(--accent-soft);border-radius:var(--r-pill);padding:3px 8px}
.nav{display:grid;gap:2px}
.nav a,.nav span.off{display:flex;align-items:center;gap:12px;min-height:40px;padding:0 10px;border-radius:var(--r-md);color:var(--side-ink);text-decoration:none;font-weight:500}
.nav span.off{color:var(--side-muted)}
.nav a:hover{background:var(--side-hover);color:var(--side-head)}
.nav a[aria-current="page"]{background:var(--side-active-bg);color:var(--side-head);box-shadow:var(--side-active-shadow)}
.nav .count{margin-left:auto;font-size:var(--t-xs);font-weight:600;color:var(--side-muted)}
.ic{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
.ic-sm{width:16px;height:16px}
.side-note{margin-top:auto;padding:12px 10px 4px;font-size:var(--t-xs);color:var(--side-muted)}

.main{min-width:0;overflow:auto}
.page{max-width:1120px;margin:0 auto;padding:32px;display:grid;gap:24px}
.head{display:flex;flex-wrap:wrap;gap:12px 16px;align-items:flex-end}
.head>div:first-child{margin-right:auto;min-width:0}
.head h1{font-size:var(--t-2xl);line-height:1.2}
.head p{color:var(--muted)}
.tabbar{display:none}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border-radius:var(--r-md);border:1px solid transparent;font-weight:600;font-size:15px;cursor:pointer;white-space:nowrap;text-decoration:none}
.btn-primary{background:var(--accent);color:var(--on-accent)}
.btn-primary:hover{background:var(--accent-hover)}
.btn-secondary{background:var(--surface);color:var(--ink);border-color:var(--line-strong)}
.btn-secondary:hover{background:var(--hover)}
.btn-quiet{background:transparent;color:var(--ink-2)}
.btn-quiet:hover{background:var(--hover)}
.btn-sm{min-height:36px;padding:0 12px;font-size:14px}
.btn:disabled{opacity:.55;cursor:not-allowed}
.input{min-height:44px;padding:0 12px;border-radius:var(--r-md);border:1px solid var(--line-strong);background:var(--surface);color:var(--ink);min-width:0}
.field{display:grid;gap:6px;min-width:0}
.field>span{font-size:var(--t-sm);font-weight:600}
.seg{display:inline-flex;gap:2px;padding:3px;border-radius:var(--r-md);background:var(--sunken);max-width:100%;overflow-x:auto}
.seg button{min-height:36px;padding:0 14px;border:0;border-radius:7px;background:transparent;color:var(--ink-2);font-weight:500;font-size:14px;cursor:pointer;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgb(0 0 0 / .08),0 0 0 1px var(--line)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:20px;min-width:0}
.card>h2{font-size:var(--t-lg);margin-bottom:4px}
.card>.sub{color:var(--muted);font-size:var(--t-sm);margin-bottom:12px}
.tag{display:inline-flex;align-items:center;gap:5px;font-size:var(--t-xs);font-weight:500;color:var(--ink-2);background:var(--sunken);border-radius:var(--r-pill);padding:2px 9px;line-height:20px;white-space:nowrap}
.tag.ok{background:var(--accent-soft);color:var(--accent-soft-ink)}
.tag.warn{background:var(--warn-soft);color:var(--warn-ink)}
.tag.bad{background:var(--danger-soft);color:var(--danger-ink)}
.tag.info{background:var(--info-soft);color:var(--info-ink)}
.note{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:var(--r-md);background:var(--warn-soft);color:var(--warn-ink);border:1px solid var(--warn-line);font-size:var(--t-sm)}
.note.ok{background:var(--accent-soft);color:var(--accent-soft-ink);border-color:transparent}
.muted{color:var(--muted)}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}

/* indicadores: poucos, grandes, numa linha só */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:16px 18px;display:grid;gap:2px;align-content:start;min-width:0}
.kpi .l{font-size:var(--t-sm);color:var(--muted);font-weight:500}
.kpi .v{font-size:var(--t-2xl);font-weight:600;line-height:1.2;border-radius:6px;width:fit-content;max-width:100%}
.kpi .d{font-size:var(--t-xs);color:var(--muted)}
.kpi .d b{font-weight:600}
.kpi .d .up{color:var(--ok-ink)}.kpi .d .down{color:var(--danger-ink)}
.flash{animation:flash 1.4s ease-out}
@keyframes flash{0%{background:var(--accent-soft);box-shadow:0 0 0 6px var(--accent-soft)}100%{background:transparent;box-shadow:0 0 0 6px transparent}}

.toolbar{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.toolbar .grow{margin-right:auto}
.live{display:inline-flex;align-items:center;gap:8px;font-size:var(--t-sm);color:var(--muted)}
.live i{width:8px;height:8px;border-radius:50%;background:var(--accent);flex:none}
.live b{color:var(--ink);font-weight:600}

/* gráficos */
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart text{font:500 12px var(--f-ui);fill:var(--muted)}
.chart .bar{transform-box:fill-box;transform-origin:50% 100%}
.card-head{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;margin-bottom:12px}
.card-head h2{font-size:var(--t-lg);margin-right:auto}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:var(--t-xs);color:var(--ink-2);margin-bottom:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.legend i.ln{height:2px;width:14px;border-radius:0;vertical-align:3px}
.hb{display:grid;gap:12px}
.hb-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;align-items:center;font-size:var(--t-sm)}
.hb-row .track{grid-column:1 / -1;grid-row:2}
.hb-bar{display:block;height:8px;border-radius:0 4px 4px 0;background:var(--s-in);min-width:2px}
.hb-row.out .hb-bar{background:var(--s-out)}
details.more>summary{cursor:pointer;color:var(--accent-ink);font-weight:500;width:fit-content;font-size:var(--t-sm)}
details.more[open]>summary{margin-bottom:12px}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:var(--t-sm)}
th,td{text-align:right;padding:8px 10px;border-bottom:1px solid var(--line-soft);white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th{font-weight:600;color:var(--muted);font-size:var(--t-xs)}
#tip{position:fixed;z-index:50;pointer-events:none;background:var(--surface);border:1px solid var(--line-strong);border-radius:var(--r-sm);padding:8px 10px;font-size:var(--t-xs);box-shadow:0 8px 24px -6px rgb(0 0 0 / .25);min-width:140px}
#tip b{display:block;margin-bottom:4px}
#tip div{display:flex;justify-content:space-between;gap:16px}

/* atendimentos: lista de uma linha por horário; só um aberto por vez */
.cols{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:24px;align-items:start}
.group-h{display:flex;align-items:center;gap:8px;font-size:var(--t-sm);font-weight:600;color:var(--muted);margin:0 0 8px}
.list{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden}
.list>li+li{border-top:1px solid var(--line-soft)}
.v-row{display:grid;grid-template-columns:56px minmax(0,1fr) auto;gap:4px 14px;align-items:center;width:100%;min-height:64px;padding:10px 16px;border:0;background:transparent;text-align:left;cursor:pointer}
.v-row:hover{background:var(--hover)}
.v-row .hr{font-weight:600;font-size:var(--t-md)}
.v-row .who{min-width:0}
.v-row .who b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.v-row .who small{display:block;color:var(--muted);font-size:var(--t-sm);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.v-row .end{display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-end;align-items:center}
li.open{background:var(--sunken)}
li.open .v-row:hover{background:transparent}
li.next .v-row .hr{color:var(--accent-ink)}
.v-form{display:grid;gap:12px;padding:4px 16px 16px 86px}
.choice{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:0 14px;border-radius:var(--r-pill);border:1px solid var(--line-strong);background:var(--surface);font-weight:500;font-size:var(--t-sm);cursor:pointer}
.chip:hover{background:var(--hover)}
.chip[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent-soft-ink);border-color:var(--accent)}
.payline{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center}
.payline .input{width:120px;min-height:40px}
.payline>span{font-size:var(--t-sm);color:var(--muted)}
.err{color:var(--danger-ink);font-size:var(--t-sm)}
.rail{display:grid;gap:16px;position:sticky;top:24px}
.stack{display:flex;height:10px;border-radius:var(--r-pill);overflow:hidden;gap:2px;background:var(--sunken)}
.stack i{display:block;height:100%}
.sum{display:grid;gap:8px;font-size:var(--t-sm)}
.sum div{display:flex;justify-content:space-between;gap:12px;align-items:center}
.sum i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:8px}
.big{font-size:var(--t-2xl);font-weight:600;line-height:1.2}
.toast{position:fixed;left:50%;bottom:24px;translate:-50% 0;z-index:40;display:flex;gap:12px;align-items:center;padding:10px 12px 10px 16px;border-radius:var(--r-md);background:var(--ink);color:var(--bg);font-size:var(--t-sm);box-shadow:0 8px 24px -6px rgb(0 0 0 / .4);max-width:calc(100% - 32px)}
.toast button{border:0;background:transparent;color:inherit;font-weight:600;text-decoration:underline;cursor:pointer;min-height:32px;padding:0 6px}

/* financeiro */
.rows{display:grid}
.day-h{font-size:var(--t-xs);font-weight:600;color:var(--muted);padding:14px 0 6px;border-bottom:1px solid var(--line-soft)}
.row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 16px;padding:12px 0;border-bottom:1px solid var(--line-soft);align-items:center}
.row:last-child{border-bottom:0}
.row .t{font-weight:500;min-width:0;overflow-wrap:anywhere}
.row .m{color:var(--muted);font-size:var(--t-sm)}
.row .a{font-weight:600;text-align:right;grid-row:span 2}
.row .a.out{color:var(--danger-ink)}
.drop{border:1.5px dashed var(--line-strong);border-radius:var(--r-lg);padding:40px 20px;text-align:center;display:grid;gap:12px;justify-items:center;background:var(--surface)}
.steps{display:flex;flex-wrap:wrap;gap:8px;font-size:var(--t-sm);color:var(--muted)}
.steps li{display:flex;align-items:center;gap:8px}
.steps li b{display:grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--sunken);font-size:12px;color:var(--ink-2)}
.steps li[aria-current="step"]{color:var(--ink);font-weight:600}
.steps li[aria-current="step"] b{background:var(--accent);color:var(--on-accent)}
.steps li+li::before{content:"";width:20px;height:1px;background:var(--line-strong)}
.kv{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 16px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line-soft);font-size:var(--t-sm)}
.kv:last-of-type{border-bottom:0}
.kv b{font-weight:600}
.kv small{grid-column:1 / -1;color:var(--muted);font-size:var(--t-xs)}
.narrow{max-width:720px}
.hl{display:grid;gap:8px;padding-left:18px;list-style:disc}
.stmt tr.total td{font-weight:600;border-top:1px solid var(--line-strong)}

@media (max-width:1000px){
  .cols{grid-template-columns:minmax(0,1fr)}
  .rail{position:static;grid-row:1}
}
@media (max-width:860px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{display:none}
  .page{padding:20px 16px 96px}
  .tabbar{display:grid;grid-template-columns:repeat(3,1fr);position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:20}
  .tabbar a{display:grid;justify-items:center;gap:2px;padding:8px 4px;font-size:12px;font-weight:500;color:var(--muted);text-decoration:none}
  .tabbar a[aria-current="page"]{color:var(--accent-ink)}
  .g2{grid-template-columns:minmax(0,1fr)}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
  .kpi .v{font-size:var(--t-xl)}
  .v-row{grid-template-columns:48px minmax(0,1fr);padding:10px 12px}
  .v-row .end{grid-column:2;justify-content:flex-start}
  .v-form{padding:4px 12px 16px}
  .toast{bottom:84px}
}
[hidden]{display:none}
@media (prefers-reduced-motion:no-preference){
  .btn,.nav a,.chip{transition:background-color 150ms}
  .chart .bar{transition:transform 700ms cubic-bezier(.2,.8,.2,1)}
  .live i{animation:pulse 2s infinite}
}
@media (prefers-reduced-motion:reduce){.flash{animation:none}}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgb(34 197 94 / .5)}100%{box-shadow:0 0 0 8px rgb(34 197 94 / 0)}}
</style>
</head>
<body>
<fieldset class="proto">
  <legend class="sr">Opções do protótipo</legend>
  <strong>Protótipo · Gestão</strong>
  <label>Tema <select id="tema"><option value="">Do sistema</option><option value="light">Claro</option><option value="dark">Escuro</option></select></label>
  <label><input type="checkbox" id="auto" checked> Simular pagamentos chegando</label>
  <span>Dados inventados. Nada aqui grava de verdade.</span>
</fieldset>
<div class="app">

const ic = (n, c) => `<svg class="ic ${c || ""}" viewBox="0 0 24 24" aria-hidden="true">${ICONS[n]}</svg>`;

/* ---------- dados inventados (gerador com semente fixa) ---------- */
let seed = 20261112;
const rnd = () => { seed = (seed * 1664525 + 1013904223) % 4294967296; return seed / 4294967296; };
const HOJE = { a: 2026, m: 10, d: 12 }; // 12/11/2026
const months = []; // 24 meses até nov/2026, valores em reais
for (let i = 23; i >= 0; i--) {
  const idx = HOJE.a * 12 + HOJE.m - i, a = Math.floor(idx / 12), m = idx % 12;
  const growth = 1 + (23 - i) * 0.012, season = [0.82, 0.95, 1.05, 1, 1.02, 0.96, 0.9, 1.04, 1.08, 1.06, 1, 0.78][m];
  const consultas = Math.round((48 + rnd() * 10) * growth * season);
  const retornos = Math.round(consultas * (0.55 + rnd() * 0.15));
  const faltas = Math.round((consultas + retornos) * (0.05 + rnd() * 0.04));
  const estimado = consultas * (a === 2026 ? 280 : 250);
  months.push({ a, m, consultas, retornos, faltas, cancelados: Math.round(faltas * 0.8), abertos: Math.round(rnd() * 2), estimado,
    entradas: Math.round(estimado * (0.93 + rnd() * 0.1)), saidas: Math.round(3100 + rnd() * 900 + estimado * 0.06), novos: Math.round(consultas * (0.3 + rnd() * 0.1)) });
}
/* novembro, dia a dia (até hoje); o mês corrente é a soma dos dias */
const days = [];
for (let d = 1; d <= HOJE.d; d++) {
  const wd = new Date(Date.UTC(2026, 10, d)).getUTCDay(), work = wd !== 0 && wd !== 6, today = d === HOJE.d;
  days.push({ d, entradas: !work ? 0 : today ? 280 : Math.round(3 + rnd() * 4) * 280 - (rnd() > 0.5 ? 190 : 0), saidas: d === 10 ? 1800 : d === 5 ? 1210 : work && rnd() > 0.6 ? Math.round(80 + rnd() * 300) : 0 });
}
const cur = months[23];
function syncMonth() { cur.entradas = days.reduce((t, x) => t + x.entradas, 0); cur.saidas = days.reduce((t, x) => t + x.saidas, 0); }
Object.assign(cur, { consultas: 19, retornos: 12, faltas: 2, cancelados: 1, abertos: 1, estimado: 19 * 280, novos: 7 });
syncMonth();
const FORMAS = [["Pix", 0.56], ["Cartão de crédito", 0.21], ["Cartão de débito", 0.12], ["Dinheiro", 0.08], ["Transferência", 0.03]];
const SAIDAS = [["Aluguel", 0.44], ["Impostos", 0.2], ["Sistema de prontuário", 0.1], ["Material de escritório", 0.09], ["Contabilidade", 0.09], ["Internet e telefone", 0.08]];
const DIAS_SEM = [["seg", 0.2], ["ter", 0.24], ["qua", 0.19], ["qui", 0.22], ["sex", 0.13], ["sáb", 0.02]];

  { id: "e2", h: "09:00", nome: "Otávio Lins Barreto", tipo: "Retorno", local: "Consultório", st: "attended" },

const VIEWS = [["atendimentos", "clip", "Atendimentos"], ["financeiro", "wallet", "Financeiro"], ["resultados", "chart", "Resultados"]];
const pend = () => visits.filter((v) => !v.st && v.h < AGORA);
function fromHash() { const h = location.hash.slice(1); if (VIEWS.some((v) => v[0] === h)) st.view = h; }
function go(v) { st.view = v; try { history.replaceState(null, "", "#" + v); } catch (e) { location.hash = v; } render(); $("#main").scrollTop = 0; }
const seg = (label, key, cur2, opts) => `<div class="seg" role="group" aria-label="${label}">${opts.map(([k, l]) => `<button type="button" data-set="${key}:${k}" aria-pressed="${String(cur2) === String(k)}">${l}</button>`).join("")}</div>`;

  return `<div class="brand"><span class="logo"></span>Zuri</div>

}
const tabbar = () => VIEWS.map(([v, i, l]) => `<a href="#${v}" data-go="${v}"${st.view === v ? ' aria-current="page"' : ""}>${ic(i)}${l}</a>`).join("");

/* ---------- gráficos ---------- */
const narrow = () => window.innerWidth < 600;
function chart(id, labels, series, fmt, stacked, W0 = 720, H0 = 260) {
  // no celular o desenho encolhe para o texto do eixo continuar legível
  const W = narrow() ? Math.min(W0, 380) : W0, H = narrow() ? 230 : H0;
  const ml = narrow() ? 44 : 56, mr = 8, mt = 8, mb = 24, w = W - ml - mr, h = H - mt - mb, n = labels.length;
  const bars = series.filter((s) => s.type === "bar"), lines = series.filter((s) => s.type === "line");
  let max = 0;
  for (let i = 0; i < n; i++) max = Math.max(max, stacked ? bars.reduce((t, s) => t + s.v[i], 0) : Math.max(0, ...bars.map((s) => s.v[i])), ...lines.map((s) => s.v[i] || 0));
  const raw = max / 4 || 1, mag = 10 ** Math.floor(Math.log10(raw)), step = [1, 2, 2.5, 5, 10].map((k) => k * mag).find((k) => k >= raw), top = Math.ceil(max / step) * step || 1;
  const y = (v) => mt + h - (v / top) * h, px = w / n, x = (i) => ml + px * (i + 0.5);
  let g = "";
  for (let v = 0; v <= top + 1e-9; v += step) g += `<line x1="${ml}" x2="${W - mr}" y1="${y(v)}" y2="${y(v)}" stroke="var(--grid)"/><text x="${ml - 8}" y="${y(v) + 4}" text-anchor="end">${fmt(v).replace("R$ ", "")}</text>`;
  const every = Math.ceil(n / 12);
  labels.forEach((l, i) => { if (i % every === 0) g += `<text x="${x(i)}" y="${H - 6}" text-anchor="middle">${l}</text>`; });
  const bw = Math.min(30, (px - 8) / (stacked ? 1 : Math.max(1, bars.length)));
  for (let i = 0; i < n; i++) {
    let base = 0;
    bars.forEach((s, k) => {
      const v = s.v[i]; if (!v) return;
      const hh = (v / top) * h, bx = stacked ? x(i) - bw / 2 : x(i) - (bars.length * bw + (bars.length - 1) * 2) / 2 + k * (bw + 2);
      const by = stacked ? y(base + v) : y(v), isTop = !stacked || bars.slice(k + 1).every((o) => !o.v[i]);
      const r = isTop ? Math.min(4, bw / 2, hh) : 0, hd = Math.max(1, hh - (stacked && k > 0 ? 2 : 0));
      g += `<path class="bar" data-bar="${id}:${k}:${i}" data-h="${hh}" d="M${bx},${by + hd}V${by + r}q0,-${r} ${r},-${r}h${bw - 2 * r}q${r},0 ${r},${r}V${by + hd}z" fill="${s.c}"/>`;
      base += v;
    });
  }
  lines.forEach((s) => {
    g += `<polyline points="${s.v.map((v, i) => x(i) + "," + y(v)).join(" ")}" fill="none" stroke="${s.c}" stroke-width="2"${s.dash ? ' stroke-dasharray="5 4"' : ""} stroke-linejoin="round"/>`;
    if (!s.dash && n <= 14) s.v.forEach((v, i) => { g += `<circle cx="${x(i)}" cy="${y(v)}" r="4" fill="${s.c}" stroke="var(--surface)" stroke-width="2"/>`; });
  });
  for (let i = 0; i < n; i++) g += `<rect x="${ml + px * i}" y="${mt}" width="${px}" height="${h}" fill="transparent" data-tip="${esc(JSON.stringify([labels[i], series.map((s) => [s.c, s.name, fmt(s.v[i])])]))}"/>`;
  const legend = series.length > 1 ? `<div class="legend">${series.map((s) => `<span><i class="${s.type === "line" ? "ln" : ""}" style="background:${s.c}"></i>${s.name}</span>`).join("")}</div>` : "";
  const table = `<details class="more" style="margin-top:12px"><summary>Ver tabela</summary><div class="scroll"><table><thead><tr><th>Período</th>${series.map((s) => `<th>${s.name}</th>`).join("")}</tr></thead><tbody>${labels.map((l, i) => `<tr><td>${l}</td>${series.map((s) => `<td class="num">${fmt(s.v[i])}</td>`).join("")}</tr>`).join("")}</tbody></table></div></details>`;
  return `<div class="chart">${legend}<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(series.map((s) => s.name).join(", "))}">${g}</svg>${table}</div>`;
}
const hbars = (items, total, out) => { const max = Math.max(...items.map((x) => x[1])); return `<div class="hb">${items.map(([l, p]) => `<div class="hb-row${out ? " out" : ""}"><span>${l}</span><span class="num">${brl(p * total)}</span><span class="track"><span class="hb-bar" style="width:${(p / max) * 100}%"></span></span></div>`).join("")}</div>`; };
/* as barras crescem do valor antigo para o novo quando um dado chega */
function animateBars() {
  const before = st.prevBars; st.prevBars = {};
  document.querySelectorAll("[data-bar]").forEach((el) => {
    const k = el.dataset.bar, hNew = Number(el.dataset.h); st.prevBars[k] = hNew;
    if (!before || before[k] === hNew) return;
    el.style.transition = "none"; el.style.transform = `scaleY(${(before[k] || 0) / hNew})`;
    requestAnimationFrame(() => requestAnimationFrame(() => { el.style.transition = ""; el.style.transform = ""; }));
  });
}

/* ---------- Atendimentos ---------- */
function vRow(v, next) {
  const open = st.open === v.id, s = ST[v.st], pays = Boolean(PRECO[v.tipo]);
  const end = v.st ? `${v.st === "attended" && v.cents ? `<span class="num muted">${brl2(v.cents)} · ${v.forma}</span>` : ""}<span class="tag ${s[1]}">${s[0]}</span>`

  let form = "";
  if (open) {
    const sug = pays && PRECO[v.tipo][v.local] ? (PRECO[v.tipo][v.local] / 100).toLocaleString("pt-BR", { minimumFractionDigits: 2 }) : "";

    form = `<div class="v-form">

      </div>
      ${pick === "attended" && pays ? `<div class="payline"><span>Recebeu</span><label class="sr" for="val">Valor recebido em reais</label><input class="input num" id="val" inputmode="decimal" placeholder="0,00" value="${v.cents ? (v.cents / 100).toLocaleString("pt-BR", { minimumFractionDigits: 2 }) : sug}"><span>em</span>
        ${FORMAS_PG.map((f) => `<button class="chip" type="button" data-pay="${f}">${f}</button>`).join("")}<button class="btn btn-quiet btn-sm" type="button" data-pay="">Sem pagamento agora</button></div>` : ""}
      ${st.err ? `<p class="err" role="alert">${st.err}</p>` : ""}
    </div>`;
  }
  return `<li class="${open ? "open" : ""}${next ? " next" : ""}"><button class="v-row" type="button" data-open="${v.id}" aria-expanded="${open}"><span class="hr num">${v.h}</span><span class="who"><b>${esc(v.nome)}</b><small>${v.tipo} · ${v.local}</small></span><span class="end">${end}</span></button>${form}</li>`;
}
function viewAtend() {
  const tabs = seg("Partes dos atendimentos", "at", st.at, [["hoje", "Hoje"], ["indicadores", "Indicadores"]]);

      <section class="kpis" aria-label="Indicadores"><div class="kpi"><span class="l">Atendimentos</span><span class="v num">${num(at)}</span><span class="d">${s("consultas")} consultas e ${s("retornos")} retornos</span></div>
        <div class="kpi"><span class="l">Faltas</span><span class="v num">${pct(s("faltas") / (at + s("faltas")))}</span><span class="d">${s("faltas")} horários</span></div>
        <div class="kpi"><span class="l">Pacientes novos</span><span class="v num">${s("novos")}</span><span class="d">primeira consulta</span></div>
        <div class="kpi"><span class="l">Dias até o retorno</span><span class="v num">31</span><span class="d">mediana</span></div></section>
      <div class="grid g2">
        <section class="card"><div class="card-head"><h2>Agenda por situação</h2></div>${chart("ag", labels, [{ name: "Compareceram", c: "var(--s-came)", type: "bar", v: list.map((x) => x.consultas + x.retornos) }, { name: "Sem registro", c: "var(--s-open)", type: "bar", v: list.map((x) => x.abertos) }, { name: "Faltaram", c: "var(--s-miss)", type: "bar", v: list.map((x) => x.faltas) }, { name: "Cancelaram", c: "var(--s-off)", type: "bar", v: list.map((x) => x.cancelados) }], num, true, 460, 240)}</section>

      </div></div>`;
  }
  const done = visits.filter((v) => v.st), p = pend(), later = visits.filter((v) => !v.st && v.h >= AGORA);
  const count = (k) => visits.filter((v) => v.st === k).length, wait = visits.length - done.length;
  const got = visits.reduce((t, v) => t + (v.st === "attended" ? v.cents || 0 : 0), 0), byF = {};
  visits.forEach((v) => { if (v.st === "attended" && v.cents) byF[v.forma] = (byF[v.forma] || 0) + v.cents; });
  const group = (title, list, extra) => (list.length ? `<section><h2 class="group-h">${title}${extra || ""}</h2><ul class="list">${list.map((v) => vRow(v, v === later[0])).join("")}</ul></section>` : "");

      </div>
      <aside class="rail" aria-label="Resumo do dia">
        <section class="card"><p class="muted" style="font-size:var(--t-sm)">Registrados</p><p class="big num">${done.length} de ${visits.length}</p>
          <div class="stack" style="margin:12px 0" role="img" aria-label="${count("attended")} compareceram, ${count("missed")} faltaram, ${count("cancelled")} cancelaram, ${wait} aguardando">${["attended", "missed", "cancelled"].map((k) => (count(k) ? `<i style="flex:${count(k)};background:${ST[k][2]}"></i>` : "")).join("")}${wait ? `<i style="flex:${wait}"></i>` : ""}</div>
          <div class="sum">${["attended", "missed", "cancelled"].map((k) => `<div><span><i style="background:${ST[k][2]}"></i>${k === "attended" ? "Compareceram" : k === "missed" ? "Faltaram" : "Cancelaram"}</span><b class="num">${count(k)}</b></div>`).join("")}<div><span><i style="background:var(--sunken)"></i>Aguardando</span><b class="num">${wait}</b></div></div></section>
        <section class="card"><p class="muted" style="font-size:var(--t-sm)">Recebido hoje</p><p class="big num">${brl2(got)}</p>
          <div class="sum" style="margin-top:12px">${Object.entries(byF).map(([f, c]) => `<div><span>${f}</span><span class="num">${brl2(c)}</span></div>`).join("") || '<span class="muted">Nenhum pagamento ainda.</span>'}</div></section>
      </aside>
    </div></div>`;
}
function saveVisit(status, forma) {
  const v = visits.find((x) => x.id === st.open), before = { st: v.st, cents: v.cents, forma: v.forma };
  let cents = 0;
  if (status === "attended" && forma) {
    cents = Math.round(Number($("#val").value.replace(/\./g, "").replace(",", ".")) * 100);
    if (!(cents > 0) || cents > 10000000) { st.err = "Valor inválido. Use até R$ 100.000,00, por exemplo 280,00."; render(); return; }
  }
  const delta = (cents - (before.st === "attended" ? before.cents || 0 : 0)) / 100;
  Object.assign(v, { st: status, cents, forma: cents ? forma : "" });
  days[days.length - 1].entradas += delta; syncMonth();
  if (cents && !before.cents) entries.unshift({ d: "12/11", t: v.tipo, m: forma + " · Atendimento", who: v.nome, c: cents });
  const nextOpen = pend()[0];
  Object.assign(st, { open: nextOpen ? nextOpen.id : "", pick: "", err: "", last: AGORA });
  render();
  toast(`${v.nome.split(" ")[0]}: ${ST[status][0].toLowerCase()}${cents ? " · " + brl2(cents) + " em " + forma : ""}.`, () => { days[days.length - 1].entradas -= delta; syncMonth(); Object.assign(v, before); if (cents && !before.cents) entries.shift(); st.open = v.id; render(); });
}
let toastTimer = 0;
function toast(text, undo) {
  const el = $("#toast"); el.textContent = text;
  if (undo) { const b = document.createElement("button"); b.type = "button"; b.textContent = "Desfazer"; b.onclick = () => { el.hidden = true; undo(); }; el.appendChild(b); }
  el.hidden = false; clearTimeout(toastTimer); toastTimer = setTimeout(() => { el.hidden = true; }, 6000);
}

/* ---------- Financeiro ---------- */
function viewFin() {
  const tabs = seg("Partes do financeiro", "fin", st.fin, [["lancamentos", "Lançamentos"], ["importar", "Importar planilha"], ["precos", "Preços e despesas"]]);
  let body = "";
  if (st.fin === "lancamentos") {
    const ds = [...new Set(entries.map((e) => e.d))];
    body = `<section class="kpis" style="grid-template-columns:repeat(3,minmax(0,1fr))" aria-label="Novembro"><div class="kpi"><span class="l">Entradas em novembro</span><span class="v num">${brl(cur.entradas)}</span></div><div class="kpi"><span class="l">Saídas</span><span class="v num">${brl(cur.saidas)}</span></div><div class="kpi"><span class="l">Saldo</span><span class="v num">${brl(cur.entradas - cur.saidas)}</span></div></section>
    <div class="toolbar">${seg("Tipo", "x", "tudo", [["tudo", "Tudo"], ["in", "Entradas"], ["out", "Saídas"]])}<label class="sr" for="f-per">Período</label><select class="input" id="f-per" style="min-height:42px"><option>Este mês</option><option>Mês passado</option><option>Este ano</option></select></div>
    <section class="card" aria-label="Lançamentos"><div class="rows">${ds.map((d) => `<p class="day-h num">${d}</p>` + entries.filter((e) => e.d === d).map((e) => `<div class="row"><span class="t">${esc(e.t)}${e.who ? ` · <a href="#financeiro">${esc(e.who)}</a>` : ""}</span><span class="a num${e.c < 0 ? " out" : ""}">${e.c < 0 ? "− " : ""}${brl2(Math.abs(e.c))}</span><span class="m">${e.m}</span></div>`).join("")).join("")}</div></section>`;
  } else if (st.fin === "importar") {
    const head = `<ol class="steps" aria-label="Etapas">${["Escolher", "Conferir", "Gravar"].map((s, i) => `<li${i === st.imp ? ' aria-current="step"' : ""}><b>${i + 1}</b>${s}</li>`).join("")}</ol>`;
    if (st.imp === 0) body = `<div class="narrow grid">${head}<div class="drop">${ic("up", "ic-lg")}<strong>Arraste a planilha para cá</strong><p class="muted">.xlsx ou .csv. A leitura acontece no seu navegador e você confere tudo antes de gravar.</p><button class="btn btn-primary" type="button" data-set="imp:1">Escolher arquivo</button></div>
      <details class="more"><summary>Quais colunas a planilha precisa ter</summary><p class="muted" style="font-size:var(--t-sm)">Data, Nome, Tipo de movimentação e Valor são obrigatórias. Hora, CPF do paciente, Emitiu recibo?, Forma de pagamento e Observação entram quando existem. Limite de 5 MB e 5.000 linhas por arquivo.</p></details>
      <details class="more"><summary>Importações anteriores</summary><div class="kv"><span>02/01/2025 a 30/09/2026</span><span class="num muted">1.812 gravados</span></div><div class="kv"><span>01/10/2026 a 30/10/2026</span><span class="num muted">143 gravados</span></div></details></div>`;
    else if (st.imp === 1) body = `<div class="narrow grid">${head}
      <section class="card"><div class="card-head"><h2>Confira antes de gravar</h2><span class="tag">financeiro-novembro.xlsx</span></div>
        <div class="kv"><b>45 lançamentos novos</b><span class="num">01/11 a 12/11/2026</span></div>
        <div class="kv"><span>Entradas</span><span class="num">38 · R$ 9.860,00</span></div>
        <div class="kv"><span>Saídas</span><span class="num">7 · R$ 3.412,90</span></div>
        <div class="kv"><span>Já estavam gravados</span><span class="num muted">145</span><small>Não entram de novo.</small></div>
        <div class="kv"><span>Linhas ignoradas</span><span class="num muted">3</span><small>2 por data inválida e 1 por valor inválido.</small></div>
        <details class="more" style="margin-top:12px"><summary>Ver uma amostra do que será gravado</summary><div class="scroll"><table><thead><tr><th>Dia</th><th>Tipo</th><th>Forma</th><th>Atendimento</th><th>Valor</th></tr></thead><tbody>
          <tr><td class="num">02/11</td><td>Entrada</td><td>Pix</td><td>Consulta</td><td class="num">R$ 280,00</td></tr><tr><td class="num">03/11</td><td>Saída</td><td>Transferência</td><td>Contabilidade</td><td class="num">R$ 420,00</td></tr><tr><td class="num">04/11</td><td>Entrada</td><td>Dinheiro</td><td>Consulta</td><td class="num">R$ 220,00</td></tr></tbody></table></div><p class="muted" style="font-size:var(--t-sm);margin-top:8px">Nome e CPF não são gravados: fica só a ligação com o contato.</p></details></section>
      <div class="note">${ic("warn")}<div><strong>4 entradas parecem repetir pagamentos já registrados em Atendimentos.</strong> Elas ficam de fora. <label style="display:flex;gap:8px;align-items:center;margin-top:6px"><input type="checkbox" id="rep"> Gravar essas 4 também</label></div></div>
      <div style="display:flex;flex-wrap:wrap;gap:8px"><button class="btn btn-primary" type="button" data-set="imp:2">Gravar 45 lançamentos</button><button class="btn btn-secondary" type="button" data-set="imp:0">Trocar de arquivo</button></div></div>`;
    else body = `<div class="narrow grid">${head}<div class="note ok">${ic("check")}<div><strong>45 lançamentos gravados.</strong> A planilha não foi guardada: se não precisar mais dela, apague do seu computador.</div></div><div><button class="btn btn-primary" type="button" data-set="fin:lancamentos">Ver lançamentos</button></div></div>`;
  } else {
    body = `<div class="grid g2"><section class="card"><div class="card-head"><h2>Preço da consulta</h2><button class="btn btn-secondary btn-sm" type="button">${ic("plus", "ic-sm")}Novo</button></div>
      <div class="kv"><b>Consultório</b><span class="num">R$ 280,00</span><small>Desde 01/01/2026. Antes, R$ 250,00.</small></div>
      <div class="kv"><b>Clínica parceira</b><span class="num">R$ 220,00</span><small>Desde 01/03/2026.</small></div>
      <div class="kv"><b>Domiciliar</b><span class="tag warn">sem preço</span><small>2 consultas em outubro ficaram fora do faturamento estimado.</small></div></section>
    <section class="card"><div class="card-head"><h2>Despesas</h2><button class="btn btn-secondary btn-sm" type="button">${ic("plus", "ic-sm")}Nova</button></div>
      <div class="kv"><b>Aluguel</b><span class="num">R$ 1.800,00 por mês</span></div>
      <div class="kv"><b>Impostos</b><span class="num">6% do faturamento</span></div>
      <div class="kv"><b>Sistema de prontuário</b><span class="num">R$ 189,00 por mês</span></div>
      <div class="kv"><b>Balança nova</b><span class="num">R$ 2.400,00 em 10/09/2026</span></div></section></div>
    <p class="muted" style="font-size:var(--t-sm)">Mudar um valor pede a data em que a mudança começou. Os meses já fechados não mudam sozinhos.</p>`;
  }
  return `<div class="page"><header class="head"><div><h1>Financeiro</h1><p>Entradas e saídas do consultório</p></div>${st.fin === "lancamentos" ? `<button class="btn btn-primary" type="button">${ic("plus")}Novo lançamento</button>` : ""}</header>${tabs}${body}</div>`;
}

/* ---------- Resultados: só o financeiro ---------- */
const PRESETS = [["mes", "Este mês", 1], ["3", "3 meses", 3], ["6", "6 meses", 6], ["12", "12 meses", 12]];
function viewReport() {
  const m = months[22], y = months[10], d = (a, b) => { const r = (a - b) / b; return `<span class="num">${r >= 0 ? "▲" : "▼"} ${pct(Math.abs(r))}</span>`; };
  const fix = 1989, vr = Math.round(m.estimado * 0.06), res = m.estimado - fix - vr, resY = y.estimado * 0.94 - 1689;
  return `<div class="page"><header class="head"><div><p><a href="#resultados" data-set="report:">Relatórios</a></p><h1>Outubro 2026</h1><p>Comparado com outubro de 2025</p></div></header>
  <div class="narrow grid">
    <section class="card"><div class="card-head"><h2>Destaques</h2></div><ul class="hl">
      <li>O caixa registrou <b class="num">${brl(m.entradas)}</b> de entradas e <b class="num">${brl(m.saidas)}</b> de saídas.</li>
      <li>O faturamento estimado foi de <b class="num">${brl(m.estimado)}</b>, ${pct((m.estimado - y.estimado) / y.estimado)} acima de outubro de 2025.</li>
      <li>O resultado estimado ficou em <b class="num">${brl(res)}</b>, com margem de ${pct(res / m.estimado)}.</li></ul></section>
    <section class="card"><div class="card-head"><h2>Demonstrativo</h2></div><div class="scroll"><table class="stmt"><thead><tr><th>Item</th><th>Out/26</th><th>Out/25</th><th>Variação</th></tr></thead><tbody>
      <tr><td>Faturamento estimado</td><td class="num">${brl(m.estimado)}</td><td class="num">${brl(y.estimado)}</td><td>${d(m.estimado, y.estimado)}</td></tr>
      <tr><td>Despesas fixas</td><td class="num">${brl(fix)}</td><td class="num">${brl(1689)}</td><td>${d(fix, 1689)}</td></tr>
      <tr><td>Despesas variáveis</td><td class="num">${brl(vr)}</td><td class="num">${brl(y.estimado * 0.06)}</td><td>${d(vr, y.estimado * 0.06)}</td></tr>
      <tr class="total"><td>Resultado estimado</td><td class="num">${brl(res)}</td><td class="num">${brl(resY)}</td><td>${d(res, resY)}</td></tr>
      <tr><td>Recebido no caixa</td><td class="num">${brl(m.entradas)}</td><td class="num">${brl(y.entradas)}</td><td>${d(m.entradas, y.entradas)}</td></tr>
    </tbody></table></div></section>
    <details class="more"><summary>Ver ponto de equilíbrio, ticket médio e de onde veio a variação</summary><section class="card">
      <div class="kv"><span>Ticket médio</span><b class="num">${brl(m.estimado / m.consultas)}</b></div><div class="kv"><span>Ponto de equilíbrio</span><b class="num">8 consultas</b></div>
      <div class="kv"><span>Variação por volume</span><b class="num">+ ${brl((m.consultas - y.consultas) * 250)}</b></div><div class="kv"><span>Variação por preço</span><b class="num">+ ${brl(m.estimado - y.estimado - (m.consultas - y.consultas) * 250)}</b></div></section></details>
  </div></div>`;
}
function viewRes() {
  if (st.report) return viewReport();
  const tabs = seg("Partes dos resultados", "res", st.res, [["painel", "Painel"], ["relatorios", "Relatórios"]]);
  if (st.res === "relatorios") return `<div class="page"><header class="head"><div><h1>Resultados</h1><p>Fechamentos que saem sozinhos no dia 1º</p></div></header>${tabs}
    <section class="card narrow"><div class="rows">${[["Outubro 2026", "Mensal", true], ["3º trimestre de 2026", "Trimestral"], ["Setembro 2026", "Mensal"], ["Agosto 2026", "Mensal"], ["2025", "Anual"]].map(([l, t, novo]) => `<div class="row"><span class="t"><a href="#resultados" data-set="report:1">${l}</a></span><span class="a">${novo ? '<span class="tag ok">novo</span>' : ""}</span><span class="m">${t}</span></div>`).join("")}</div></section></div>`;
  const n = PRESETS.find((p) => p[0] === st.preset)[2], byDay = st.preset === "mes";
  const list = months.slice(24 - n), prev = months.slice(24 - n - 12, 24 - 12), s = (l, k) => l.reduce((t, x) => t + x[k], 0);
  const A = { ent: s(list, "entradas"), sai: s(list, "saidas"), est: s(list, "estimado") }, B = { ent: s(prev, "entradas"), sai: s(prev, "saidas"), est: s(prev, "estimado") };
  if (byDay) { const f = HOJE.d / 30; B.ent = Math.round(B.ent * f); B.sai = Math.round(B.sai * f); B.est = Math.round(B.est * f); }
  A.saldo = A.ent - A.sai; B.saldo = B.ent - B.sai;
  const kpi = (k, l, dir, live) => { const dif = A[k] - B[k], good = dif * dir >= 0; return `<div class="kpi"><span class="l">${l}</span><span class="v num${live && st.flash ? " flash" : ""}">${brl(A[k])}</span><span class="d num">${st.cmp ? `<b class="${good ? "up" : "down"}">${dif >= 0 ? "▲" : "▼"} ${pct(Math.abs(dif / B[k]))}</b> que em ${byDay ? "nov" : "igual período de"} 2025` : "&nbsp;"}</span></div>`; };
  const labels = byDay ? days.map((x) => String(x.d).padStart(2, "0")) : list.map((x) => MESES[x.m] + "/" + String(x.a).slice(2));
  const ent = byDay ? days.map((x) => x.entradas) : list.map((x) => x.entradas), sai = byDay ? days.map((x) => x.saidas) : list.map((x) => x.saidas);
  const series = st.chart === "receita" ? [{ name: "Recebido", c: "var(--s-in)", type: "bar", v: ent }] : [{ name: "Entradas", c: "var(--s-in)", type: "bar", v: ent }, { name: "Saídas", c: "var(--s-out)", type: "bar", v: sai }];
  if (st.chart === "receita" && !byDay) series.push({ name: "Faturamento estimado", c: "var(--s-est)", type: "line", v: list.map((x) => x.estimado) });
  if (st.chart === "receita" && !byDay && st.cmp) series.push({ name: "Recebido um ano antes", c: "var(--s-cmp)", type: "line", dash: true, v: prev.map((x) => x.entradas) });
  return `<div class="page"><header class="head"><div><h1>Resultados</h1><p>O financeiro do consultório</p></div></header>${tabs}
    <div class="toolbar">${seg("Período", "preset", st.preset, PRESETS)}<label style="display:flex;gap:8px;align-items:center;font-size:var(--t-sm)" class="grow"><input type="checkbox" id="cmp"${st.cmp ? " checked" : ""}> Comparar com o ano anterior</label>
      <span class="live" role="status"><i></i>Ao vivo · último lançamento às <b class="num">${st.last}</b></span></div>
    <section class="kpis" aria-label="Indicadores">${kpi("ent", "Recebido", 1, true)}${kpi("sai", "Saídas", -1)}${kpi("saldo", "Saldo", 1, true)}${kpi("est", "Faturamento estimado", 1)}</section>
    <section class="card"><div class="card-head"><h2>${st.chart === "receita" ? "Recebido" : "Entradas e saídas"}${byDay ? " em novembro, dia a dia" : ""}</h2>${seg("Gráfico", "chart", st.chart, [["receita", "Receita"], ["caixa", "Entradas e saídas"]])}</div>${chart("main", labels, series, brl)}</section>
    <div class="grid g2">
      <section class="card"><div class="card-head"><h2>Por forma de pagamento</h2></div>${hbars(FORMAS, A.ent)}</section>
      <section class="card"><div class="card-head"><h2>Maiores saídas</h2></div>${hbars(SAIDAS, A.sai, true)}</section>
    </div>
    ${byDay ? "" : `<details class="more"><summary>Ver resumo mês a mês</summary><section class="card"><div class="scroll"><table><thead><tr><th>Mês</th><th>Fat. estimado</th><th>Recebido</th><th>Saídas</th><th>Saldo</th></tr></thead><tbody>${list.slice().reverse().map((x) => `<tr><td>${MESES[x.m]}/${String(x.a).slice(2)}</td><td class="num">${brl(x.estimado)}</td><td class="num">${brl(x.entradas)}</td><td class="num">${brl(x.saidas)}</td><td class="num">${brl(x.entradas - x.saidas)}</td></tr>`).join("")}</tbody></table></div></section></details>`}
  </div>`;
}

/* ---------- desenho e eventos ---------- */
function render() {
  $("#side").innerHTML = side();
  $("#tabbar").innerHTML = tabbar();
  $("#main").innerHTML = st.view === "financeiro" ? viewFin() : st.view === "resultados" ? viewRes() : viewAtend();
  animateBars();
  st.flash = false;
}
/* um pagamento que chega de outro lugar (outra aba, o celular): a tela aberta se atualiza sozinha */
function arrive() {
  if (!$("#auto").checked || st.view !== "resultados" || st.report || st.res !== "painel") return;
  const c = [28000, 22000, 9000, 28000][Math.floor(rnd() * 4)], f = FORMAS_PG[Math.floor(rnd() * 4)];
  days[days.length - 1].entradas += c / 100; syncMonth();
  entries.unshift({ d: "12/11", t: c === 9000 ? "Bioimpedância" : "Consulta", m: f + " · Atendimento", who: null, c });
  const t = new Date(); st.last = String(t.getHours()).padStart(2, "0") + ":" + String(t.getMinutes()).padStart(2, "0"); st.flash = true;
  render();
  toast(`Novo pagamento: ${brl2(c)} em ${f}.`);
}
setInterval(arrive, 7000);
document.addEventListener("click", (ev) => {
  const t = ev.target.closest("[data-go],[data-set],[data-open],[data-pick],[data-pay],[data-arrived]");
  if (!t) return;
  const d = t.dataset;
  if (t.tagName === "A") ev.preventDefault();
  if (d.go) { go(d.go); return; }
  if (d.set) { const [k, v] = d.set.split(":"); if (k in st) st[k] = k === "imp" ? Number(v) : k === "report" ? Boolean(v) : v; if (k === "fin" && v !== "importar") st.imp = 0; if (k === "res") st.report = false; st.prevBars = null; }
  if (d.open) { st.open = st.open === d.open ? "" : d.open; st.pick = ""; st.err = ""; }
  if (d.arrived) { visits.find((v) => v.id === d.arrived).arrived = AGORA; st.open = ""; }
  if (d.pick) {
    const v = visits.find((x) => x.id === st.open);
    if (d.pick === "attended" && PRECO[v.tipo]) { st.pick = "attended"; st.err = ""; } else { saveVisit(d.pick, ""); return; }
  }
  if ("pay" in d) { saveVisit("attended", d.pay); return; }
  render();
});
document.addEventListener("change", (ev) => {
  const t = ev.target;
  if (t.id === "tema") { if (t.value) document.documentElement.dataset.theme = t.value; else delete document.documentElement.dataset.theme; }
  if (t.id === "cmp") { st.cmp = t.checked; st.prevBars = null; render(); }
});
const tip = $("#tip");
document.addEventListener("mousemove", (ev) => {
  const r = ev.target.closest?.("[data-tip]");
  if (!r) { tip.hidden = true; return; }
  const [title, rows] = JSON.parse(r.dataset.tip);
  tip.innerHTML = `<b>${esc(title)}</b>` + rows.map(([c, n, v]) => `<div><span><i style="display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:6px;background:${c}"></i>${esc(n)}</span><span class="num">${esc(v)}</span></div>`).join("");
  tip.hidden = false;
  tip.style.left = Math.min(ev.clientX + 14, window.innerWidth - tip.offsetWidth - 8) + "px";
  tip.style.top = Math.min(ev.clientY + 14, window.innerHeight - tip.offsetHeight - 8) + "px";
});
window.addEventListener("hashchange", () => { fromHash(); render(); });
let wasNarrow = narrow();
window.addEventListener("resize", () => { if (narrow() !== wasNarrow) { wasNarrow = narrow(); render(); } });
fromHash();
render();
</script>
</body>
</html>
