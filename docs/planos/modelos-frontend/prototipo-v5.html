/* ---------- Agenda ---------- */
function agenda() {
  const days = [["seg", 9], ["ter", 10], ["qua", 11], ["qui", 12], ["sex", 13], ["sáb", 14], ["dom", 15]];
  const { de, ate } = st.ag;
  const HR = 48;
  const y = (h, m = 0) => (h - de) * HR + (m / 60) * HR;
  const hh = (h) => `${String(h).padStart(2, "0")}:00`;
  const E = {
    0: [[7, 0, 0.5, "Corrida no parque", "07:00", "b"], [9, 0, 1, "Vistoria do apartamento novo", "09:00, Água Verde", "a"], [12, 30, 1, "Almoço com a Bia", "12:30", "a"], [19, 0, 1.5, "Aula de fotografia", "19:00", "b"]],
    1: [[14, 0, 1, "Reunião com a transportadora", "14:00", "a"]],
    2: [[10, 0, 1, "Dentista", "10:00", "a"]],
    3: [[19, 0, 1.5, "Aula de fotografia", "19:00", "b"]],
    4: [[9, 0, 3, "Embalar a cozinha", "09:00 até 12:00", "a"], [18, 30, 1.5, "Jantar na casa da mãe", "18:30", "a"]],
    5: [], 6: [[10, 0, 1, "Feira do bairro", "10:00", "a"]]
  };
  const inside = ([h, m, dur]) => h + m / 60 < ate && h + m / 60 + dur > de;
  const opts = (from, to, sel) => Array.from({ length: to - from + 1 }, (_, k) => from + k).map((h) => `<option value="${h}"${h === sel ? " selected" : ""}>${hh(h)}</option>`).join("");
  const range = `<div class="ag-range" role="group" aria-label="Horário visível"><span class="ag-lbl">${ic("clock", "ic-sm")}Mostrar</span>
      <label class="sr" for="ag-de">Das</label><select id="ag-de" class="input input-sm">${opts(0, ate - 1, de)}</select>
      <span aria-hidden="true">até</span>
      <label class="sr" for="ag-ate">Até</label><select id="ag-ate" class="input input-sm">${opts(de + 1, 24, ate)}</select>
      ${de !== st.agDef.de || ate !== st.agDef.ate ? `<button class="btn btn-quiet btn-sm" type="button" data-ag-reset>Voltar para ${hh(st.agDef.de)} até ${hh(st.agDef.ate)}</button>` : ""}
      <a class="ag-cfg" href="${href("configuracoes")}" data-cfg-open>${ic("settings", "ic-sm")}Mudar o padrão</a></div>`;
  const head = `<header class="pagehead"><div><h1>Agenda</h1><p>Seus eventos do Google Agenda. Quando algo muda lá, muda aqui também.</p></div>
    <div class="actions"><button class="btn btn-primary btn-sm" type="button">${ic("calendar-plus", "ic-sm")}Novo evento</button></div></header>`;
  const bar = `<div class="agenda-bar"><h2>9 a 15 de novembro</h2>
    <div class="navgrp"><button class="iconbtn" type="button" aria-label="Semana anterior">${ic("chevron-left")}</button><button class="btn btn-secondary btn-sm" type="button">Hoje</button><button class="iconbtn" type="button" aria-label="Próxima semana">${ic("chevron-right")}</button></div>
    <div class="seg" role="group" aria-label="Visualização"><button type="button" aria-pressed="false">Dia</button><button type="button" aria-pressed="true">Semana</button><button type="button" aria-pressed="false">Mês</button></div></div>
    ${range}`;
  const n = ate - de;
  const hours = Array.from({ length: n }, (_, k) => `<span>${hh(de + k)}</span>`).join("");
  const col = (i) => {
    const ev = E[i];
    const vis = ev.filter(inside);
    return `<div class="col" role="cell" style="height:${n * HR}px">${vis.map(([h, m, dur, t, sub, c]) => {
      const top = Math.max(y(h, m), 0);
      const bottom = Math.min(y(h, m) + dur * HR, n * HR);
      return `<div class="ev ${c === "b" ? "b" : ""}" style="top:${top + 2}px;height:${bottom - top - 4}px"><b>${t}</b><span class="num">${sub}</span></div>`;
    }).join("")}${i === 0 && 8 + 12 / 60 >= de && 8 + 12 / 60 < ate ? `<div class="nowline" style="top:${y(8, 12)}px" aria-hidden="true"></div>` : ""}</div>`;
  };
  const outRow = (which) => {
    const lists = days.map((_, i) => E[i].filter((e) => !inside(e) && (which === "antes" ? e[0] + e[1] / 60 < de : e[0] + e[1] / 60 >= ate)));
    if (!lists.some((l) => l.length)) return "";
    return `<div class="outrow" role="row"><span class="lbl" role="rowheader">${which === "antes" ? `Antes<span class="sr"> das ${hh(de)}</span>` : `Depois<span class="sr"> das ${hh(ate)}</span>`}</span>${lists.map((l) => `<div role="cell">${l.map((e) => `<span class="ev-out ${e[5] === "b" ? "b" : ""}" title="${e[3]}, ${e[4]}"><b>${e[3]}</b><span class="num">${e[4].slice(0, 5)}</span></span>`).join("")}</div>`).join("")}</div>`;
  };
  const week = `<div class="week" role="table" aria-label="Semana de 9 a 15 de novembro, das ${hh(de)} até ${hh(ate)}">
    <div role="row" style="display:contents"><div class="corner" role="columnheader"><span class="sr">Hora</span></div>${days.map(([d, nn], i) => `<div class="dh${i === 0 ? " today" : ""}" role="columnheader">${d}<b>${i === 0 ? `<span>${nn}</span>` : nn}</b></div>`).join("")}</div>
    <div class="allday" role="row"><span class="lbl" role="rowheader">Dia todo</span>${days.map((_, i) => `<div role="cell">${i === 5 ? '<div class="ev ad"><b>Mudança</b></div>' : ""}</div>`).join("")}</div>
    ${outRow("antes")}
    <div role="row" style="display:contents"><div class="hours" role="rowheader" aria-hidden="true" style="grid-template-rows:repeat(${n},${HR}px)">${hours}</div>${days.map((_, i) => col(i)).join("")}</div>
    ${outRow("depois")}
  </div>
  <p class="legend"><span><i></i>Pessoal</span><span><i class="b"></i>Curso e esporte, só leitura</span><span class="legend-r">O que fica fora do horário escolhido aparece nas linhas “Antes” e “Depois”.</span></p>`;
  const dayVis = E[0].filter(inside);
  const dayOut = E[0].filter((e) => !inside(e));
  const strip = `<div class="daystrip" role="group" aria-label="Dia">${days.map(([d, nn], i) => `<button type="button" aria-pressed="${i === 0}"><span>${d}</span><b>${nn}</b></button>`).join("")}</div>
    <ul class="card day daylist">${dayVis.map(([h, m, dur, t, sub, c]) => dayRow({ when: sub.slice(0, 5), kind: c, t, note: "", sub: sub.length > 5 ? sub.slice(7) : "" })).join("")}</ul>
    ${dayOut.length ? `<p class="daylist-out">${ic("clock", "ic-sm")}Fora do horário: ${dayOut.map((e) => `${e[3]}, ${e[4]}`).join("; ")}</p>` : ""}`;
  return `<div class="page page-wide">${head}${bar}${week}${strip}</div>`;
}

const fold = (s) => s.normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();
function contatos() {
  const tab = st.ct;
  const set = tab === "clientes" ? CLIENTS : tab === "avaliacoes" ? REVIEWS : PEOPLE;
  const found = set.find((p) => p.id === st.p);
  const cur = found || set[0];
  const waiting = REVIEWS.filter((r) => r.st !== "done").length;
  const tabs = `<div class="seg" role="group" aria-label="Mostrar">${[["pessoas", "Pessoas", PEOPLE.length], ["clientes", "Clientes", CLIENTS.length], ["avaliacoes", "Avaliações", waiting]].map(([k, l, n]) => `<button type="button" data-ct="${k}" aria-pressed="${k === tab}">${l} <span class="n">${n}</span></button>`).join("")}</div>`;
  const item = (p, right = "") => `<li data-q="${fold(p.n + " " + (p.sub || ""))}"><button class="pitem" type="button" data-p="${p.id}"${p === cur ? ' aria-current="true"' : ""}>${pav(p)}<span class="pt"><span class="t">${p.n}${p.fav ? ic("star", "fav") : ""}</span><span class="d">${p.sub || ""}</span></span>${right}</button></li>`;
  let list;
  if (tab === "pessoas") {
    const groups = {};
    for (const p of PEOPLE) {
      const k = fold(p.n)[0].toUpperCase();
      if (!groups[k]) groups[k] = [];
      groups[k].push(p);
    }
    list = Object.entries(groups).map(([g, ps]) => `<li class="grp" data-g="${g}" aria-hidden="true">${g}</li>${ps.map((p) => item(p)).join("")}`).join("");
  } else if (tab === "clientes") {
    list = CLIENTS.map((p) => item(p, `<span class="pr"><span class="stage s-${p.stage[0]}"><i></i>${p.stage[1]}</span><span class="num">${p.when}</span></span>`)).join("");
  } else {
    list = REVIEWS.map((r) => item({ ...r, sub: r.text }, `<span class="pr">${stars(r.stars)}<span class="${r.st === "done" ? "num" : "rv-st"}">${r.st === "done" ? "Respondida" : r.st === "low" ? "Nota baixa" : "Para revisar"}</span></span>`)).join("");

    ? `<p class="rv-pub">${ic("circle-check", "ic-sm")}Publicada em <span class="num">${r.pub}</span></p>`
    : `${r.st === "low" ? `<p class="rv-low">${ic("triangle-alert", "ic-sm")}Nota baixa: a Zuri nunca responde sozinha. Você decide.</p>` : ""}

  return `<article class="person review" aria-labelledby="h-p">${back()}
      <header class="person-head">${pav(r, "pav-xl")}<div><h2 id="h-p">${r.n}</h2><p class="role">${stars(r.stars)}<span class="num">${r.when}</span></p></div></header>

  const { de, ate } = st.agDef;
  const opts = (from, to, sel) => Array.from({ length: to - from + 1 }, (_, k) => from + k).map((h) => `<option value="${h}"${h === sel ? " selected" : ""}>${hh2(h)}</option>`).join("");
  const pct = (h) => `${(h / 24) * 100}%`;
  const isDefault = de === 8 && ate === 18;
  const cal = [["var(--cal-a)", "Pessoal", "Sua agenda principal. Dá para criar e mudar eventos.", true], ["var(--cal-b)", "Curso e esporte", "Só leitura: a Zuri mostra, mas não muda.", true], ["var(--control)", "Feriados no Brasil", "Aparecem na linha “Dia todo”.", false]];
  return `<section class="card set-sec" aria-labelledby="h-ag"><h2 id="h-ag">Agenda</h2><p>Como a agenda aparece quando você abre.</p>
      <div class="set-row set-col"><div class="grow"><p class="t" id="cfg-h">Horário que aparece</p><p class="hint">O que fica fora desse horário continua lá, nas linhas “Antes” e “Depois”.</p></div>
        <div class="ctl-pair" role="group" aria-labelledby="cfg-h">
          <label for="cfg-de">Começa às<select id="cfg-de" class="input input-sm">${opts(0, ate - 1, de)}</select></label>
          <label for="cfg-ate">Termina às<select id="cfg-ate" class="input input-sm">${opts(de + 1, 24, ate)}</select></label>
          ${isDefault ? "" : `<button class="btn btn-quiet btn-sm" type="button" data-ag-default>Voltar para 08:00 até 18:00</button>`}</div>
        <div class="hours-bar" role="img" aria-label="Das ${hh2(de)} às ${hh2(ate)}, ${ate - de} horas"><span class="on" style="left:${pct(de)};width:${pct(ate - de)}"><b class="num">${hh2(de)} até ${hh2(ate)}</b></span></div>
        <div class="hours-scale num" aria-hidden="true"><span>00:00</span><span>06:00</span><span>12:00</span><span>18:00</span><span>24:00</span></div></div>
      <div class="set-row"><div class="grow"><p class="t">Ao abrir, mostrar</p><p class="hint">No celular, a agenda abre sempre no dia.</p></div>
        <div class="seg" role="group" aria-label="Ao abrir, mostrar"><button type="button" aria-pressed="false">Dia</button><button type="button" aria-pressed="true">Semana</button><button type="button" aria-pressed="false">Mês</button></div></div>
      <div class="set-row"><div class="grow"><p class="t">A semana começa</p></div>
        <div class="seg" role="group" aria-label="A semana começa"><button type="button" aria-pressed="false">Domingo</button><button type="button" aria-pressed="true">Segunda</button></div></div>
      <div class="set-row"><div class="grow"><p class="t" id="cfg-fds">Mostrar sábado e domingo</p></div><button class="switch" type="button" role="switch" aria-checked="true" aria-labelledby="cfg-fds"></button></div>
      <div class="set-row"><div class="grow"><p class="t">Lembrete dos eventos novos</p><p class="hint">Vale para o que você ou a Zuri criar daqui para frente.</p></div>
        <label class="sr" for="cfg-lb">Lembrete dos eventos novos</label><select id="cfg-lb" class="input input-sm"><option>Sem lembrete</option><option>5 min antes</option><option selected>15 min antes</option><option>1 hora antes</option><option>1 dia antes</option></select></div>
      <div class="set-foot"><button class="btn btn-primary" type="button">Salvar alterações</button></div></section>
    <section class="card set-sec" aria-labelledby="h-cals"><h2 id="h-cals">Agendas que aparecem</h2><p>Escolha quais agendas do Google entram na tela e no resumo da manhã.</p>
      <ul class="cal-list">${cal.map(([c, n, d, on], k) => `<li class="set-row"><span class="cal-dot" style="background:${c}" aria-hidden="true"></span><div class="grow"><p class="t" id="cal-${k}">${n}</p><p class="hint">${d}</p></div><button class="switch" type="button" role="switch" aria-checked="${on}" aria-labelledby="cal-${k}"></button></li>`).join("")}</ul></section>`;
}
function configuracoes() {
  return `<div class="page">
    <header class="pagehead"><div><h1>Configurações</h1><p>Sua conta, a agenda, a segurança e como a Zuri trabalha.</p></div></header>
    <div class="settings"><nav aria-label="Seções das configurações"><ul>${CFG.map(([k, i, l]) => `<li><a href="${href("configuracoes")}" data-cfg="${k}"${k === st.cfg ? ' aria-current="page"' : ""}>${ic(i, "ic-sm")}${l}</a></li>`).join("")}</ul></nav>
      <div>${st.cfg === "agenda" ? cfgAgenda() : cfgConta()}</div></div>
  </div>`;
}

/* ---------- Estados: carregando, vazio, erro, aviso e confirmação ---------- */
function estados() {
  const sk = (w) => `<span class="sk" style="width:${w}"></span>`;
  return `<div class="page">
    <header class="pagehead"><div><h1>Estados das telas</h1><p>Como cada tela se comporta quando carrega, quando está vazia, quando algo falha e quando pede confirmação.</p></div></header>
    <div class="states">
      <section class="card st-card" aria-labelledby="e1"><div class="st-hrow"><h2 id="e1" class="st-h">Carregando</h2><button class="btn btn-quiet btn-sm" type="button" data-replay>${ic("refresh-cw", "ic-sm")}Ver de novo</button></div>
        <div class="st-body ld" data-ld="loading">
          <div class="ld-bar" aria-hidden="true"><i></i></div>
          <div class="ld-skel" role="status" aria-label="Carregando as tarefas">
            <p class="ld-msg"><span class="ld-sig" aria-hidden="true"><i></i></span>Buscando suas tarefas</p>
            ${[["70%", "40%"], ["55%", "30%"], ["80%", "45%"]].map(([a, b]) => `<div class="sk-row"><span class="sk sk-c"></span><span class="sk-txt">${sk(a)}${sk(b)}</span></div>`).join("")}</div>
          <ul class="ld-done" aria-label="Tarefas de hoje">${[["Ligar para a transportadora", "15:00"], ["Pagar a conta de luz", "18:00"], ["Separar livros para doação", "Hoje"]].map(([t, w]) => `<li><span class="ld-c" aria-hidden="true"></span><span class="t">${t}</span><span class="num">${w}</span></li>`).join("")}</ul>
          <p class="sr" aria-live="polite" data-ld-live></p>
        </div>
        <p class="st-note">Uma linha corre no topo na hora. Se passar de 300 ms, entra o esqueleto com um brilho que atravessa e o sinal da Zuri pulsando. Quando chega, cada linha entra no seu lugar, sem pular a tela. Com “Reduzir movimento”, nada se mexe. Depois de 15 segundos aparece “Está demorando mais que o normal”.</p></section>
      <section class="card st-card" aria-labelledby="e2"><h2 id="e2" class="st-h">Vazio</h2>
        <div class="st-body empty"><span class="empty-ic">${ic("notebook")}</span><p class="et">Nenhuma nota ainda</p><p class="ed">Anote uma ideia, uma lista ou peça para a Zuri guardar algo da conversa.</p><button class="btn btn-primary btn-sm" type="button">${ic("plus", "ic-sm")}Nova nota</button></div>
        <p class="st-note">Título, uma frase que explica e uma ação. Nunca uma área em branco.</p></section>
      <section class="card st-card" aria-labelledby="e3"><h2 id="e3" class="st-h">Erro</h2>
        <div class="st-body"><div class="alert" role="alert"><span class="a-ic">${ic("circle-alert")}</span><div><p class="at">Não deu para carregar a agenda</p><p class="ad">A conexão caiu no meio do caminho. O que você escreveu continua aqui.</p>
          <div class="a-acts"><button class="btn btn-secondary btn-sm" type="button">${ic("refresh-cw", "ic-sm")}Tentar de novo</button></div></div></div></div>
        <p class="st-note">O que aconteceu, por quê e o que fazer. O resto da tela continua funcionando.</p></section>
      <section class="card st-card" aria-labelledby="e4"><h2 id="e4" class="st-h">Sem conexão</h2>
        <div class="st-body"><div class="banner" role="status">${ic("wifi-off", "ic-sm")}<span>Você está sem internet. Mostrando o que já estava salvo.</span></div>
          <div class="field" style="margin-top:var(--s4)"><label class="label" for="em">E-mail</label><input id="em" class="input invalid" value="ana@exemplo" aria-invalid="true" aria-describedby="em-e"><p class="err" id="em-e">${ic("circle-alert", "ic-sm")}Falta o final do e-mail, como “.com.br”.</p></div></div>
        <p class="st-note">Erro de campo aparece embaixo do campo, depois que você sai dele, e some quando fica certo.</p></section>
      <section class="card st-card st-wide" aria-labelledby="e5"><h2 id="e5" class="st-h">Confirmação e aviso</h2>
        <div class="st-body st-pair">
          <div class="dialog" role="dialog" aria-modal="false" aria-labelledby="dg-t" aria-describedby="dg-d"><p class="dg-t" id="dg-t">Apagar a nota “Vistoria”?</p><p class="dg-d" id="dg-d">Ela fica 30 dias na lixeira e depois some de vez.</p>
            <div class="dg-acts"><button class="btn btn-quiet btn-sm" type="button">Cancelar</button><button class="btn btn-danger btn-sm" type="button">${ic("trash-2", "ic-sm")}Apagar</button></div></div>
          <div class="toast" role="status">${ic("circle-check", "ic-sm")}<span>Tarefa concluída</span><button class="btn btn-quiet btn-sm" type="button">${ic("undo-2", "ic-sm")}Desfazer</button><button class="iconbtn" type="button" aria-label="Fechar o aviso">${ic("x", "ic-sm")}</button></div>
        </div>
        <p class="st-note">Ação destrutiva sempre pergunta, com o botão dizendo o que faz. Ação simples avisa e deixa desfazer por 8 segundos.</p></section>
    </div>
  </div>`;
}

/* ---------- Identidade visual ---------- */
function identidade() {
  const SW = [["Verde Sinal", "#15803d", "botão principal e foco", "5,0:1 no branco"], ["Verde vivo", "#4ade80", "o mesmo papel no tema escuro", "10,2:1 no grafite"], ["Grafite", "#18181b", "texto e o fundo da marca", "17,7:1 no branco"], ["Zinco", "#5c5c66", "texto de apoio", "6,6:1 no branco"], ["Névoa", "#f4f4f5", "menu e fundos", "superfície"]];
  const TY = [["Título da página", "34 / 600", "t1"], ["Seção", "22 / 600", "t2"], ["Texto", "16 / 400, altura 1,6", "t3"], ["Apoio", "14 / 400", "t4"], ["Rótulo", "13 / 500", "t5"]];
  const icons = [["house", "Início"], ["message-circle", "Conversa"], ["list-todo", "Tarefas"], ["calendar-days", "Agenda"], ["notebook-pen", "Notas"], ["brain", "Memória"], ["clock", "Automações"], ["users", "Contatos"], ["bell", "Avisos"], ["search", "Buscar"], ["mic", "Falar"], ["shield-check", "Segurança"]];
  return `<div class="page">
    <header class="pagehead"><div><h1>Identidade visual</h1><p>Sinal refinado: logomarca, cores, letras, ícones e o jeito de falar.</p></div>
      <div class="actions"><button class="btn btn-secondary btn-sm" type="button">Baixar a marca em SVG</button></div></header>
    <div class="idgrid">
      <section class="card id-wide" aria-labelledby="h-logo"><h2 id="h-logo">Logomarca</h2>
        <div class="id-hero">${logo()}<p>O ponto verde é o sinal da Zuri: ela avisa, você decide. A haste embaixo é você. Juntos lembram um “i” de informação, sem precisar de letra. A onda em volta do ponto só aparece em tamanhos grandes.</p></div>
        <div class="lockups"><span class="lockup on-light">${logo()}<span>Zuri</span></span><span class="lockup on-dark">${logo()}<span>Zuri</span></span></div>
        <div class="appicons" aria-label="Ícone do app em vários tamanhos">${[72, 48, 32, 20].map((n) => `<figure><svg class="logo" style="width:${n}px;height:${n}px" viewBox="0 0 64 64" aria-hidden="true">${LOGO()}</svg><figcaption class="num">${n} px</figcaption></figure>`).join("")}</div>
      </section>
      <section class="card" aria-labelledby="h-cor"><h2 id="h-cor">Cores e contraste</h2>
        <ul class="swatches">${SW.map(([n, h, r, c]) => `<li><span class="sw" style="background:${h}"></span><span><p class="t">${n}</p><p class="d">${r}</p></span><span class="cr"><code>${h}</code><small class="num">${c}</small></span></li>`).join("")}</ul>
        <p class="idnote">Verde no máximo duas vezes por tela. Texto sempre com 4,5:1 ou mais; bordas de campo com 3:1.</p></section>
      <section class="card specimen" aria-labelledby="h-let"><h2 id="h-let">Letras</h2>
        <p class="aa" aria-hidden="true">Aa</p><p class="fn">Figtree, três pesos: 400, 500 e 600</p>
        <ul class="scale">${TY.map(([n, s, c]) => `<li><span class="${c}">${n}</span><small class="num">${s}</small></li>`).join("")}</ul></section>
      <section class="card" aria-labelledby="h-ic"><h2 id="h-ic">Ícones</h2>
        <ul class="icongrid">${icons.map(([n, l]) => `<li><span class="tile">${ic(n)}</span>${l}</li>`).join("")}</ul>
        <p class="idnote">Lucide, traço 1,75, tamanhos 16, 20 e 24. Sempre com nome ao lado ou rótulo para leitor de tela.</p></section>
      <section class="card" aria-labelledby="h-voz"><h2 id="h-voz">Jeito de falar</h2>
        <ul class="voice"><li>Bom dia, Ana. A vistoria é às 9h e a lista do que levar está na nota.</li><li>Montei um plano. Nada foi criado ainda.</li><li>Pronto. Se quiser desfazer, é só pedir.</li></ul>
        <p class="idnote">Na tela de entrar: só a marca e uma frase. Nada sobre canais, etapas de segurança ou como o sistema funciona.</p></section>
    </div>
  </div>`;
}

/* ---------- Entrar: marca e uma frase, sem pistas do sistema ---------- */
function entrar() {
  return `<main id="conteudo" class="login">
    <div class="login-art"><span class="brand">${logo()}<span class="wm">Zuri</span></span>
      <p class="art-head">Tudo o que importa, num só lugar.</p><svg class="art-waves" viewBox="0 0 400 400" aria-hidden="true"><circle cx="200" cy="200" r="20"/><circle cx="200" cy="200" r="78"/><circle cx="200" cy="200" r="128"/><circle cx="200" cy="200" r="184"/></svg></div>
    <div class="login-form"><form class="login-card" onsubmit="return false" aria-labelledby="h-in">
      <span class="brand login-mob">${logo()}<span class="wm">Zuri</span></span>
      <div><h1 id="h-in">Entrar</h1><p class="sub">Que bom te ver de novo.</p></div>
      <div class="field"><label class="label" for="li-e">E-mail</label><span class="with-ic">${ic("mail", "ic-sm")}<input id="li-e" class="input" type="email" autocomplete="username" inputmode="email" placeholder="ana@exemplo.com.br"></span></div>
      <div class="field"><label for="pw" class="label">Senha</label><span class="pw with-ic">${ic("lock", "ic-sm")}<input id="pw" class="input" type="password" autocomplete="current-password"><button class="iconbtn" type="button" aria-label="Mostrar a senha" aria-pressed="false">${ic("eye", "ic-sm")}</button></span></div>
      <div class="turnstile" role="status">${ic("circle-check")}Verificação concluída</div>
      <button class="btn btn-primary btn-block btn-lg" type="submit">Entrar</button>
      <p class="login-foot"><a href="${href("entrar")}">Esqueci minha senha</a></p>
    </form></div></main>`;
}

const SCREEN = { inicio, conversa, tarefas, notas, agenda, contatos, automacoes, memoria, configuracoes, estados, identidade };
function render() {
  const html = document.documentElement;
  html.dataset.theme = st.t;
  html.dataset.screen = st.s;
  document.getElementById("ps").value = st.s;
  document.getElementById("pt").value = st.t;
  const app = document.getElementById("app");
  if (st.s === "entrar") { app.className = ""; app.innerHTML = entrar(); return; }
  app.className = "app";
  app.innerHTML = `${side()}<div class="main">${topbar()}<main id="conteudo">${SCREEN[st.s]()}</main>${st.s === "conversa" ? "" : tabbar()}</div>`;
  if (st.s === "estados" && !params.get("captura")) runLoading();
  const cur = app.querySelector(".settings nav [aria-current]");
  if (cur && cur.scrollIntoView && window.innerWidth <= 820) cur.scrollIntoView({ block: "nearest", inline: "center" });
  const thread = app.querySelector(".thread");
  if (thread) thread.scrollTop = thread.scrollHeight;
}
for (const [id, k] of [["ps", "s"], ["pt", "t"]]) {
  document.getElementById(id).addEventListener("change", (e) => {
    st[k] = pick(e.target.value, { s: SCREENS, t: THEMES }[k]);
    history.replaceState(null, "", href(st.s));
    render();
  });
}
let ldTimer;
function runLoading() {
  const box = document.querySelector("[data-ld]");
  if (!box) return;
  box.dataset.ld = "loading";
  box.querySelector("[data-ld-live]").textContent = "";
  clearTimeout(ldTimer);
  ldTimer = setTimeout(() => { box.dataset.ld = "done"; box.querySelector("[data-ld-live]").textContent = "Tarefas carregadas"; }, 2600);
}
const refocus = (sel) => { const f = document.querySelector(sel); if (f) f.focus(); };
const hint = (msg) => { if (typeof toast === "function") toast(msg); };
document.addEventListener("change", (e) => {
  const id = e.target.id;
  if (id === "ag-de" || id === "ag-ate") {
    st.ag = { de: Number(document.getElementById("ag-de").value), ate: Number(document.getElementById("ag-ate").value) };
    if (st.ag.ate <= st.ag.de) st.ag.ate = st.ag.de + 1;
    render(); refocus("#" + id);
  }
  if (id === "cfg-de" || id === "cfg-ate") {
    st.agDef = { de: Number(document.getElementById("cfg-de").value), ate: Number(document.getElementById("cfg-ate").value) };
    if (st.agDef.ate <= st.agDef.de) st.agDef.ate = st.agDef.de + 1;
    st.ag = { ...st.agDef };
    render(); refocus("#" + id);
    hint(`A agenda vai abrir das ${hh2(st.agDef.de)} às ${hh2(st.agDef.ate)}`);
  }
});
document.addEventListener("input", (e) => {
  if (e.target.id !== "cts") return;
  const q = fold(e.target.value.trim());
  const rows = [...document.querySelectorAll(".plist li[data-q]")];
  rows.forEach((li) => { li.hidden = !!q && !li.dataset.q.includes(q); });
  document.querySelectorAll(".plist li.grp").forEach((g) => {
    let n = g.nextElementSibling, any = false;
    while (n && !n.classList.contains("grp")) { if (!n.hidden) any = true; n = n.nextElementSibling; }
    g.hidden = !any;
  });
  document.querySelector(".ct-none").hidden = rows.some((li) => !li.hidden);
});
document.addEventListener("click", (e) => {
  const t = e.target.closest("button, a");
  if (!t || !t.matches("[data-ag-reset], [data-ag-default], [data-cfg-open], [data-cfg], [data-ct], [data-p], [data-replay]")) return;
  e.stopImmediatePropagation();
  if (t.matches("[data-ag-reset]")) { st.ag = { ...st.agDef }; render(); refocus("#ag-de"); return; }
  if (t.matches("[data-ag-default]")) { st.agDef = { de: 8, ate: 18 }; st.ag = { ...st.agDef }; render(); refocus("#cfg-de"); hint("A agenda volta a abrir das 08:00 às 18:00"); return; }
  if (t.matches("[data-cfg-open]")) {
    e.preventDefault(); st.cfg = "agenda";
    if (typeof go === "function") go("configuracoes"); else { st.s = "configuracoes"; render(); }
    return;
  }
  if (t.matches("[data-cfg]")) {
    e.preventDefault();
    const k = t.dataset.cfg;
    if (k === "conta" || k === "agenda") { st.cfg = k; render(); refocus(`[data-cfg="${k}"]`); } else hint("Esta seção fica fora deste protótipo.");
    return;
  }
  if (t.matches("[data-ct]")) { st.ct = t.dataset.ct; st.p = ""; render(); refocus(`[data-ct="${st.ct}"]`); return; }
  if (t.matches("[data-p]")) {
    st.p = t.dataset.p; render();
    if (st.p) { const pane = document.querySelector(".split-contacts>.pane:last-child"); if (pane) { pane.scrollTop = 0; if (window.innerWidth <= 820) pane.focus(); } }
    else refocus(".pitem[aria-current]");
    return;
  }
  if (t.matches("[data-replay]")) { runLoading(); return; }
});
render();
</script>
</body>
</html>
