<!doctype html>
<html lang="pt-BR" data-model="sinal" data-layout="coluna" data-icons="lucide" data-theme="claro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sinal refinado · Zuri</title>
<!-- Protótipo estático. No app, a Figtree entra como woff2 servida pelo próprio Worker. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600&display=swap">
<style>
:root{
  --s1:4px;--s2:8px;--s3:12px;--s4:16px;--s5:24px;--s6:32px;--s7:48px;--s8:64px;
  --side-w:272px;--rail-w:320px;
  --z-base:0;--z-sticky:10;--z-drawer:20;--z-overlay:30;
  --ease:cubic-bezier(.2,.8,.2,1);--dur:150ms;
}
/* ============ base ============ */
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:400 var(--t-md)/1.5 var(--f-ui);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
button,input,textarea,select{font:inherit;color:inherit}
h1,h2,h3,p{margin:0}
h1,h2,h3{font-weight:var(--w-h);color:var(--ink);text-wrap:balance}
p{text-wrap:pretty}
ul,ol{margin:0;padding:0;list-style:none}
a{color:var(--accent-ink);text-underline-offset:3px;text-decoration-thickness:1px}
a:hover{text-decoration-thickness:2px}
.num{font-variant-numeric:tabular-nums}
.sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
.ic{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
.ic-sm{width:16px;height:16px}
.ic-lg{width:24px;height:24px}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:var(--r-sm)}
.skip{position:absolute;left:var(--s4);top:-100px;z-index:var(--z-overlay);background:var(--surface);color:var(--ink);padding:var(--s3) var(--s4);border-radius:var(--r-sm);box-shadow:0 0 0 2px var(--focus)}
.skip:focus{top:var(--s4)}

/* barra do protótipo (some nas capturas) */
.proto{position:sticky;top:0;z-index:var(--z-overlay)}
.picker{margin:0;border:0;min-width:0;display:flex;flex-wrap:wrap;gap:12px;align-items:center;padding:8px 16px;background:#0b0f19;color:#f8fafc;font:500 13px/1.4 system-ui,sans-serif}
.picker label{display:flex;gap:6px;align-items:center}
.picker select{background:#1a2233;color:#f8fafc;border:1px solid #56627a;border-radius:6px;padding:4px 8px;min-height:32px}
[data-captura] .proto{display:none}

/* ============ moldura ============ */
.app{display:grid;grid-template-columns:var(--side-w) minmax(0,1fr);height:100dvh}
.app.has-rail{grid-template-columns:var(--side-w) minmax(0,1fr) var(--rail-w)}
.side{background:var(--side-bg);color:var(--side-ink);border-right:1px solid var(--side-line);display:flex;flex-direction:column;min-height:0;padding:var(--s3)}
.side-head{display:flex;align-items:center;gap:var(--s1);padding:var(--s1) var(--s1) var(--s3)}
.brand{display:flex;align-items:center;gap:10px;color:var(--side-head);text-decoration:none;font:var(--w-strong) 19px/1 var(--f-ui);margin-right:auto;padding:4px;border-radius:var(--r-sm)}
.logo{width:30px;height:30px;flex:none}
.logo .t{fill:var(--tile)}.logo .m{fill:var(--mark)}.logo .s{fill:var(--signal)}
.side .iconbtn{color:var(--side-muted)}
.side .iconbtn:hover{background:var(--side-hover);color:var(--side-head)}
.side-new{margin-bottom:var(--s2)}
.searchbtn{display:flex;align-items:center;gap:10px;width:100%;min-height:40px;padding:0 10px;border:1px solid var(--side-line);border-radius:var(--r-md);background:transparent;color:var(--side-muted);cursor:pointer;text-align:left}
.searchbtn span{flex:1}
.searchbtn:hover{background:var(--side-hover);color:var(--side-ink)}
kbd{font:500 12px/1 var(--f-ui);padding:3px 6px;border-radius:5px;border:1px solid var(--side-line);color:var(--side-muted);background:transparent}
.nav{margin:var(--s4) 0 0;display:grid;gap:2px}
.nav a{display:flex;align-items:center;gap:12px;min-height:40px;padding:0 10px;border-radius:var(--r-md);color:var(--side-ink);text-decoration:none;font-weight:500;transition:background-color var(--dur) var(--ease)}
.nav a:hover{background:var(--side-hover);color:var(--side-head)}
.nav a[aria-current="page"]{background:var(--side-active-bg);color:var(--side-active-ink);box-shadow:var(--side-active-shadow)}
.nav .count{margin-left:auto;font-size:var(--t-xs);font-weight:600;color:var(--side-muted);font-variant-numeric:tabular-nums}
.nav .count.alert{color:var(--side-head);background:var(--side-active-bg);border-radius:var(--r-pill);min-width:22px;height:22px;display:grid;place-items:center;padding:0 6px}
.side-h{font:600 var(--t-xs)/1 var(--f-ui);color:var(--side-muted);padding:var(--s5) 10px var(--s2)}
.recent{flex:1;min-height:0;overflow:auto}
.recent a{display:block;padding:8px 10px;border-radius:var(--r-md);color:var(--side-ink);text-decoration:none;font-size:var(--t-sm);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.recent a:hover{background:var(--side-hover)}
.account{display:flex;align-items:center;gap:10px;width:100%;padding:8px;border:0;border-radius:var(--r-md);background:transparent;color:var(--side-ink);cursor:pointer;text-align:left;margin-top:var(--s2)}
.account:hover{background:var(--side-hover)}
.account b{display:block;color:var(--side-head);font-weight:600}
.account small{display:block;color:var(--side-muted);font-size:var(--t-xs)}
.avatar{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;flex:none;font:600 14px/1 var(--f-ui);background:var(--accent-soft);color:var(--accent-soft-ink)}
.main{min-width:0;min-height:0;overflow:auto;display:flex;flex-direction:column}
.topbar{display:none}
#conteudo{flex:1 0 auto;display:flex;flex-direction:column;min-height:0}
#conteudo>.fill{flex:1 1 0;min-height:0}

/* ============ peças ============ */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border-radius:var(--r-md);border:1px solid transparent;font-weight:600;font-size:15px;text-decoration:none;cursor:pointer;white-space:nowrap;transition:transform var(--dur) var(--ease),background-color var(--dur) var(--ease)}
.btn:hover{transform:translateY(-1px)}
.btn:active{transform:scale(.97)}
.btn-primary{background:var(--accent);color:var(--on-accent)}
.btn-primary:hover{background:var(--accent-hover)}
.btn-secondary{background:var(--surface);color:var(--ink);border-color:var(--line-strong)}
.btn-secondary:hover{background:var(--hover)}
.btn-quiet{background:transparent;color:var(--ink-2)}
.btn-quiet:hover{background:var(--hover);color:var(--ink)}
.btn:disabled{opacity:.55;cursor:not-allowed;transform:none}
.btn-sm{min-height:36px;padding:0 12px;font-size:14px}
.btn-block{width:100%}
.iconbtn{display:inline-grid;place-items:center;width:40px;height:40px;border-radius:var(--r-md);border:0;background:transparent;color:var(--muted);cursor:pointer;position:relative;flex:none}
.iconbtn:hover{background:var(--hover);color:var(--ink)}
.badge{position:absolute;top:5px;right:4px;min-width:17px;height:17px;padding:0 4px;border-radius:999px;background:var(--accent);color:var(--on-accent);font:700 11px/17px var(--f-ui);text-align:center;font-variant-numeric:tabular-nums}
.field{display:grid;gap:6px}
.field>span:first-child,.label{font-size:var(--t-sm);font-weight:600;color:var(--ink)}
.hint{font-size:var(--t-sm);color:var(--muted)}
.input{width:100%;min-height:44px;padding:0 14px;border-radius:var(--r-md);border:1px solid var(--line-strong);background:var(--surface);color:var(--ink)}
.input::placeholder,textarea::placeholder{color:var(--muted)}
select.input{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:36px}
.with-ic{position:relative}
.with-ic .ic{position:absolute;left:13px;top:50%;translate:0 -50%;color:var(--muted);pointer-events:none}
.with-ic .input{padding-left:40px}
.seg{display:inline-flex;gap:2px;padding:3px;border-radius:var(--r-md);background:var(--sunken);max-width:100%;overflow-x:auto}
.seg button{min-height:36px;padding:0 14px;border:0;border-radius:calc(var(--r-md) - 3px);background:transparent;color:var(--ink-2);font-weight:500;font-size:14px;cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px 0 rgb(0 0 0 / .08),0 0 0 1px var(--line)}
.seg .n{color:var(--muted);font-variant-numeric:tabular-nums;font-weight:500}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg)}
.tag{display:inline-flex;align-items:center;gap:5px;font-size:var(--t-xs);font-weight:500;color:var(--ink-2);background:var(--sunken);border-radius:var(--r-pill);padding:2px 9px;line-height:20px;white-space:nowrap}
.tag-accent{background:var(--accent-soft);color:var(--accent-soft-ink)}
.prio{display:inline-flex;align-items:center;gap:5px;font-size:var(--t-sm);color:var(--ink-2);white-space:nowrap}
.prio.hot{color:var(--warn-ink);font-weight:600}
.late{display:inline-flex;align-items:center;gap:5px;color:var(--danger-ink);font-weight:600;font-size:var(--t-sm)}
.check{width:22px;height:22px;flex:none;border-radius:50%;border:1.5px solid var(--line-strong);background:transparent;cursor:pointer;padding:0;display:grid;place-items:center}
.check:hover{border-color:var(--accent)}
.meta{display:flex;flex-wrap:wrap;align-items:center;gap:4px 14px;font-size:var(--t-sm);color:var(--muted);margin-top:2px}
.meta>span{display:inline-flex;align-items:center;gap:5px}
.switch{width:44px;height:26px;border-radius:999px;border:0;background:var(--line-strong);position:relative;cursor:pointer;flex:none;padding:0}
.switch::after{content:"";position:absolute;left:3px;top:3px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgb(0 0 0 / .2);transition:transform var(--dur) var(--ease)}
.switch[aria-checked="true"]{background:var(--accent)}
.switch[aria-checked="true"]::after{transform:translateX(18px)}
[data-theme="escuro"] .switch[aria-checked="true"]::after{background:var(--on-accent)}
.rowlink{color:inherit;text-decoration:none}
.rowlink:hover{color:var(--accent-ink)}
.more{color:var(--accent-ink);font-weight:600;font-size:var(--t-sm);text-decoration:none;white-space:nowrap}
.more:hover{text-decoration:underline}

/* cabeçalho de página */
.page{width:100%;max-width:1080px;margin:0 auto;padding:var(--s7) var(--s7) var(--s8)}
.page-narrow{max-width:800px}
.pagehead{display:flex;align-items:flex-end;gap:var(--s4);margin-bottom:var(--s6);flex-wrap:wrap}
.pagehead>div:first-child{flex:1;min-width:240px}
.pagehead h1{font-size:var(--t-2xl);line-height:1.2}
.pagehead p{color:var(--muted);margin-top:6px}
.actions{display:flex;gap:var(--s2);flex-wrap:wrap}
.block{margin-top:var(--s7)}
.block-head{display:flex;align-items:baseline;gap:var(--s3);margin-bottom:var(--s3)}
.block-head h2{font-size:var(--t-lg)}
.block-head .more{margin-left:auto}
.block-head .n{color:var(--muted);font-variant-numeric:tabular-nums;font-size:var(--t-sm)}

/* compositor (falar com a Zuri) */
.composer{display:flex;align-items:flex-end;gap:var(--s2);background:var(--surface);border:1px solid var(--line-strong);border-radius:var(--r-xl);padding:10px 10px 10px 18px;box-shadow:var(--shadow-sm)}
.composer:focus-within{border-color:var(--focus);box-shadow:0 0 0 1px var(--focus)}
.composer textarea,.composer input{flex:1;border:0;background:transparent;resize:none;min-height:24px;padding:10px 0;line-height:1.5;outline:none;color:var(--ink)}
.sendbtn{width:40px;height:40px;border-radius:calc(var(--r-xl) - 8px);border:0;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;cursor:pointer;flex:none;transition:transform var(--dur) var(--ease)}
.sendbtn:active{transform:scale(.94)}
.chips{display:flex;flex-wrap:wrap;gap:var(--s2);margin-top:var(--s3)}
.chip{min-height:36px;padding:0 14px;border-radius:var(--r-pill);border:1px solid var(--line);background:transparent;color:var(--ink-2);font-size:14px;font-weight:500;cursor:pointer}
.chip:hover{background:var(--hover);color:var(--ink)}

/* linha do tempo do dia (tarefas, eventos e automações juntos) */
.day{display:grid}
.day li{display:grid;grid-template-columns:76px 14px minmax(0,1fr) auto;gap:0 var(--s3);align-items:start;padding:12px 0;border-top:1px solid var(--line)}
.day li:first-child{border-top:0}
.day time,.day .when{font-size:var(--t-sm);color:var(--ink-2);font-variant-numeric:tabular-nums;padding-top:2px;font-weight:500}
.day .kind{width:14px;height:14px;margin-top:4px;display:grid;place-items:center}
.day .kind i{display:block;width:8px;height:8px;border-radius:50%;background:var(--cal-a)}
.day .kind i.b{background:var(--cal-b)}
.day .kind .check{width:16px;height:16px;border-width:1.5px}
.day .kind .ic{width:15px;height:15px;color:var(--muted)}
.day .t{font-weight:500;color:var(--ink)}
.day .side-note{font-size:var(--t-sm);color:var(--muted);text-align:right;white-space:nowrap;padding-top:2px}
.day.compact li{grid-template-columns:22px minmax(0,1fr) auto}
.day.compact .kind{width:22px;height:22px;margin-top:0}
.day.compact .kind .check{width:20px;height:20px}
.day.compact .kind i{background:var(--line-strong)}
.day li.past .t{color:var(--muted)}

/* lista de atenção */
.attn{display:grid}
.attn li{display:flex;align-items:center;gap:var(--s4);padding:var(--s4) var(--s5)}
.attn li+li{border-top:1px solid var(--line)}
.attn .tile{width:40px;height:40px;border-radius:var(--r-md);display:grid;place-items:center;background:var(--accent-soft);color:var(--accent-soft-ink);flex:none}
.attn .txt{flex:1;min-width:0}
.attn .t{font-weight:600}
.attn p.d{color:var(--muted);font-size:var(--t-sm);margin-top:2px}

/* listas genéricas */
.rows>li{display:flex;align-items:flex-start;gap:var(--s3);padding:14px var(--s5)}
.rows>li+li{border-top:1px solid var(--line)}
.rows .grow{flex:1;min-width:0}
.rows .t{font-weight:500}
.grouph{display:flex;align-items:baseline;gap:var(--s2);font-size:var(--t-sm);font-weight:600;color:var(--ink-2);padding:var(--s5) 0 var(--s2)}
.grouph .n{color:var(--muted);font-weight:500;font-variant-numeric:tabular-nums}

/* ============ Conversa ============ */
.chat{display:flex;flex-direction:column;min-height:0;height:100%}
.chat-head{display:flex;align-items:center;gap:var(--s2);padding:var(--s3) var(--s5);border-bottom:1px solid var(--line);min-height:60px}
.chat-head h1{font-size:var(--t-md);font-weight:600;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.thread{flex:1;min-height:0;overflow:auto}
.thread-in{max-width:760px;margin:0 auto;padding:var(--s6) var(--s5) var(--s5);display:grid;gap:var(--s6)}
.dock{padding:var(--s3) var(--s5) var(--s4)}
.dock-in{max-width:760px;margin:0 auto}
.dock .hint{margin-top:6px;text-align:center;font-size:var(--t-xs)}
.msg-me{justify-self:end;max-width:75%;background:var(--sunken);color:var(--ink);padding:12px 16px;border-radius:var(--r-xl) var(--r-xl) 6px var(--r-xl)}
.msg-z{display:grid;grid-template-columns:28px minmax(0,1fr);gap:var(--s3)}
.msg-z .logo{width:28px;height:28px}
.msg-z .body{display:grid;gap:var(--s3);min-width:0}
.msg-z .say{font:400 var(--t-read)/var(--lh-read) var(--f-read);color:var(--ink)}
.tools{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:var(--t-sm);color:var(--muted)}
.tools span{display:inline-flex;align-items:center;gap:6px}
.tools .ic{color:var(--ok-ink)}
.plan{padding:var(--s5)}
.plan h2{font-size:var(--t-lg);margin-top:2px}
.plan .ph{display:flex;gap:var(--s3);align-items:flex-start}
.plan .ph .tile{width:36px;height:36px;border-radius:var(--r-md);display:grid;place-items:center;background:var(--accent-soft);color:var(--accent-soft-ink);flex:none}
.plan .kicker{font-size:var(--t-sm);color:var(--muted)}
.plan ul{margin:var(--s4) 0;border:1px solid var(--line);border-radius:var(--r-md)}
.plan li{display:grid;grid-template-columns:minmax(0,1fr) auto 96px;gap:4px var(--s4);padding:12px var(--s4);align-items:center}
.plan li .meta{margin:0;order:2;justify-content:flex-end}
.plan li .prio{order:3}
.plan li+li{border-top:1px solid var(--line)}
.plan li .t{font-weight:500}
.plan .status{font-size:var(--t-sm);color:var(--ink-2);display:flex;align-items:center;gap:6px;margin-bottom:var(--s3)}
.plan .row-actions{display:flex;gap:var(--s2);flex-wrap:wrap}
.sugg{font-size:var(--t-xs);color:var(--muted)}
.done-card{padding:var(--s3) var(--s4);display:grid;gap:2px}
.done-card .ok{color:var(--ok-ink);display:inline-flex;align-items:center;gap:6px;font-weight:600;font-size:var(--t-sm)}
.done-card p{font-size:var(--t-sm);color:var(--ink-2);margin-top:2px}

/* ============ Tarefas ============ */
.addrow{display:flex;gap:var(--s2);margin-bottom:var(--s3)}
.addrow .with-ic{flex:1}
.filters{display:flex;gap:var(--s2);align-items:center;flex-wrap:wrap;margin:var(--s5) 0 0}
.filters .with-ic{flex:1;min-width:220px}
.filters select{width:220px}
.tabs-row{display:flex;gap:var(--s3);align-items:center;flex-wrap:wrap}
.task{display:flex;gap:var(--s3);align-items:flex-start;padding:14px var(--s5)}
.task+.task{border-top:1px solid var(--line)}
.task .check{margin-top:1px}
.task .grow{flex:1;min-width:0}
.task .t{font-weight:500}
.task .right{display:flex;flex-direction:column;align-items:flex-end;gap:4px;text-align:right}
.table{width:100%;border-collapse:collapse;font-size:15px}
.table th{font-size:var(--t-xs);font-weight:600;color:var(--muted);text-align:left;padding:10px var(--s4);border-bottom:1px solid var(--line);white-space:nowrap}
.table td{padding:12px var(--s4);border-bottom:1px solid var(--line);vertical-align:middle}
.table tr:last-child td{border-bottom:0}
.table .t{font-weight:500}
.table .first{display:flex;gap:var(--s3);align-items:center}

/* ============ Notas ============ */
.split{display:grid;grid-template-columns:320px minmax(0,1fr);min-height:0;height:100%}
.split>.pane{min-height:0;overflow:auto}
.split>.pane:first-child{border-right:1px solid var(--line);padding:var(--s5) var(--s4)}
.pane-head{display:flex;align-items:center;gap:var(--s2);margin-bottom:var(--s4)}
.pane-head h1{font-size:var(--t-xl);flex:1}
.notelist{margin-top:var(--s3);display:grid;gap:2px}
.notelist a{display:block;padding:12px;border-radius:var(--r-md);text-decoration:none;color:var(--ink)}
.notelist a:hover{background:var(--hover)}
.notelist a[aria-current="true"]{background:var(--sunken)}
.notelist .t{font-weight:600;display:flex;gap:var(--s2)}
.notelist .t span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.notelist .t time{font-weight:400;font-size:var(--t-xs);color:var(--muted);padding-top:2px}
.notelist p{font-size:var(--t-sm);color:var(--muted);margin-top:2px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.editor{max-width:720px;margin:0 auto;padding:var(--s6) var(--s6) var(--s8)}
.editor-bar{display:flex;align-items:center;gap:var(--s2);margin-bottom:var(--s5);flex-wrap:wrap}
.editor-bar .saved{display:inline-flex;align-items:center;gap:6px;font-size:var(--t-sm);color:var(--muted);margin-right:auto}
.editor h2.title{font:var(--w-h) var(--t-3xl)/1.15 var(--f-read);margin-bottom:var(--s2)}
.prose{font:400 var(--t-read)/var(--lh-read) var(--f-read);color:var(--ink);margin-top:var(--s5)}
.prose h3{font:var(--w-strong) var(--t-lg)/1.3 var(--f-ui);margin:var(--s6) 0 var(--s2)}
.prose p{margin:0 0 var(--s3)}
.prose ul{display:grid;gap:6px;margin-bottom:var(--s3)}
.prose li{display:flex;gap:10px;align-items:flex-start}
.prose li .box{width:18px;height:18px;border-radius:5px;border:1.5px solid var(--line-strong);margin-top:5px;flex:none;display:grid;place-items:center}
.prose li .box.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.prose li.on span{color:var(--muted);text-decoration:line-through}

/* ============ Agenda ============ */
.agenda-bar{display:flex;align-items:center;gap:var(--s2);flex-wrap:wrap;margin-bottom:var(--s4)}
.agenda-bar h2{font-size:var(--t-lg);margin-right:auto}
.week{display:grid;grid-template-columns:56px repeat(7,minmax(0,1fr));border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden;background:var(--surface)}
.week .dh{padding:10px 8px;border-bottom:1px solid var(--line);border-left:1px solid var(--line);font-size:var(--t-sm);color:var(--muted);text-align:center}
.week .dh b{display:block;font-size:var(--t-xl);font-weight:var(--w-h);color:var(--ink);font-variant-numeric:tabular-nums;line-height:1.2}
.week .dh.today b{color:var(--accent-ink)}
.week .dh.today b span{display:inline-grid;place-items:center;min-width:36px;height:36px;border-radius:50%;background:var(--accent);color:var(--on-accent)}
.week .corner{border-bottom:1px solid var(--line)}
.week .allday{grid-column:1/-1;display:grid;grid-template-columns:56px repeat(7,minmax(0,1fr));border-bottom:1px solid var(--line);min-height:34px}
.week .allday .lbl{font-size:12px;color:var(--muted);padding:9px 6px;text-align:right;white-space:nowrap}
.week .hours{display:grid;grid-template-rows:repeat(13,44px)}
.week .hours span{font-size:var(--t-xs);color:var(--muted);text-align:right;padding:0 8px;translate:0 -8px;font-variant-numeric:tabular-nums}
.week .col{position:relative;border-left:1px solid var(--line);background-image:linear-gradient(var(--line) 1px,transparent 1px);background-size:100% 44px}
.ev{position:absolute;left:4px;right:4px;border-radius:var(--r-sm);padding:4px 8px;font-size:var(--t-xs);line-height:1.3;overflow:hidden;background:var(--accent-soft);color:var(--accent-soft-ink);border-left:3px solid var(--cal-a)}
.ev b{display:block;font-weight:600;font-size:var(--t-sm);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev.b{background:var(--sunken);color:var(--ink-2);border-left-color:var(--cal-b)}
.ev.ad{position:static;margin:4px;display:flex;align-items:center}
.nowline{position:absolute;left:0;right:0;height:2px;background:var(--now)}
.nowline::before{content:"";position:absolute;left:-5px;top:-4px;width:10px;height:10px;border-radius:50%;background:var(--now)}
.legend{display:flex;gap:var(--s4);flex-wrap:wrap;font-size:var(--t-sm);color:var(--ink-2);margin-top:var(--s3)}
.legend span{display:inline-flex;align-items:center;gap:8px}
.legend i{width:10px;height:10px;border-radius:3px;background:var(--cal-a)}
.legend i.b{background:var(--cal-b)}
.daystrip{display:none}
.daylist{display:none}

/* ============ Automações ============ */
.auto{display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:var(--s4);align-items:center;padding:var(--s4) var(--s5)}
.auto+.auto{border-top:1px solid var(--line)}
.auto .tile{width:40px;height:40px;border-radius:var(--r-md);display:grid;place-items:center;background:var(--sunken);color:var(--ink-2)}
.auto .t{font-weight:600}
.auto .ctl{display:flex;align-items:center;gap:var(--s2)}
.state{display:inline-flex;align-items:center;gap:6px;font-size:var(--t-sm);font-weight:600}
.state.on{color:var(--ok-ink)}
.state.wait{color:var(--warn-ink)}
.state.off{color:var(--muted)}
.state i{width:8px;height:8px;border-radius:50%;background:currentColor}
.runs li{display:grid;grid-template-columns:120px minmax(0,1fr) auto;gap:var(--s4);padding:12px var(--s5);align-items:center;font-size:15px}
.runs li+li{border-top:1px solid var(--line)}
.runs time{color:var(--ink-2);font-variant-numeric:tabular-nums}

/* ============ Memória ============ */
.mem-add{display:grid;grid-template-columns:minmax(0,1fr) 180px auto;gap:var(--s2);align-items:end;padding:var(--s4) var(--s5)}
.mem li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:var(--s2) var(--s4);padding:var(--s4) var(--s5);align-items:start}
.mem li+li{border-top:1px solid var(--line)}
.mem .fact{font:400 var(--t-read)/1.5 var(--f-read);color:var(--ink)}
.mem .meta{margin-top:8px}
.mem .acts{display:flex;gap:2px}

/* ============ Configurações ============ */
.settings{display:grid;grid-template-columns:200px minmax(0,1fr);gap:var(--s7);align-items:start}
.settings nav ul{display:grid;gap:2px}
.settings nav a{display:flex;align-items:center;gap:10px;min-height:40px;padding:0 12px;border-radius:var(--r-md);text-decoration:none;color:var(--ink-2);font-weight:500}
.settings nav a:hover{background:var(--hover);color:var(--ink)}
.settings nav a[aria-current="page"]{background:var(--sunken);color:var(--ink)}
.set-sec{padding:var(--s5)}
.set-sec+.set-sec{margin-top:var(--s5)}
.set-sec h2{font-size:var(--t-lg)}
.set-sec>p{color:var(--muted);margin-top:4px}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:var(--s4);margin-top:var(--s5)}
.form-grid .wide{grid-column:1/-1}
.set-row{display:flex;align-items:center;gap:var(--s4);padding:var(--s4) 0;border-top:1px solid var(--line)}
.set-row:first-of-type{border-top:0}
.set-row .grow{flex:1}
.set-row .t{font-weight:600}
.set-foot{display:flex;justify-content:flex-end;margin-top:var(--s5)}

/* ============ Entrar ============ */
#conteudo.login{min-height:100dvh;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);background:var(--bg)}
[data-captura] #conteudo.login{height:100dvh;min-height:0}
.login-art{display:flex;flex-direction:column;justify-content:space-between;padding:var(--s7);background:var(--side-bg);border-right:1px solid var(--side-line);color:var(--side-ink);min-height:0;overflow:hidden}
.login-art .brand{font-size:22px}
.login-art .logo{width:36px;height:36px}
.login-form{display:grid;place-items:center;padding:var(--s7) var(--s5)}
.login-card{width:100%;max-width:380px;display:grid;gap:var(--s4)}
.login-card h1{font-size:var(--t-2xl)}
.login-card .sub{color:var(--muted);margin-top:-8px}
.turnstile{display:flex;align-items:center;gap:var(--s3);min-height:56px;padding:0 var(--s4);border:1px solid var(--line);border-radius:var(--r-md);background:var(--sunken);font-size:var(--t-sm);color:var(--ink-2)}
.turnstile .ic{color:var(--ok-ink)}
.login-foot{display:flex;align-items:center;justify-content:space-between;gap:var(--s3);font-size:var(--t-sm);color:var(--muted)}
.pw{position:relative}
.pw .iconbtn{position:absolute;right:2px;top:2px}
.pw .input{padding-right:48px}
.login-mob{display:none}
.task .mob-meta{display:none}

/* ============ variações por modelo ============ */
/* Sinal: conversa primeiro, uma coluna, verde só onde a Zuri age */

/* Painel: menu escuro, painel lateral "Agora", tudo em tabela */
.rail{border-left:1px solid var(--line);background:var(--surface);overflow:auto;padding:var(--s5)}
.rail h2{font-size:var(--t-sm);font-weight:600;color:var(--muted);margin:0 0 var(--s3)}
.rail section+section{margin-top:var(--s6)}
.next-ev{border:1px solid var(--line);border-radius:var(--r-lg);padding:var(--s4)}
.next-ev .when{font-size:var(--t-sm);color:var(--accent-ink);font-weight:600}
.next-ev .t{font-size:var(--t-lg);font-weight:600;margin-top:4px}
.next-ev .meta{margin-top:var(--s2)}
.rail .attn li{padding:var(--s3) 0}
.rail .attn .tile{width:32px;height:32px}
.rail .mini li{display:grid;grid-template-columns:52px minmax(0,1fr);gap:var(--s2);padding:8px 0;font-size:15px}
.rail .mini li+li{border-top:1px solid var(--line)}
.rail .mini time{color:var(--ink-2);font-variant-numeric:tabular-nums}
.cmdbar{display:flex;align-items:center;gap:var(--s2);border:1px solid var(--line-strong);border-radius:var(--r-lg);background:var(--surface);padding:6px 6px 6px 14px;box-shadow:var(--shadow-sm)}
.cmdbar:focus-within{border-color:var(--focus);box-shadow:0 0 0 1px var(--focus)}
.cmdbar>.ic{color:var(--accent-ink)}
.cmdbar input{flex:1;border:0;background:transparent;outline:none;min-height:40px}
.sched{position:relative;display:grid;grid-template-columns:52px minmax(0,1fr)}
.sched .hrs{display:grid;grid-template-rows:repeat(14,40px)}
.sched .hrs span{font-size:var(--t-xs);color:var(--muted);text-align:right;padding-right:10px;translate:0 -8px;font-variant-numeric:tabular-nums}
.sched .lane{position:relative;background-image:linear-gradient(var(--line) 1px,transparent 1px);background-size:100% 40px;border-left:1px solid var(--line)}
.sched .ev{left:8px;right:8px}
.sched .tk{position:absolute;left:8px;right:8px;display:flex;align-items:center;gap:8px;font-size:var(--t-sm);color:var(--ink);height:24px;padding:0 8px;border:1px dashed var(--line-strong);border-radius:var(--r-sm);background:var(--surface)}
.sched .tk .ic{color:var(--muted)}
.sched .tk.hot .ic{color:var(--warn-ink)}
.grid-2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:var(--s5);margin-top:var(--s5)}
.panel{padding:var(--s4) var(--s5) var(--s5)}
.panel-h{display:flex;align-items:baseline;gap:var(--s3);margin-bottom:var(--s4)}
.panel-h h2{font-size:var(--t-md)}
.panel-h .more{margin-left:auto}
.convlist{border-right:1px solid var(--line);padding:var(--s4);overflow:auto;min-height:0}
.convlist a{display:block;padding:10px 12px;border-radius:var(--r-md);text-decoration:none;color:var(--ink);font-size:15px}
.convlist a[aria-current="page"]{background:var(--sunken);font-weight:600}
.convlist a:hover{background:var(--hover)}
.convlist .grouph{padding:var(--s4) 12px var(--s1)}

/* Caderno: texto da Zuri em serifa, sem caixas, a página é o caderno */
.who{display:none;gap:8px;font-size:var(--t-xs);font-weight:600;color:var(--muted);margin-bottom:4px;font-family:var(--f-ui)}

/* ============ celular ============ */
@media (max-width:820px){
  .app,.app.has-rail{grid-template-columns:1fr}
  .side,.rail{display:none}
  .topbar{display:flex;align-items:center;gap:var(--s1);position:sticky;top:0;z-index:var(--z-sticky);background:var(--bg);border-bottom:1px solid var(--line);padding:calc(var(--s2) + env(safe-area-inset-top)) var(--s2) var(--s2);min-height:60px}
  .topbar .brand{color:var(--ink);font-size:18px}
  .pagehead{margin-bottom:var(--s5)}
  .pagehead h1{font-size:var(--t-xl)}
  .actions .btn{flex:1}
   .hello h1{font-size:28px}
   .hello p{font-size:var(--t-md)}
  .attn li{padding:var(--s4);flex-wrap:wrap}
  .attn li .btn{width:100%}
  .day li{grid-template-columns:56px 14px minmax(0,1fr);}
  .day.compact li{grid-template-columns:22px minmax(0,1fr) auto}
  .day .side-note{grid-column:3;text-align:left;padding-top:0}
  .rows>li,.task,.auto,.mem li,.runs li{padding-left:var(--s4);padding-right:var(--s4)}
  .task .right{display:none}
  .task .mob-meta{display:flex}
  .filters select{width:100%}
  .addrow .btn span{display:none}
  .table thead{display:none}
  .table tr{display:grid;grid-template-columns:auto 1fr;padding:12px var(--s4);border-bottom:1px solid var(--line)}
  .table td{border:0;padding:0}
  .table td.c-prj,.table td.c-due,.table td.c-pri{grid-column:2;font-size:var(--t-sm);color:var(--muted);padding-top:2px}
  .table td.c-first{grid-column:1/-1}
  .split>.pane:last-child,.convlist{display:none}
  .split>.pane:first-child{border-right:0;padding:var(--s4)}
  .thread-in{padding:var(--s5) var(--s4)}
  .dock{padding:var(--s2) var(--s3) calc(var(--s3) + env(safe-area-inset-bottom))}
  .dock .hint{display:none}
  .msg-me{max-width:88%}
  .msg-z{grid-template-columns:minmax(0,1fr)}
  .msg-z>.logo{display:none}
   .msg-z .body::before{content:"Zuri";font-size:var(--t-xs);font-weight:600;color:var(--muted)}
  .chat-head{padding:var(--s2) var(--s4)}
  .plan{padding:var(--s4)}
  .plan li{grid-template-columns:minmax(0,1fr) auto}
  .plan li .meta{grid-column:1;justify-content:flex-start}
  .plan li .prio{grid-row:1;grid-column:2}
  .plan .row-actions .btn{flex:1}
  .week,.legend{display:none}
  .daystrip{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:var(--s4)}
  .daystrip button{display:grid;gap:2px;justify-items:center;padding:8px 0;border:0;border-radius:var(--r-md);background:transparent;color:var(--muted);font-size:var(--t-xs);cursor:pointer}
  .daystrip button b{font-size:var(--t-lg);color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}
  .daystrip button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
  .daystrip button[aria-pressed="true"] b{color:var(--on-accent)}
  .daylist{display:block}
  .agenda-bar .seg{order:3;width:100%}
  .auto{grid-template-columns:40px minmax(0,1fr)}
  .auto .ctl{grid-column:1/-1;justify-content:flex-start}
  .runs li{grid-template-columns:1fr;gap:2px}
  .mem-add{grid-template-columns:1fr}
  .mem li{grid-template-columns:1fr}
  .mem .acts{justify-content:flex-start;margin-left:-10px}
  .settings{grid-template-columns:1fr;gap:var(--s4)}
  .settings nav ul{display:flex;overflow-x:auto;gap:4px}
  .settings nav a{white-space:nowrap}
  .form-grid{grid-template-columns:1fr}
  .set-sec{padding:var(--s4)}
  #conteudo.login{grid-template-columns:1fr}
  .login-art{display:none}
  .login-form{align-content:start;padding:var(--s7) var(--s5)}
  .login-mob{display:flex;margin-bottom:var(--s4)}
  .login-mob.brand{color:var(--ink)}
}

/* ============ rodada 4: peças comuns ============ */
h1,h2,h3{font-family:var(--f-head)}
.ic{stroke-width:var(--ic-sw)}
.ic.ic-fill{fill:currentColor;stroke:none}
[data-icons="lucide-sq"] .ic{stroke-linecap:square;stroke-linejoin:miter}
.logo .t{fill:var(--tile)}.logo .m{fill:var(--mark)}.logo .s{fill:var(--signal)}
.logo .ms{fill:none;stroke:var(--mark)}.logo .ss{fill:none;stroke:var(--signal)}.logo .tg{stroke:var(--tile)}
.wm{font-family:var(--f-head)}
.hello h1{font-size:var(--t-3xl);line-height:1.15}
.hello p{font-size:var(--t-lg);color:var(--ink-2);margin-top:var(--s2);max-width:56ch}
.hello{margin-bottom:var(--s5)}
.composer-lg{padding:12px 12px 12px 20px}
.composer-lg textarea{min-height:52px;font-size:17px}

/* entrar: marca, frase e nada mais */
.login-art{background:var(--art-bg);color:var(--art-ink);border-right:0;position:relative}
.login-art .brand{color:var(--art-head);position:relative}
.art-head{font:var(--w-h) 46px/1.1 var(--f-head);color:var(--art-head);max-width:13ch;text-wrap:balance;position:relative}
.login-art .art-mark{position:absolute;right:-110px;bottom:-110px;width:460px;height:460px;opacity:.16;pointer-events:none}
.art-mark .t{display:none}
.login-foot{justify-content:flex-start}

/* trabalho delegado (Início do trilho) */
.work{display:grid}
.work li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px var(--s4);align-items:center;padding:var(--s4) var(--s5)}
.work li+li{border-top:1px solid var(--line)}
.work .t{font-weight:600}
.work .d{font-size:var(--t-sm);color:var(--muted);margin-top:2px}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:var(--t-xs);font-weight:600;border-radius:var(--r-pill);padding:2px 10px;line-height:20px;white-space:nowrap;margin-bottom:6px}
.pill.wait{background:var(--warn-soft);color:var(--warn-ink)}
.pill.run{background:var(--accent-soft);color:var(--accent-soft-ink)}
.pill.done{background:var(--sunken);color:var(--ok-ink)}

/* Início do topo: duas colunas */
.page-wide{max-width:1200px}
.topo-grid{display:grid;grid-template-columns:minmax(0,1fr) 420px;gap:var(--s7);align-items:start}
.topo-grid .panel .day li{grid-template-columns:52px 14px minmax(0,1fr)}
.topo-grid .panel .day .side-note{grid-column:3;text-align:left;padding-top:2px}

/* Identidade visual */
.idgrid{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:var(--s5);align-items:start}
.idgrid>.card{padding:var(--s5)}
.idgrid h2{font-size:var(--t-lg);margin-bottom:var(--s4)}
.id-wide{grid-column:1/-1}
.id-hero{display:grid;grid-template-columns:auto minmax(0,1fr);gap:var(--s5);align-items:center}
.id-hero .logo{width:132px;height:132px}
.id-hero p{color:var(--ink-2);font:400 var(--t-read)/1.55 var(--f-read)}
.lockups{display:flex;gap:var(--s3);flex-wrap:wrap;margin-top:var(--s5)}
.lockup{display:inline-flex;align-items:center;gap:10px;padding:14px 20px;border-radius:var(--r-lg);font:var(--w-strong) 22px/1 var(--f-head)}
.lockup .logo{width:32px;height:32px}
.lockup.on-light{background:#ffffff;color:#111111;border:1px solid #e5e5e5}
.lockup.on-dark{background:#111111;color:#ffffff}
.lockup.on-brand{background:var(--art-bg);color:var(--art-head)}
.appicons{display:flex;align-items:flex-end;gap:var(--s5);flex-wrap:wrap;margin-top:var(--s5)}
.appicons figure{margin:0;display:grid;justify-items:center;gap:6px;font-size:var(--t-xs);color:var(--muted)}
.swatches li{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:var(--s3);align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.swatches li:first-child{border-top:0;padding-top:0}
.sw{width:44px;height:44px;border-radius:var(--r-md);box-shadow:inset 0 0 0 1px rgb(0 0 0 / .12)}
.swatches .t{font-weight:600}
.swatches .d{font-size:var(--t-sm);color:var(--muted)}
.swatches code{font:500 var(--t-sm)/1 var(--f-ui);color:var(--ink-2);font-variant-numeric:tabular-nums}
.specimen .aa{font:var(--w-h) 76px/1 var(--f-head);color:var(--ink)}
.specimen .fn{font-weight:600;margin-top:var(--s3)}
.specimen .h{font:var(--w-h) var(--t-2xl)/1.2 var(--f-head);margin-top:var(--s4)}
.specimen .b{font:400 var(--t-read)/var(--lh-read) var(--f-read);color:var(--ink-2);margin-top:var(--s2)}
.icongrid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:var(--s3)}
.icongrid li{display:grid;justify-items:center;gap:6px;font-size:var(--t-xs);color:var(--muted);text-align:center}
.icongrid .tile{width:52px;height:52px;border-radius:var(--r-md);display:grid;place-items:center;background:var(--sunken);color:var(--ink)}
.icongrid .ic{width:24px;height:24px}
.voice{display:grid;gap:var(--s3)}
.voice li{font:400 var(--t-read)/1.5 var(--f-read);color:var(--ink);padding-left:var(--s4);border-left:2px solid var(--accent)}
.idnote{font-size:var(--t-sm);color:var(--muted);margin-top:var(--s3)}

/* Espaçoso: o dobro de respiro */

@media (max-width:820px){
  .idgrid{grid-template-columns:1fr;gap:var(--s5)}
  .id-hero{grid-template-columns:1fr}
  .id-hero .logo{width:96px;height:96px}
  .icongrid{grid-template-columns:repeat(4,minmax(0,1fr))}
}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{transition-duration:0s !important;animation-duration:0s !important}
  .btn:hover,.btn:active,.sendbtn:active{transform:none}
}

/* ================= Sinal refinado ================= */
/* Tokens: neutros zinco (70 a 90% da tela), um verde de ação, cores de estado com texto e ícone. */
:root{
  --f-ui:"Figtree",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;--f-read:var(--f-ui);--f-head:var(--f-ui);
  --w-h:600;--w-strong:600;--w-mid:500;
  --r-sm:8px;--r-md:10px;--r-lg:14px;--r-xl:20px;--r-pill:999px;--lh-read:1.6;--t-read:16px;--ic-sw:1.75;
  --t-xs:13px;--t-sm:14px;--t-md:16px;--t-lg:18px;--t-xl:22px;--t-2xl:28px;--t-3xl:34px;--t-4xl:40px;
  --dur-1:120ms;--dur-2:180ms;--dur-3:240ms;--ease-out:cubic-bezier(.2,.8,.2,1);
  --side-w:272px;
}
[data-theme="claro"]{
  color-scheme:light;
  --bg:#fafafa;--surface:#ffffff;--raised:#ffffff;--sunken:#f4f4f5;--hover:#f4f4f5;--press:#e9e9ec;
  --line:#e4e4e7;--line-soft:#efeff1;--line-strong:#d4d4d8;--control:#8b8b94;
  --ink:#18181b;--ink-2:#3f3f46;--muted:#5c5c66;
  --accent:#15803d;--accent-hover:#166534;--on-accent:#ffffff;--accent-ink:#15803d;--accent-soft:#ecfdf3;--accent-soft-ink:#14532d;--focus:#15803d;--ring:rgb(21 128 61 / .22);
  --warn-ink:#a14b07;--warn-soft:#fff7e6;--warn-line:#f8d79b;--danger-ink:#b91c1c;--danger-soft:#fef2f2;--danger-line:#fecaca;--danger:#b91c1c;--ok-ink:#15803d;
  --cal-a:#16a34a;--cal-a-soft:#ecfdf3;--cal-a-ink:#14532d;--cal-b:#0369a1;--cal-b-soft:#eff8ff;--cal-b-ink:#0c4a6e;--now:#dc2626;
  --side-bg:#f4f4f5;--side-ink:#3f3f46;--side-head:#18181b;--side-muted:#5c5c66;--side-hover:#e9e9ec;--side-active-bg:#ffffff;--side-active-ink:#18181b;--side-line:#e4e4e7;
  --side-active-shadow:0 1px 2px rgb(24 24 27 / .06),0 0 0 1px rgb(24 24 27 / .06);
  --shadow-xs:0 1px 2px rgb(24 24 27 / .05);
  --shadow-sm:0 1px 2px rgb(24 24 27 / .04),0 1px 3px rgb(24 24 27 / .06);
  --shadow-md:0 1px 2px rgb(24 24 27 / .04),0 8px 24px -6px rgb(24 24 27 / .10);
  --shadow-lg:0 2px 4px rgb(24 24 27 / .04),0 16px 40px -8px rgb(24 24 27 / .18);
  --tile:#18181b;--mark:#ffffff;--signal:#22c55e;--art-bg:#18181b;--art-ink:#d4d4d8;--art-head:#fafafa;
  --sk:#e9e9ec;--sk-hi:#fafafa;
}
[data-theme="escuro"]{
  color-scheme:dark;
  --bg:#111113;--surface:#18181b;--raised:#1f1f23;--sunken:#222226;--hover:#26262b;--press:#2e2e34;
  --line:rgb(255 255 255 / .08);--line-soft:rgb(255 255 255 / .05);--line-strong:rgb(255 255 255 / .14);--control:#6e6e78;
  --ink:#ededef;--ink-2:#c9c9cf;--muted:#a1a1aa;
  --accent:#4ade80;--accent-hover:#86efac;--on-accent:#052e16;--accent-ink:#4ade80;--accent-soft:#12291c;--accent-soft-ink:#bbf7d0;--focus:#4ade80;--ring:rgb(74 222 128 / .25);
  --warn-ink:#fbbf24;--warn-soft:#2a210f;--warn-line:#5c4614;--danger-ink:#fca5a5;--danger-soft:#2a1414;--danger-line:#5c2323;--danger:#dc2626;--ok-ink:#4ade80;
  --cal-a:#4ade80;--cal-a-soft:#13291d;--cal-a-ink:#bbf7d0;--cal-b:#38bdf8;--cal-b-soft:#0f2433;--cal-b-ink:#bae6fd;--now:#f87171;
  --side-bg:#0c0c0e;--side-ink:#c9c9cf;--side-head:#ededef;--side-muted:#a1a1aa;--side-hover:#1a1a1e;--side-active-bg:#222226;--side-active-ink:#fafafa;--side-line:rgb(255 255 255 / .06);
  --side-active-shadow:inset 0 0 0 1px rgb(255 255 255 / .06);
  --shadow-xs:none;--shadow-sm:none;
  --shadow-md:0 0 0 1px rgb(255 255 255 / .06),0 8px 24px -6px rgb(0 0 0 / .5);
  --shadow-lg:0 0 0 1px rgb(255 255 255 / .08),0 16px 40px -8px rgb(0 0 0 / .6);
  --tile:#26262b;--mark:#fafafa;--signal:#4ade80;--art-bg:#0c0c0e;--art-ink:#c9c9cf;--art-head:#fafafa;
  --sk:#232328;--sk-hi:#2c2c32;
}

/* ---------- base ---------- */
body{font-feature-settings:"ss01" 0;letter-spacing:0;font-size:var(--t-md);line-height:1.5}
::selection{background:var(--accent-soft);color:var(--accent-soft-ink)}
h1{letter-spacing:-.02em}
h2{letter-spacing:-.01em}
.ic{stroke-width:var(--ic-sw)}
a{color:var(--ink);text-decoration-color:var(--control)}
a:hover{text-decoration-color:currentColor}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.input:focus-visible,.composer textarea:focus-visible{outline:0}
kbd{font:500 12px/1 var(--f-ui);padding:3px 6px;border-radius:6px;border:1px solid var(--line-strong);border-bottom-width:2px;color:var(--muted);background:var(--surface)}
.logo .ss{fill:none;stroke:var(--signal)}

/* ---------- botões: cor muda, tamanho não; pressionar afunda 1px ---------- */
.btn{font-size:15px;font-weight:600;letter-spacing:.005em;border-radius:var(--r-md);transition:background-color var(--dur-1) var(--ease-out),border-color var(--dur-1) var(--ease-out),box-shadow var(--dur-1) var(--ease-out),transform var(--dur-1) var(--ease-out)}
.btn:hover{transform:none}
.btn:active{transform:translateY(1px)}
.btn-primary{background:var(--accent);color:var(--on-accent);box-shadow:inset 0 1px 0 rgb(255 255 255 / .12),0 1px 2px rgb(5 46 22 / .2)}
[data-theme="escuro"] .btn-primary{box-shadow:none}
.btn-secondary{background:var(--surface);border-color:var(--line-strong);box-shadow:var(--shadow-xs);color:var(--ink)}
.btn-secondary:hover{background:var(--hover);border-color:var(--control)}
.btn-quiet{color:var(--ink-2)}
.btn-danger{background:var(--danger);color:#fff}
.btn-danger:hover{background:#991b1b}
.btn-lg{min-height:48px;font-size:16px}
.btn-sm{min-height:36px;padding:0 14px;font-size:14px;gap:6px}
.btn:disabled{opacity:1;background:var(--sunken);color:var(--muted);border-color:transparent;box-shadow:none}
.iconbtn{width:40px;height:40px;border-radius:var(--r-md);color:var(--muted);transition:background-color var(--dur-1) var(--ease-out),color var(--dur-1) var(--ease-out)}
.iconbtn:hover{background:var(--hover);color:var(--ink)}
.iconbtn:active{background:var(--press)}
.badge{top:9px;right:9px;min-width:8px;width:8px;height:8px;padding:0;border-radius:50%;background:var(--danger);box-shadow:0 0 0 2px var(--side-bg)}
.main .badge{box-shadow:0 0 0 2px var(--bg)}

/* ---------- campos: borda com 3:1, anel de foco largo ---------- */
.input{min-height:44px;border-radius:var(--r-md);border:1px solid var(--control);background:var(--surface);transition:border-color var(--dur-1) var(--ease-out),box-shadow var(--dur-1) var(--ease-out)}
.input:hover{border-color:var(--ink-2)}
.input:focus{border-color:var(--focus);box-shadow:0 0 0 4px var(--ring);outline:0}
.input[readonly]{background:var(--sunken);border-color:var(--line-strong);color:var(--ink-2)}
.input.invalid{border-color:var(--danger-ink);box-shadow:0 0 0 4px var(--danger-soft)}
.field{gap:8px}
.field>span:first-child,.label{font-size:var(--t-sm);font-weight:600;color:var(--ink)}
.err{display:flex;align-items:center;gap:6px;font-size:var(--t-sm);color:var(--danger-ink);font-weight:500;margin-top:2px}
.with-ic .ic{left:14px}
.with-ic .input{padding-left:42px}

/* ---------- cartões, etiquetas, seleção ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--shadow-xs)}
.tag{background:var(--sunken);color:var(--ink-2);font-weight:500;padding:2px 10px;line-height:20px}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:var(--t-xs);font-weight:600;border-radius:var(--r-pill);padding:2px 10px;line-height:20px;white-space:nowrap;margin:0}
.pill i{width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.wait{background:var(--warn-soft);color:var(--warn-ink);box-shadow:inset 0 0 0 1px var(--warn-line)}
.pill.on{background:var(--accent-soft);color:var(--accent-soft-ink)}
.pill.off{background:var(--sunken);color:var(--muted)}
.prio{color:var(--ink-2);font-size:var(--t-sm)}
.prio .ic{color:var(--muted)}
.prio.hot{color:var(--warn-ink);font-weight:600}
.prio.hot .ic{color:currentColor}
.late{color:var(--danger-ink)}
.seg{padding:4px;gap:2px;border-radius:var(--r-md);background:var(--sunken);box-shadow:inset 0 0 0 1px var(--line-soft)}
.seg button{min-height:34px;border-radius:7px;color:var(--ink-2);font-weight:500;transition:background-color var(--dur-1) var(--ease-out),color var(--dur-1) var(--ease-out)}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);font-weight:600;box-shadow:0 1px 2px rgb(24 24 27 / .08),0 0 0 1px var(--line)}
[data-theme="escuro"] .seg button[aria-pressed="true"]{background:var(--hover);box-shadow:inset 0 0 0 1px var(--line-strong)}

/* caixa de seleção: 20 px de desenho, 44 px de toque */
.check{position:relative;width:20px;height:20px;border:1.5px solid var(--control);border-radius:50%;transition:border-color var(--dur-1) var(--ease-out),background-color var(--dur-1) var(--ease-out)}
.check::before{content:"";position:absolute;inset:-12px}
.check:hover{border-color:var(--accent);background:var(--accent-soft)}
.day .kind .check{width:18px;height:18px}
.switch{width:44px;height:26px;background:var(--control);transition:background-color var(--dur-2) var(--ease-out)}
.switch::after{transition:transform var(--dur-2) var(--ease-out)}
.switch::before{content:"";position:absolute;inset:-9px 0}

/* ---------- moldura: menu ---------- */
.side{padding:var(--s3) var(--s3) var(--s3);gap:0}
.side-head{padding:2px 2px var(--s3)}
.brand{font:600 19px/1 var(--f-ui);letter-spacing:-.01em;gap:10px}
.logo{width:30px;height:30px}
.side-new{margin:0 0 var(--s2);justify-content:flex-start;padding:0 12px;min-height:40px;font-weight:600}
.side-new .ic{color:var(--accent-ink)}
.searchbtn{min-height:40px;border-color:var(--line-strong);background:var(--surface);color:var(--muted);padding:0 8px 0 12px;border-radius:var(--r-md);transition:border-color var(--dur-1) var(--ease-out)}
[data-theme="escuro"] .searchbtn{background:transparent}
.searchbtn:hover{border-color:var(--control);color:var(--ink-2);background:var(--surface)}
.nav{margin-top:var(--s4)}
.nav a{min-height:40px;padding:0 10px 0 12px;gap:12px;font-weight:500;color:var(--side-ink);border-radius:var(--r-md)}
.nav a>.ic{color:var(--side-muted);transition:color var(--dur-1) var(--ease-out)}
.nav a:hover>.ic,.nav a[aria-current="page"]>.ic{color:var(--side-head)}
.nav a[aria-current="page"]{font-weight:600}
.nav .count{font-weight:500}
.nav .count.alert{display:inline-flex;align-items:center;justify-content:center;padding:0 7px;background:var(--warn-soft);color:var(--warn-ink);box-shadow:inset 0 0 0 1px var(--warn-line);font-weight:600;min-width:22px;height:22px}
.side-h{font:600 12px/1 var(--f-ui);letter-spacing:.06em;text-transform:uppercase;color:var(--side-muted);padding:var(--s6) 12px var(--s2)}
.recent a{padding:8px 12px;color:var(--side-ink);font-size:var(--t-sm)}
.account{padding:8px;border-radius:var(--r-md);margin-top:var(--s2);border-top:0}
.account .ic{margin-left:auto;color:var(--side-muted)}
.avatar{width:32px;height:32px;background:var(--tile);color:var(--mark);font-weight:600}
[data-theme="escuro"] .avatar{background:#2e2e34}

/* ---------- página ---------- */
.page{max-width:1040px;padding:56px 48px 80px}
.page-narrow{max-width:760px}
.page-wide{max-width:1200px}
.pagehead{margin-bottom:var(--s6);gap:var(--s4)}
.pagehead h1{font-size:var(--t-2xl);line-height:1.15;letter-spacing:-.02em}
.pagehead p{color:var(--muted);margin-top:8px;max-width:62ch}
.block{margin-top:var(--s7)}
.block-head{align-items:center;margin-bottom:var(--s3);gap:var(--s2)}
.block-head h2{font-size:var(--t-lg);font-weight:600}
.more{display:inline-flex;align-items:center;gap:2px;color:var(--ink-2);font-weight:600;font-size:var(--t-sm);text-decoration:none;padding:6px 4px 6px 8px;margin-right:-4px;border-radius:var(--r-sm)}
.more:hover{color:var(--ink);background:var(--hover);text-decoration:none}
.grouph{font-size:var(--t-sm);font-weight:600;color:var(--ink-2);padding:var(--s6) 0 var(--s2)}

/* ---------- Início ---------- */
.hello{margin-bottom:var(--s5)}
.eyebrow{font-size:var(--t-sm);font-weight:500;color:var(--muted);margin-bottom:6px}
.hello h1{font-size:var(--t-4xl);line-height:1.1;letter-spacing:-.025em}
.hello .lede{font-size:var(--t-lg);color:var(--ink-2);margin-top:10px;max-width:56ch;line-height:1.5}
.composer{border:1px solid var(--line-strong);border-radius:var(--r-xl);background:var(--surface);box-shadow:var(--shadow-md);padding:8px 8px 8px 18px;transition:border-color var(--dur-2) var(--ease-out),box-shadow var(--dur-2) var(--ease-out)}
.composer:focus-within{border-color:var(--focus);box-shadow:0 0 0 4px var(--ring),var(--shadow-md)}
.composer textarea{font-size:16px;padding:12px 0}
.composer-acts{display:flex;align-items:center;gap:2px;align-self:flex-end}
.composer-lg{flex-wrap:wrap;padding:10px 10px 10px 20px}
.composer-lg textarea{flex-basis:100%;min-height:44px;font-size:17px;padding:10px 0 4px}
.composer-lg .composer-acts{margin-left:auto}
.sendbtn{width:40px;height:40px;border-radius:12px;background:var(--accent);color:var(--on-accent);transition:background-color var(--dur-1) var(--ease-out),transform var(--dur-1) var(--ease-out)}
.sendbtn:hover{background:var(--accent-hover)}
.sendbtn:active{transform:translateY(1px)}
.sendbtn .ic{stroke-width:2.25}
.chips{gap:8px;margin-top:var(--s3)}
.chip{min-height:36px;padding:0 14px;border:1px solid var(--line-strong);background:var(--surface);color:var(--ink-2);font-weight:500;transition:background-color var(--dur-1) var(--ease-out),border-color var(--dur-1) var(--ease-out),color var(--dur-1) var(--ease-out)}
[data-theme="escuro"] .chip{background:transparent}
.chip:hover{border-color:var(--control);color:var(--ink);background:var(--hover)}

.attn li{padding:var(--s4) var(--s5);gap:var(--s4)}
.attn li+li{border-top:1px solid var(--line)}
.attn .tile{width:40px;height:40px;border-radius:var(--r-md);background:var(--sunken);color:var(--ink-2)}
.attn .t{font-weight:600}
.attn p.d{color:var(--muted);font-size:var(--t-sm);margin-top:2px}

/* o dia: hora, marcador e o que é, com a linha do agora */
.card.day{padding:4px var(--s5)}
.day li{grid-template-columns:64px 20px minmax(0,1fr) auto;gap:0 var(--s3);padding:14px 0;border-top:1px solid var(--line-soft);align-items:start}
.day li:first-child{border-top:0}
.day .when{font-size:var(--t-sm);color:var(--ink-2);font-weight:500;padding-top:1px}
.day .kind{width:20px;height:20px;margin-top:1px}
.day .kind i{width:10px;height:10px;box-shadow:0 0 0 3px var(--cal-a-soft)}
.day .kind i.b{box-shadow:0 0 0 3px var(--cal-b-soft)}
.day .kind .ic{width:16px;height:16px;color:var(--muted)}
.day .t{font-weight:500}
.day .side-note{font-size:var(--t-sm);color:var(--muted);padding-top:1px}
.day li.past .t,.day li.past .when{color:var(--muted)}
.day li.now{padding:2px 0;border-top:0;align-items:center}
.day li.now .when{color:var(--now);font-weight:600;font-size:var(--t-xs);padding:0;position:relative;z-index:1}
.day li.now .now-line{grid-column:2/-1;height:2px;background:var(--now);border-radius:2px;position:relative}
.day li.now .now-line::before{content:"";position:absolute;left:4px;top:-4px;width:10px;height:10px;border-radius:50%;background:var(--now);box-shadow:0 0 0 3px var(--surface)}

/* ---------- Conversa ---------- */
.chat-head{min-height:60px;padding:var(--s2) var(--s5);border-bottom:1px solid var(--line);background:var(--bg)}
.chat-head h1{font-size:var(--t-md);font-weight:600;letter-spacing:0}
.thread-in{max-width:740px;gap:var(--s6);padding:var(--s6) var(--s5) var(--s5)}
.daysep{display:flex;align-items:center;gap:var(--s3);color:var(--muted);font-size:var(--t-xs);font-weight:600;letter-spacing:.06em;text-transform:uppercase}
.daysep::before,.daysep::after{content:"";flex:1;height:1px;background:var(--line)}
.msg-me{background:var(--sunken);color:var(--ink);padding:12px 16px;border-radius:18px 18px 6px 18px;max-width:78%;line-height:1.55}
[data-theme="escuro"] .msg-me{background:var(--raised);box-shadow:inset 0 0 0 1px var(--line)}
.msg-z{grid-template-columns:32px minmax(0,1fr);gap:var(--s3)}
.msg-z>.logo{width:32px;height:32px}
.msg-z .body{gap:var(--s3)}
.who{display:flex;align-items:baseline;gap:8px;font-size:var(--t-sm);font-weight:600;color:var(--ink);margin:4px 0 -4px}
.who .num{font-weight:400;color:var(--muted);font-size:var(--t-xs)}
.msg-z .say{font-size:16px;line-height:1.65;max-width:64ch}
.tools{gap:6px}
.tools span{background:var(--sunken);border-radius:var(--r-pill);padding:2px 10px 2px 8px;font-size:var(--t-xs);font-weight:500;color:var(--ink-2)}
.tools .ic{color:var(--ok-ink);width:14px;height:14px}
.done-card{padding:12px var(--s4);box-shadow:none;background:var(--sunken);border-color:transparent}
.done-card .ok{font-size:var(--t-sm)}
.plan{padding:var(--s5);box-shadow:var(--shadow-sm)}
.plan .ph .tile{width:40px;height:40px;background:var(--sunken);color:var(--ink-2)}
.plan .kicker{font-size:var(--t-xs);font-weight:500;color:var(--muted)}
.plan h2{font-size:var(--t-lg);margin-top:2px}
.plan ul{margin:var(--s4) 0 var(--s3);border:1px solid var(--line);border-radius:var(--r-md);overflow:hidden}
.plan li{grid-template-columns:minmax(0,1fr) 150px 92px;padding:12px var(--s4);gap:4px var(--s4)}
.plan li .meta{order:0;justify-content:flex-start;margin:0}
.plan li .prio{order:0}
.plan li+li{border-top:1px solid var(--line-soft)}
.sugg{font-size:var(--t-xs);color:var(--muted);background:var(--sunken);border-radius:var(--r-pill);padding:0 6px}
.plan .status{color:var(--ink-2);font-size:var(--t-sm)}
.plan .status .ic{color:var(--muted)}
.dock{padding:var(--s2) var(--s5) var(--s4);background:linear-gradient(to bottom,transparent,var(--bg) 24px)}
.dock .hint{display:flex;justify-content:center;align-items:center;gap:4px;margin-top:8px;font-size:var(--t-xs);color:var(--muted)}
.dock kbd{font-size:11px;padding:2px 5px}

/* ---------- Tarefas ---------- */
.addrow{gap:var(--s2)}
.addrow .input{background:var(--surface)}
.filters{gap:var(--s2);margin-top:var(--s4)}
.tabs-row{margin-top:var(--s5)}
.task{padding:14px var(--s5);gap:var(--s3);align-items:flex-start;transition:background-color var(--dur-1) var(--ease-out)}
.task:hover{background:var(--hover)}
.task:first-child{border-radius:var(--r-lg) var(--r-lg) 0 0}
.task:last-child{border-radius:0 0 var(--r-lg) var(--r-lg)}
.task:only-child{border-radius:var(--r-lg)}
.task+.task{border-top:1px solid var(--line-soft)}
.task .check{margin-top:1px}
.task .right{gap:6px}
.task .right .num{font-size:var(--t-sm);color:var(--ink-2)}

/* ---------- Notas ---------- */
.split>.pane:first-child{background:var(--bg);border-right:1px solid var(--line);padding:var(--s5) var(--s4)}
.pane-head h1{font-size:var(--t-xl);letter-spacing:-.015em}
.notelist{gap:4px;margin-top:var(--s4)}
.notelist a{padding:12px 14px;border-radius:var(--r-md)}
.notelist a[aria-current="true"]{background:var(--surface);box-shadow:var(--side-active-shadow)}
[data-theme="escuro"] .notelist a[aria-current="true"]{background:var(--raised)}
.editor{max-width:700px;padding:var(--s6) var(--s6) var(--s8)}

/* ---------- Agenda ---------- */

.week{grid-template-columns:60px repeat(7,minmax(0,1fr));border-radius:var(--r-lg);box-shadow:var(--shadow-xs)}
.week .dh{padding:10px 8px 12px;font-size:var(--t-xs);font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.week .dh b{font-size:var(--t-xl);font-weight:600;letter-spacing:0;margin-top:4px;color:var(--ink)}
.week .dh.today{color:var(--accent-ink)}
.week .dh.today b span{min-width:36px;height:36px}
.week .hours{grid-template-rows:repeat(13,48px)}
.week .col{background-size:100% 48px;background-image:linear-gradient(var(--line-soft) 1px,transparent 1px)}
.week .col:first-child{background-color:transparent}
.ev{border-left:0;border-radius:8px;padding:6px 8px;background:var(--cal-a-soft);color:var(--cal-a-ink);box-shadow:inset 0 0 0 1px rgb(22 163 74 / .18)}
.ev b{color:var(--cal-a-ink);font-size:13px}
.ev .num{font-size:12px;opacity:.95}
.ev.b{background:var(--cal-b-soft);color:var(--cal-b-ink);box-shadow:inset 0 0 0 1px rgb(3 105 161 / .18)}
.ev.b b{color:var(--cal-b-ink)}
[data-theme="escuro"] .ev{box-shadow:inset 0 0 0 1px rgb(74 222 128 / .2)}
[data-theme="escuro"] .ev.b{box-shadow:inset 0 0 0 1px rgb(56 189 248 / .22)}
.legend i{border-radius:50%;width:10px;height:10px}

/* ---------- Automações ---------- */
.auto{padding:var(--s4) var(--s5);gap:var(--s4)}
.auto+.auto{border-top:1px solid var(--line-soft)}
.auto .tile{background:var(--sunken);color:var(--ink-2);border-radius:var(--r-md)}
.auto .meta{margin-top:4px}
.auto .ctl{gap:var(--s2)}
.runs li{grid-template-columns:132px minmax(0,1fr) auto}
.runs li+li{border-top:1px solid var(--line-soft)}
.state{font-size:var(--t-sm)}

/* ---------- Memória e Configurações ---------- */
.mem-add{padding:var(--s4) var(--s5)}
.mem li+li{border-top:1px solid var(--line-soft)}
.mem .fact{font-size:16px;line-height:1.55}
.settings{grid-template-columns:208px minmax(0,1fr);gap:var(--s7)}
.settings nav a{min-height:40px;color:var(--ink-2)}
.settings nav a[aria-current="page"]{background:var(--surface);color:var(--ink);font-weight:600;box-shadow:var(--side-active-shadow)}
[data-theme="escuro"] .settings nav a[aria-current="page"]{background:var(--raised)}
.set-sec{padding:var(--s5) var(--s6)}
.set-sec>p{color:var(--muted)}
.set-row{border-top:1px solid var(--line-soft)}
.set-row:first-of-type{border-top:0;margin-top:var(--s3)}
.set-foot{border-top:1px solid var(--line-soft);margin:var(--s5) calc(var(--s6) * -1) calc(var(--s5) * -1);padding:var(--s4) var(--s6);background:var(--bg);border-radius:0 0 var(--r-lg) var(--r-lg)}

/* ---------- Estados ---------- */
.states{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--s5)}
.st-card{padding:var(--s5);display:flex;flex-direction:column}
.st-wide{grid-column:1/-1}
.st-h{font-size:var(--t-xs);font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}

.sk-row{display:flex;gap:var(--s3);align-items:center;padding:12px 0}
.sk-row+.sk-row{border-top:1px solid var(--line-soft)}
.sk-txt{flex:1;display:grid;gap:8px}
.sk{display:block;height:12px;border-radius:6px;background:linear-gradient(90deg,var(--sk) 0,var(--sk-hi) 50%,var(--sk) 100%);background-size:200% 100%;animation:sk 1.4s ease-in-out infinite}
.sk-c{width:20px;height:20px;border-radius:50%;flex:none}
@keyframes sk{from{background-position:100% 0}to{background-position:-100% 0}}
.empty{display:grid;justify-items:center;text-align:center;gap:6px;padding:var(--s4) var(--s4) var(--s2)}

.st-pair{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:var(--s5);align-items:start;padding:var(--s5);border-radius:var(--r-md);background:var(--sunken)}

.toast{display:flex;align-items:center;gap:var(--s2);padding:6px 6px 6px 14px;border-radius:var(--r-md);background:var(--tile);color:#fafafa;box-shadow:var(--shadow-lg);align-self:end;font-weight:500;font-size:var(--t-sm)}

[data-theme="escuro"] .toast .btn-quiet{color:#18181b}

[data-theme="escuro"] .toast .btn-quiet:hover,[data-theme="escuro"] .toast .iconbtn:hover{background:rgb(0 0 0 / .08);color:#18181b}

/* ---------- Identidade ---------- */

.login-form{padding:48px 32px}

/* tema escuro: mais separação entre camadas e texto mais claro */
[data-theme="escuro"]{
  --bg:#0c0c0e;--surface:#17171a;--raised:#1f1f23;--sunken:#24242a;--hover:#2a2a31;--press:#33333b;
  --line:rgb(255 255 255 / .11);--line-soft:rgb(255 255 255 / .07);--line-strong:rgb(255 255 255 / .2);--control:#85858f;
  --ink:#f5f5f7;--ink-2:#dcdce2;--muted:#b6b6bf;
  --accent-soft:#143322;--accent-soft-ink:#c7f9da;
  --warn-soft:#33270d;--warn-line:#6b5216;--danger-soft:#331616;--danger-line:#6e2626;
  --cal-a-soft:#163a25;--cal-a-ink:#d1fae0;--cal-b-soft:#11304a;--cal-b-ink:#d3efff;
  --side-bg:#08080a;--side-ink:#dcdce2;--side-muted:#b6b6bf;--side-hover:#1c1c21;--side-active-bg:#26262c;--side-line:rgb(255 255 255 / .08);
  --side-active-shadow:inset 0 0 0 1px rgb(255 255 255 / .1);
  --shadow-xs:0 0 0 1px rgb(255 255 255 / .02);
  --tile:#2a2a30;--art-bg:#08080a;--sk:#25252b;--sk-hi:#3a3a43;
}
[data-theme="escuro"] .card{background:var(--surface);border-color:var(--line)}
[data-theme="escuro"] .ev{box-shadow:inset 0 0 0 1px rgb(74 222 128 / .32)}
[data-theme="escuro"] .ev.b{box-shadow:inset 0 0 0 1px rgb(56 189 248 / .34)}

[data-theme="escuro"] .msg-me{background:var(--raised)}
[data-theme="escuro"] .nav a[aria-current="page"]{background:var(--side-active-bg)}
[data-theme="escuro"] .nav a[aria-current="page"]::before{content:"";position:absolute;left:0;top:10px;bottom:10px;width:3px;border-radius:0 3px 3px 0;background:var(--accent)}
.nav a{position:relative}
.outrow{grid-column:1/-1;display:grid;grid-template-columns:60px repeat(7,minmax(0,1fr));border-bottom:1px solid var(--line);background:var(--bg)}
.week .outrow:last-child{border-bottom:0;border-top:1px solid var(--line)}

.ev-out .num{margin-left:auto;flex:none;opacity:.9}
.ev-out.b{color:var(--cal-b-ink);background:var(--cal-b-soft)}
.mini-ev{display:grid}
.mini-ev li{display:grid;grid-template-columns:56px minmax(0,1fr);gap:var(--s3);padding:10px 0;border-top:1px solid var(--line-soft)}

.ctl-pair{display:flex;align-items:flex-end;flex-wrap:wrap;gap:var(--s3)}
.ctl-pair label{display:grid;gap:6px;font-size:var(--t-sm);font-weight:500;color:var(--ink-2)}
.hours-bar{position:relative;flex-basis:100%;height:36px;margin-top:var(--s2);border-radius:var(--r-sm);background:var(--sunken);box-shadow:inset 0 0 0 1px var(--line);background-image:repeating-linear-gradient(90deg,transparent 0,transparent calc(100% / 24 - 1px),var(--line-soft) calc(100% / 24 - 1px),var(--line-soft) calc(100% / 24))}
.hours-bar .on{position:absolute;top:4px;bottom:4px;display:grid;place-items:center;border-radius:6px;background:var(--accent-soft);box-shadow:inset 0 0 0 1px var(--accent);color:var(--accent-soft-ink);font-size:var(--t-xs);font-weight:600;white-space:nowrap;overflow:hidden;transition:left var(--dur-3) var(--ease-out),width var(--dur-3) var(--ease-out)}
.hours-scale{flex-basis:100%;display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-top:-8px}
.cal-list .set-row:first-child{border-top:1px solid var(--line-soft);margin-top:var(--s3)}
.cal-dot{width:12px;height:12px;border-radius:4px;flex:none;align-self:flex-start;margin-top:6px}
.set-sec+.set-sec{margin-top:var(--s5)}

/* contatos: lista */
.split-contacts{grid-template-columns:360px minmax(0,1fr)}
.ct-list{display:flex;flex-direction:column}
.ct-list>*{flex-shrink:0}
.ct-list .pane-head{margin-bottom:var(--s2)}
.sync{font-size:var(--t-sm);color:var(--muted);margin:0 0 var(--s4)}
.split-contacts .seg{width:100%}
.split-contacts .seg button{flex:1;justify-content:center}
.ct-search{margin-top:var(--s3)}
.plist{display:grid;gap:2px;margin-top:var(--s3)}
.plist .grp{position:sticky;top:-24px;z-index:1;padding:12px 12px 4px;background:var(--bg);font-size:12px;font-weight:600;letter-spacing:.06em;color:var(--muted)}
.plist li[hidden]{display:none}
.pitem{display:flex;align-items:center;gap:12px;width:100%;min-height:60px;padding:8px 12px;border:0;border-radius:var(--r-md);background:none;color:var(--ink);font:inherit;text-align:left;cursor:pointer;transition:background-color var(--dur-1) var(--ease-out)}
.pitem:hover{background:var(--hover)}
.pitem[aria-current="true"]{background:var(--surface);box-shadow:var(--side-active-shadow)}
[data-theme="escuro"] .pitem[aria-current="true"]{background:var(--raised)}
.pitem .pt{display:grid;min-width:0;flex:1}
.pitem .t{display:flex;align-items:center;gap:6px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pitem .d{font-size:var(--t-sm);color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pitem .pr{display:grid;justify-items:end;gap:4px;flex:none;font-size:12px;color:var(--muted)}
.ic.fav{width:14px;height:14px;flex:none;color:var(--warn-ink);fill:currentColor}
.p-empty{color:var(--muted);font-size:var(--t-sm)}
.ct-none{padding:var(--s4) 12px}

/* avatares com cor suave, sempre com as iniciais */
.pav{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;flex:none;font:600 14px/1 var(--f-ui);letter-spacing:.02em;background:var(--sunken);color:var(--ink-2)}
.tint-1{background:#e0f2fe;color:#075985}
.tint-2{background:#fef3c7;color:#92400e}
.tint-3{background:#ffe4e6;color:#9f1239}
.tint-4{background:#e7e5e4;color:#44403c}
[data-theme="escuro"] .tint-1{background:#0f2a3a;color:#bae6fd}
[data-theme="escuro"] .tint-2{background:#33270d;color:#fde68a}
[data-theme="escuro"] .tint-3{background:#3a1520;color:#fecdd3}
[data-theme="escuro"] .tint-4{background:#2a2826;color:#e7e5e4}
.pav-xl{width:72px;height:72px;font-size:24px}

/* estrelas e etapas */
.stars{display:inline-flex;gap:1px;color:#b45309}
[data-theme="escuro"] .stars{color:#fbbf24}
.stars .ic{width:14px;height:14px}
.stars .ic.on{fill:currentColor}
.stars .ic:not(.on){color:var(--control)}
.stage{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--ink-2);white-space:nowrap}
.stage i{width:8px;height:8px;border-radius:50%;background:var(--control)}
.stage.s-novo i{background:#0284c7}
.stage.s-conv i{background:#d97706}
.stage.s-cli i{background:var(--accent)}
.rv-st{font-weight:600;color:var(--warn-ink)}
.rv-sum{display:flex;align-items:center;gap:var(--s4);margin-top:var(--s3);padding:var(--s3) var(--s4)}
.rv-sum .big{font-size:var(--t-3xl);font-weight:600;letter-spacing:-.02em;line-height:1}
.rv-sum .stars .ic{width:16px;height:16px}
.rv-sum .d{font-size:var(--t-sm);color:var(--muted);margin-top:2px}

/* contatos: ficha */
.person{max-width:980px;margin:0 auto;padding:var(--s6) var(--s6) var(--s8)}
.person-head{display:flex;align-items:center;gap:var(--s5)}
.person-head h2{font-size:var(--t-2xl);letter-spacing:-.02em;line-height:1.15}
.person-head .role{display:flex;align-items:center;gap:10px;color:var(--muted);margin-top:2px}
.person-head .meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.person-head .meta .tag{display:inline-flex;align-items:center;gap:4px}
.back-m,.ct-h1-m{display:none}
.qa{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:var(--s2);max-width:600px;margin:var(--s6) 0}
.qa-btn{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;width:100%;min-height:72px;padding:10px 6px;border:1px solid var(--line);border-radius:var(--r-lg);background:var(--surface);color:var(--ink);font:500 var(--t-sm)/1.2 var(--f-ui);text-align:center;text-decoration:none;cursor:pointer;transition:background-color var(--dur-1) var(--ease-out),transform var(--dur-1) var(--ease-out)}
.qa-btn:hover{background:var(--hover)}
.qa-btn:active{transform:translateY(1px)}
.qa-btn .ic{width:20px;height:20px;color:var(--ink-2)}
.qa-btn.qa-main{background:var(--accent-soft);border-color:transparent;color:var(--accent-soft-ink);font-weight:600}
.qa-btn.qa-main .ic{color:var(--accent-soft-ink)}
.qa-btn[disabled]{color:var(--muted);cursor:not-allowed;background:var(--bg)}
.qa-btn[disabled] .ic{color:var(--muted)}
.person-cols{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:var(--s4);align-items:start}
.pc-main{display:grid;gap:var(--s4);min-width:0}
.p-sec{padding:var(--s4) var(--s5) var(--s5)}
.p-sec h3{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:var(--s3)}
.tl li{display:grid;grid-template-columns:32px 72px minmax(0,1fr);gap:var(--s3);align-items:start;padding:12px 0;border-top:1px solid var(--line-soft)}
.tl li:first-child{border-top:0;padding-top:0}
.tl-ic{width:32px;height:32px;border-radius:var(--r-sm);display:grid;place-items:center;background:var(--sunken);color:var(--ink-2)}
.tl .when{padding-top:6px;font-size:var(--t-sm);font-weight:500;color:var(--ink-2)}
.tl .t{display:block;font-weight:500;padding-top:5px}
.tl .d{display:block;font-size:var(--t-sm);color:var(--muted)}
.facts{display:grid;gap:8px;margin-bottom:var(--s3)}
.facts li{display:grid;gap:2px;padding:12px 14px;border-radius:var(--r-md);background:var(--sunken)}
.seen li+li a{border-top:1px solid var(--line-soft)}
.seen a{display:flex;align-items:center;gap:12px;padding:10px 0;color:var(--ink);text-decoration:none;min-height:44px}
.seen a>span{flex:1;display:grid}
.seen .k{font-size:12px;color:var(--muted)}
.seen .ic{color:var(--muted)}
.dl-stack>div{padding:10px 0;border-top:1px solid var(--line-soft)}
.dl-stack>div:first-child{border-top:0;padding-top:0}
.dl-stack dt{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.dl-stack dd{margin:2px 0 0;color:var(--ink);overflow-wrap:anywhere}
.ro{display:flex;gap:8px;align-items:flex-start;margin-top:var(--s3);padding-top:var(--s3);border-top:1px solid var(--line-soft);font-size:var(--t-sm);color:var(--muted)}
.ro .ic{flex:none;margin-top:2px}
.review .ro{border-top:0;max-width:62ch}
.rv-text{margin:var(--s6) 0 var(--s4);padding:0 0 0 var(--s4);font-size:var(--t-lg);line-height:1.55;color:var(--ink);max-width:62ch;border-left:3px solid var(--line-strong)}
.rv-reply{max-width:680px}
.rv-draft{line-height:1.6;max-width:62ch}
.rv-reply .row-actions{display:flex;flex-wrap:wrap;gap:var(--s2);margin-top:var(--s4)}
.rv-low,.rv-pub{display:flex;align-items:center;gap:8px;margin-top:var(--s3);font-size:var(--t-sm);font-weight:500}
.rv-low{color:var(--warn-ink)}
.rv-pub{color:var(--ok-ink)}

/* carregando: linha no topo, esqueleto com brilho, sinal pulsando e entrada suave */
.st-hrow{display:flex;align-items:center;justify-content:space-between;gap:var(--s2);margin:-6px 0 -6px}
.ld{position:relative;overflow:hidden;min-height:226px;padding:var(--s3) var(--s4) var(--s2);border:1px solid var(--line-soft);border-radius:var(--r-md);background:var(--bg)}
.ld-bar{position:absolute;inset:0 0 auto;height:3px;overflow:hidden}
.ld-bar i{position:absolute;top:0;bottom:0;left:-40%;width:40%;border-radius:3px;background:var(--accent);animation:ld-bar 1.3s cubic-bezier(.4,0,.2,1) infinite}
@keyframes ld-bar{to{left:100%}}
.ld-msg{display:flex;align-items:center;gap:10px;margin:6px 0 2px;font-size:var(--t-sm);color:var(--muted);animation:ld-in .3s .3s both}
.ld-sig{position:relative;width:14px;height:14px;flex:none}
.ld-sig i{position:absolute;inset:3px;border-radius:50%;background:var(--signal)}
.ld-sig::before,.ld-sig::after{content:"";position:absolute;inset:0;border-radius:50%;border:1.5px solid var(--signal);opacity:0;animation:ld-wave 1.8s ease-out infinite}
.ld-sig::after{animation-delay:.9s}
@keyframes ld-wave{0%{transform:scale(.45);opacity:.9}100%{transform:scale(2.1);opacity:0}}
.ld .sk-row{animation:ld-in .35s both}
.ld .sk-row:nth-of-type(1){animation-delay:.3s}
.ld .sk-row:nth-of-type(2){animation-delay:.38s}
.ld .sk-row:nth-of-type(3){animation-delay:.46s}
.ld .sk{animation:sk 1.4s ease-in-out infinite}
@keyframes ld-in{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.ld[data-ld="done"] .ld-bar,.ld[data-ld="done"] .ld-skel{display:none}
.ld[data-ld="loading"] .ld-done{display:none}
.ld-done li{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line-soft);animation:ld-in .35s both}
.ld-done li:first-child{border-top:0}
.ld-done li:nth-child(2){animation-delay:.06s}
.ld-done li:nth-child(3){animation-delay:.12s}
.ld-done .t{flex:1;font-weight:500}
.ld-done .num{font-size:var(--t-sm);color:var(--muted)}
.ld-c{width:20px;height:20px;border-radius:50%;flex:none;box-shadow:inset 0 0 0 1.5px var(--control)}
@media (prefers-reduced-motion:reduce){
  .ld .ld-bar i,.ld .ld-msg,.ld .ld-sig::before,.ld .ld-sig::after,.ld .sk-row,.ld .sk,.ld .ld-done li{animation:none}
  .ld-bar i{left:0;width:100%;opacity:.45}
  .ld-sig::before{opacity:.5;transform:scale(1.6)}
  .hours-bar .on{transition:none}
}

@media (max-width:820px){
  .ag-cfg{margin-left:0}
  .split-contacts{grid-template-columns:1fr}
  .split-contacts:not(.has-sel)>.pane:last-child{display:none}
  .split-contacts.has-sel>.pane:first-child{display:none}
  .split-contacts.has-sel>.pane:last-child{display:block}
  .split-contacts>.pane:first-child{border-right:0}
  .back-m{display:inline-flex;margin:0 0 var(--s3) -10px}
  .has-sel .ct-h1-m{display:block;position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
  .person{padding:var(--s4) var(--s4) var(--s7)}
  .person-head{gap:var(--s4)}
  .person-head h2{font-size:var(--t-xl)}
  .pav-xl{width:56px;height:56px;font-size:19px}
  .qa{max-width:none;margin:var(--s5) 0}
  .qa-btn{min-height:68px;font-size:13px}
  .person-cols{grid-template-columns:1fr}
  .rv-text{font-size:var(--t-md)}
  .ctl-pair .btn{flex-basis:100%}
}
@media (pointer:coarse){.pitem{min-height:64px}}

  ["repeat", "Rotina “Revisão da semana”", "Usa IA todo domingo às 18:00. Só começa depois que você aprovar.", "Revisar rotina", "automacoes"]

/* ---------- moldura ---------- */
function side() {
  const nav = NAV.map(([s, i, l, n, why, alert]) => {
    const cur = s === st.s ? ' aria-current="page"' : "";
    const count = n ? `<span class="count${alert ? " alert" : ""}">${n}<span class="sr"> ${why}</span></span>` : "";
    const target = SCREENS.includes(s) ? href(s) : "#";
    return `<li><a href="${target}"${cur}>${ic(i)}<span>${l}</span>${count}</a></li>`;
  }).join("");
  return `<aside class="side" aria-label="Menu da Zuri">
    <div class="side-head">
      <a class="brand" href="${href("inicio")}">${logo()}<span class="wm">Zuri</span></a>
      <button class="iconbtn side-bell" type="button" aria-label="Avisos: 2 novos">${ic("bell")}<span class="badge" aria-hidden="true"></span></button>
      <button class="iconbtn side-collapse" type="button" aria-label="Recolher o menu">${ic("panel-left")}</button>
    </div>
    <a class="btn btn-secondary btn-block side-new" href="${href("conversa")}">${ic("square-pen")}<span class="lbl">Nova conversa</span></a>
    <button class="searchbtn" type="button">${ic("search", "ic-sm")}<span>Buscar</span></button>
    <nav aria-label="Seções"><ul class="nav">${nav}</ul></nav>
    <button class="account" type="button" aria-label="Conta de Ana"><span class="avatar" aria-hidden="true">A</span><span class="acct-txt"><b>Ana</b></span>${ic("chevron-down", "ic-sm")}</button>
  </aside>`;
}
function topbar() {
  return `<header class="topbar">
    <a class="brand" href="${href("inicio")}">${logo()}<span class="wm">Zuri</span></a>
    <button class="iconbtn" type="button" aria-label="Buscar">${ic("search")}</button>
    <button class="iconbtn" type="button" aria-label="Avisos: 2 novos">${ic("bell")}<span class="badge" aria-hidden="true"></span></button>
    <button class="iconbtn" type="button" aria-label="Conta de Ana"><span class="avatar" aria-hidden="true">A</span></button>
  </header>`;
}
function tabbar() {
  const inTabs = TABS.some(([s]) => s === st.s);
  return `<nav class="tabbar" aria-label="Seções">${TABS.map(([s, i, l]) => {
    const on = s === st.s || (s === "mais" && !inTabs);
    const target = s === "mais" ? "#" : href(s);
    return `<a href="${target}"${on ? ' aria-current="page"' : ""}>${ic(i)}<span>${l}</span>${s === "tarefas" ? '<span class="dot" aria-hidden="true"></span>' : ""}</a>`;
  }).join("")}</nav>`;
}

/* ---------- peças ---------- */
const composer = (id, ph, big = false) => `<form class="composer${big ? " composer-lg" : ""}" aria-label="Escrever para a Zuri" onsubmit="return false">
  <label class="sr" for="${id}">Escreva para a Zuri</label>
  <textarea id="${id}" rows="1" placeholder="${ph}"></textarea>
  <div class="composer-acts">
    <button class="iconbtn" type="button" aria-label="Anexar um arquivo">${ic("paperclip")}</button>
    <button class="iconbtn" type="button" aria-label="Falar em vez de escrever">${ic("mic")}</button>
    <button class="sendbtn" type="submit" aria-label="Enviar para a Zuri">${ic("arrow-up")}</button>
  </div>
</form>`;
const chips = () => `<ul class="chips" aria-label="Ideias para começar">${["Organizar a semana", "O que tenho amanhã?", "Me lembre de pagar a luz"].map((c) => `<li><button class="chip" type="button">${c}</button></li>`).join("")}</ul>`;
const check = (t) => `<button class="check" type="button" role="checkbox" aria-checked="false" aria-label="Concluir “${t}”"></button>`;
function dayRow(d) {
  if (d.now) return `<li class="now" aria-label="Agora, 08:12"><span class="when num">08:12</span><span class="now-line" aria-hidden="true"></span></li>`;
  let k;
  if (d.kind === "a" || d.kind === "b") k = `<span class="kind"><i class="${d.kind}"></i></span>`;
  else if (d.kind === "auto") k = `<span class="kind">${ic("clock")}</span>`;
  else k = `<span class="kind">${check(d.t)}</span>`;
  let note = "";
  if (d.kind === "late") note = `<span class="late">${ic("triangle-alert", "ic-sm")}Atrasada</span>`;
  else if (d.hot) note = `<span class="prio hot">${ic("flag", "ic-sm")}${d.note}</span>`;
  else if (d.note) note = `<span class="num">${d.note}</span>`;
  const type = { a: "Evento", b: "Evento", auto: "Automação", task: "Tarefa", late: "Tarefa" }[d.kind];
  return `<li class="${d.past ? "past" : ""}"><span class="when num">${d.when}</span>${k}
    <span class="what"><span class="t">${d.t}</span><span class="sr">, ${type}</span>${d.sub ? `<span class="meta"><span>${d.sub}</span></span>` : ""}</span>
    <span class="side-note">${note}</span></li>`;
}
const attnList = () => `<ul class="card attn">${ATTN.map(([i, t, d, b, s]) => `<li><span class="tile">${ic(i)}</span><span class="txt"><span class="t">${t}</span><p class="d">${d}</p></span><a class="btn btn-secondary btn-sm" href="${href(s)}">${b}</a></li>`).join("")}</ul>`;
