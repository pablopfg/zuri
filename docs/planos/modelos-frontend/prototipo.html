<!doctype html>
<html lang="pt-BR" data-model="lima" data-theme="claro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Modelos de interface Zuri</title>
<meta name="description" content="Protótipo estático dos cinco modelos de interface da Zuri: Início e Conversa, claro e escuro.">
<!--
  Protótipo descartável (docs/planos/modelos-frontend.md). Não é o app.
  Parâmetros: ?m=lima|cobalto|petroleo|menta|floresta  &t=claro|escuro  &s=inicio|conversa  &captura=1 (esconde a barra de escolha).
  As fontes vêm do Google Fonts só aqui, para ver o modelo; no app elas entram como woff2 servido pelo próprio Worker.
  Paletas e pares de fontes sorteados pela skill taste-skill (commit f6b76575), avaliada em docs/planos/skill-taste.md.
-->
<style>
*{box-sizing:border-box}
html,body{margin:0}
:root{--s1:4px;--s2:8px;--s3:12px;--s4:16px;--s5:24px;--s6:32px;--s7:48px;--s8:64px;--side:264px}

/* ---------- 1 · Lima: grafite e lima, Red Hat ---------- */
[data-model="lima"]{--f-display:"Red Hat Display",system-ui,sans-serif;--f-text:"Red Hat Text",system-ui,sans-serif;--f-mono:"IBM Plex Mono",ui-monospace,monospace;--r:10px;--r-btn:10px;--track:-0.035em;--w-display:500}
[data-model="lima"][data-theme="escuro"]{--bg:#0f0f0f;--surface:#1a1a1a;--raised:#242424;--ink:#f4f4f0;--head:#ffffff;--muted:#a9a9a1;--line:#2e2e2b;--accent:#dafa9c;--on-accent:#11160a;--accent-text:#dafa9c;--soft:#232a14;--side-bg:#141414;--warn:#ffb86b}
[data-model="lima"][data-theme="claro"]{--bg:#f5f5ef;--surface:#ffffff;--raised:#ebebe2;--ink:#14160f;--head:#0b0c08;--muted:#55574e;--line:#dcdcd1;--accent:#d2f584;--on-accent:#14190a;--accent-text:#3c560d;--soft:#eef8d6;--side-bg:#ecece4;--warn:#9a4a00}

/* ---------- 2 · Cobalto: cinza frio e cobalto, Instrument Sans ---------- */
[data-model="cobalto"]{--f-display:"Instrument Sans",system-ui,sans-serif;--f-text:"Instrument Sans",system-ui,sans-serif;--f-mono:"DM Mono",ui-monospace,monospace;--r:6px;--r-btn:6px;--track:-0.036em;--w-display:500}
[data-model="cobalto"][data-theme="claro"]{--bg:#eef0f3;--surface:#ffffff;--raised:#e2e5ea;--ink:#0b0c0e;--head:#0b0c0e;--muted:#4a505a;--line:#d4d8df;--accent:#1f2de6;--on-accent:#ffffff;--accent-text:#1f2de6;--soft:#e4e7fd;--side-bg:#ffffff;--warn:#9a3d00}
[data-model="cobalto"][data-theme="escuro"]{--bg:#0b0d12;--surface:#141720;--raised:#1c202b;--ink:#eef0f5;--head:#ffffff;--muted:#a4aab8;--line:#272c39;--accent:#7d93ff;--on-accent:#050819;--accent-text:#9cadff;--soft:#1a2147;--side-bg:#10131a;--warn:#ffb56b}

/* ---------- 3 · Petróleo: papel e petróleo, Onest ---------- */
[data-model="petroleo"]{--f-display:"Onest",system-ui,sans-serif;--f-text:"Onest",system-ui,sans-serif;--f-mono:"JetBrains Mono",ui-monospace,monospace;--r:12px;--r-btn:12px;--track:-0.04em;--w-display:400}
[data-model="petroleo"][data-theme="claro"]{--bg:#f7f9f8;--surface:#ffffff;--raised:#ebf0ee;--ink:#10292d;--head:#06525c;--muted:#4c6265;--line:#d5dfdc;--accent:#06525c;--on-accent:#ffffff;--accent-text:#06525c;--soft:#e2eeec;--side-bg:#f7f9f8;--warn:#8f3f00}
[data-model="petroleo"][data-theme="escuro"]{--bg:#061a1d;--surface:#0b2529;--raised:#113237;--ink:#e3eeec;--head:#94dcd5;--muted:#9cb5b2;--line:#1c3c41;--accent:#7fd1cb;--on-accent:#031416;--accent-text:#94dcd5;--soft:#0f3438;--side-bg:#061a1d;--warn:#ffb779}

/* ---------- 4 · Menta: branco e menta, Outfit ---------- */
[data-model="menta"]{--f-display:"Outfit",system-ui,sans-serif;--f-text:"Outfit",system-ui,sans-serif;--f-mono:"DM Mono",ui-monospace,monospace;--r:20px;--r-btn:999px;--track:-0.04em;--w-display:400}
[data-model="menta"][data-theme="claro"]{--bg:#ffffff;--surface:#f4f4f3;--raised:#e9eae8;--ink:#232323;--head:#161616;--muted:#5a5b59;--line:#e3e4e2;--accent:#a1ffcb;--on-accent:#0a2a19;--accent-text:#0a7041;--soft:#e3fff0;--side-bg:#f7f7f6;--warn:#9a3f00}
[data-model="menta"][data-theme="escuro"]{--bg:#111312;--surface:#1b1e1c;--raised:#252926;--ink:#f0f3f1;--head:#ffffff;--muted:#a7ada9;--line:#2c312e;--accent:#a1ffcb;--on-accent:#0a2a19;--accent-text:#a1ffcb;--soft:#183526;--side-bg:#161917;--warn:#ffb779}

/* ---------- 5 · Floresta: verde-preto e osso, Epilogue ---------- */
[data-model="floresta"]{--f-display:"Epilogue",system-ui,sans-serif;--f-text:"Epilogue",system-ui,sans-serif;--f-mono:"JetBrains Mono",ui-monospace,monospace;--r:4px;--r-btn:4px;--track:-0.045em;--w-display:500}
[data-model="floresta"][data-theme="escuro"]{--bg:#161c1a;--surface:#1f2725;--raised:#283230;--ink:#e3e2da;--head:#f2f1ea;--muted:#a8ada4;--line:#313b38;--accent:#9fc7b8;--on-accent:#0d1412;--accent-text:#b4d6ca;--soft:#22312c;--side-bg:#121715;--warn:#f2b97a}
[data-model="floresta"][data-theme="claro"]{--bg:#f1f0ea;--surface:#fbfaf6;--raised:#e5e3da;--ink:#161c1a;--head:#0f1412;--muted:#52584f;--line:#d6d3c8;--accent:#2f5e50;--on-accent:#f6f5f0;--accent-text:#2a5648;--soft:#dde7e1;--side-bg:#e8e6de;--warn:#8f3f00}

body{background:var(--bg);color:var(--ink);font:400 16px/1.55 var(--f-text);-webkit-font-smoothing:antialiased}
button,input,textarea{font:inherit;color:inherit}
a{color:var(--accent-text)}
:focus-visible{outline:2px solid var(--accent-text);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.skip{position:absolute;left:8px;top:-60px;background:var(--surface);padding:8px 12px;border-radius:8px;z-index:9}
.skip:focus{top:8px}
.ic{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
.ic.sm{width:16px;height:16px}

/* barra de escolha do protótipo (some nas capturas) */
.picker{margin:0;border:0;min-width:0;display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:8px 16px;background:#0b0f19;color:#f8fafc;font:500 13px/1.4 system-ui,sans-serif}
.picker label{display:flex;gap:6px;align-items:center}
.picker select{background:#1a2233;color:#f8fafc;border:1px solid #56627a;border-radius:6px;padding:4px 8px;min-height:32px}
[data-captura] .picker{display:none}

/* ---------- moldura ---------- */
.app{display:grid;grid-template-columns:var(--side) 1fr;min-height:100vh}
[data-captura] .app{height:100vh;min-height:0}
.side{background:var(--side-bg);border-right:1px solid var(--line);display:flex;flex-direction:column;gap:var(--s4);padding:var(--s4) var(--s3);overflow:hidden}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px;font:var(--w-display) 20px/1 var(--f-display);letter-spacing:var(--track);color:var(--head);text-decoration:none}
.mark{width:32px;height:32px;border-radius:calc(var(--r) * .8);background:var(--head);color:var(--bg);display:grid;place-items:center;font:600 17px/1 var(--f-display);position:relative}
.mark::after{content:"";position:absolute;right:-3px;top:-3px;width:10px;height:10px;border-radius:50%;background:var(--accent);border:2px solid var(--side-bg)}
.side-actions{display:grid;gap:var(--s2)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 16px;border-radius:var(--r-btn);border:1px solid transparent;font-weight:500;cursor:pointer;text-decoration:none}
.btn-primary{background:var(--accent);color:var(--on-accent)}
.btn-ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.side .btn{justify-content:flex-start;width:100%}
.kbd{margin-left:auto;font:500 13px/1 var(--f-mono);color:var(--muted)}
.nav{display:grid;gap:2px;margin:0;padding:0;list-style:none}
.nav a{display:flex;align-items:center;gap:12px;min-height:40px;padding:0 12px;border-radius:calc(var(--r) * .8);color:var(--ink);text-decoration:none}
.nav a[aria-current="page"]{background:var(--raised);color:var(--head);font-weight:500}
.side h2{font:500 13px/1.3 var(--f-text);color:var(--muted);margin:var(--s2) 12px 4px}
.recent{list-style:none;margin:0;padding:0;display:grid;gap:2px}
.recent a{display:block;padding:8px 12px;border-radius:calc(var(--r) * .8);color:var(--ink);text-decoration:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.account{margin-top:auto;display:flex;align-items:center;gap:12px;min-height:52px;padding:8px;border-radius:var(--r);border:1px solid var(--line);background:var(--surface);width:100%;text-align:left;cursor:pointer}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--soft);color:var(--head);display:grid;place-items:center;font-weight:600;flex:none}
.account small{display:block;color:var(--muted);font-size:13px}

.main{display:flex;flex-direction:column;min-width:0;min-height:0;overflow:auto}
#conteudo{flex:1;min-height:0;display:flex;flex-direction:column}
#conteudo>*{flex:1 0 auto;min-height:0}
#conteudo>.chat,#conteudo>.split,#conteudo>.conv-layout{flex:1 1 0}
.top{display:none}
.page{width:100%;max-width:1040px;margin:0 auto;padding:var(--s7) var(--s7) var(--s8)}
.eyebrow{font:500 13px/1.3 var(--f-mono);color:var(--muted);margin:0 0 var(--s2)}
h1{font:var(--w-display) clamp(32px,2.6vw + 12px,48px)/1.08 var(--f-display);letter-spacing:var(--track);color:var(--head);margin:0}
h2{font:var(--w-display) 20px/1.25 var(--f-display);letter-spacing:-0.02em;color:var(--head);margin:0}
.lead{color:var(--muted);margin:var(--s2) 0 0;max-width:62ch}
.muted{color:var(--muted)}

.composer{display:flex;align-items:flex-end;gap:var(--s2);background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:var(--s2) var(--s2) var(--s2) var(--s4)}
.composer textarea{flex:1;border:0;background:transparent;resize:none;min-height:44px;padding:10px 0;outline:none}
.composer:focus-within{border-color:var(--accent-text)}
.icon-btn{width:44px;height:44px;display:grid;place-items:center;border-radius:var(--r-btn);border:0;background:transparent;color:var(--ink);cursor:pointer}
.send{background:var(--accent);color:var(--on-accent)}
.chips{display:flex;flex-wrap:wrap;gap:var(--s2);margin-top:var(--s3)}
.chip{min-height:44px;padding:0 14px;border-radius:var(--r-btn);border:1px solid var(--line);background:transparent;cursor:pointer;display:inline-flex;align-items:center;gap:8px}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:var(--s5)}
.card-head{display:flex;align-items:baseline;justify-content:space-between;gap:var(--s3);margin-bottom:var(--s3)}
.card-head a{font-size:14px;font-weight:500;min-height:44px;display:inline-flex;align-items:center}
.list{list-style:none;margin:0;padding:0}
.list li{display:flex;align-items:center;gap:var(--s3);padding:12px 0;border-top:1px solid var(--line)}
.list li:first-child{border-top:0}
.check{width:22px;height:22px;border:1.5px solid var(--muted);border-radius:6px;flex:none;background:transparent;cursor:pointer;padding:0}
.when{margin-left:auto;font:500 13px/1.3 var(--f-mono);color:var(--muted);white-space:nowrap}
.late{color:var(--warn)}
.tag{font:500 13px/1 var(--f-text);padding:4px 8px;border-radius:999px;background:var(--soft);color:var(--head)}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--s5);margin-top:var(--s6)}

/* conversa */
.chat{display:flex;flex-direction:column;height:100%;min-height:0}
.chat-head{display:flex;align-items:center;justify-content:space-between;gap:var(--s3);padding:var(--s4) var(--s7);border-bottom:1px solid var(--line)}
.chat-head h1{font-size:20px;letter-spacing:-0.02em}
.thread{flex:1;overflow:auto;padding:var(--s6) var(--s7)}
.thread-in{max-width:760px;margin:0 auto;display:grid;gap:var(--s5)}
.msg{max-width:84%}
.msg p{margin:0 0 8px}
.msg p:last-child{margin:0}
.msg.me{justify-self:end;background:var(--raised);color:var(--ink);padding:12px 16px;border-radius:var(--r)}
.msg.zuri{justify-self:start}
.who{font:500 13px/1.3 var(--f-text);color:var(--muted);margin-bottom:6px;display:flex;align-items:center;gap:8px}
.tool{display:inline-flex;align-items:center;gap:8px;padding:6px 10px;border-radius:var(--r-btn);border:1px solid var(--line);background:var(--surface);font-size:14px;margin:0 8px 8px 0}
.tool .ic{color:var(--accent-text)}
.dock{padding:var(--s3) var(--s7) var(--s5)}
.dock-in{max-width:760px;margin:0 auto}
.dock small{display:block;text-align:center;color:var(--muted);font-size:13px;margin-top:8px}
.thinking{display:inline-flex;align-items:center;gap:8px;color:var(--muted);font-size:14px}
.pulse{width:8px;height:8px;border-radius:50%;background:var(--accent-text);animation:p 1.2s ease-in-out infinite}
@keyframes p{50%{opacity:.35}}
@media (prefers-reduced-motion:reduce){.pulse{animation:none}}

/* ======== variações por modelo ======== */
/* Lima: listas em linhas finas, faixa de estado em mono, conversa sem balões */
[data-model="lima"] .card{background:transparent;border:0;border-top:1px solid var(--line);border-radius:0;padding:var(--s4) 0 0}
[data-model="lima"] .status{display:flex;flex-wrap:wrap;gap:var(--s2) var(--s5);font:500 14px/1.4 var(--f-mono);color:var(--muted);margin-top:var(--s4)}
[data-model="lima"] .status b{color:var(--head);font-weight:500}
[data-model="lima"] .home-composer{margin-top:var(--s6)}
[data-model="lima"] .home-composer .composer{border-radius:14px;padding:12px 12px 12px 20px;min-height:72px;align-items:center}
[data-model="lima"] .msg.me{background:transparent;border:1px solid var(--line)}
[data-model="lima"] .msg.zuri{border-left:2px solid var(--accent-text);padding-left:16px}
[data-model="lima"] .nav a[aria-current="page"]{background:var(--surface);box-shadow:inset 2px 0 0 var(--accent-text)}

/* Cobalto: barra de busca no topo, painel em cartões, balões cobalto */
[data-model="cobalto"] .bar{display:flex;align-items:center;gap:var(--s3);padding:var(--s3) var(--s7);border-bottom:1px solid var(--line);background:var(--surface)}
[data-model="cobalto"] .bar .search{flex:1;cursor:pointer;text-align:left;max-width:520px;display:flex;align-items:center;gap:10px;min-height:40px;padding:0 12px;border:1px solid var(--line);border-radius:var(--r);color:var(--muted);background:var(--bg)}
[data-model="cobalto"] .bar .search .kbd{margin-left:auto}
[data-model="cobalto"] .grid{grid-template-columns:repeat(3,minmax(0,1fr))}
[data-model="cobalto"] .grid .wide{grid-column:span 2}
[data-model="cobalto"] .stat{font:500 40px/1 var(--f-display);letter-spacing:-0.04em;color:var(--head)}
[data-model="cobalto"] .msg.me{background:var(--accent);color:var(--on-accent);border-radius:var(--r) var(--r) 2px var(--r)}
[data-model="cobalto"] .msg.zuri{background:var(--surface);border:1px solid var(--line);padding:14px 16px;border-radius:var(--r) var(--r) var(--r) 2px}
[data-model="cobalto"] .nav a[aria-current="page"]{background:var(--soft);color:var(--accent-text)}

/* Petróleo: coluna única de leitura, dia em linha do tempo, conversa como documento */
[data-model="petroleo"] .page{max-width:760px}
[data-model="petroleo"] h1{font-size:clamp(34px,2.4vw + 16px,52px)}
[data-model="petroleo"] .summary{font-size:20px;line-height:1.6;color:var(--ink);margin:var(--s5) 0 0;max-width:34em}
[data-model="petroleo"] .summary b{color:var(--head);font-weight:500}
[data-model="petroleo"] .timeline{list-style:none;margin:var(--s3) 0 0;padding:0;border-left:1px solid var(--line)}
[data-model="petroleo"] .timeline li{position:relative;padding:12px 0 12px 24px;display:grid;grid-template-columns:120px 1fr;gap:12px}
[data-model="petroleo"] .timeline li::before{content:"";position:absolute;left:-5px;top:20px;width:9px;height:9px;border-radius:50%;background:var(--bg);border:1.5px solid var(--accent-text)}
[data-model="petroleo"] .timeline time{font:500 14px/1.6 var(--f-mono);color:var(--muted)}
[data-model="petroleo"] .section{margin-top:var(--s7)}
[data-model="petroleo"] .msg{max-width:100%;justify-self:stretch}
[data-model="petroleo"] .msg.me{background:transparent;padding:0}
[data-model="petroleo"] .msg + .msg{border-top:1px solid var(--line);padding-top:var(--s5)}
[data-model="petroleo"] .msg.zuri p{font-size:17px;line-height:1.7}
[data-model="petroleo"] .side{border-right:1px solid var(--line)}

/* Menta: cantos redondos, atalhos em ladrilhos, balões menta */
[data-model="menta"] .hero-card{background:var(--surface);border-radius:28px;padding:var(--s6)}
[data-model="menta"] .hero-card .composer{background:var(--bg);border-radius:20px}
[data-model="menta"] .tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--s3);margin-top:var(--s5)}
[data-model="menta"] .tile{display:flex;align-items:center;gap:12px;min-height:64px;padding:12px 16px;border-radius:20px;border:1px solid var(--line);background:var(--bg);text-decoration:none;color:var(--ink);font-weight:500}
[data-model="menta"] .tile span.ico{width:40px;height:40px;border-radius:50%;background:var(--accent);color:var(--on-accent);display:grid;place-items:center}
[data-model="menta"] .card{border:0;background:var(--surface)}
[data-model="menta"] .check{border-radius:50%}
[data-model="menta"] .nav a{border-radius:999px}
[data-model="menta"] .nav a[aria-current="page"]{background:var(--accent);color:var(--on-accent)}
[data-model="menta"] .msg.me{background:var(--accent);color:var(--on-accent);border-radius:22px 22px 6px 22px}
[data-model="menta"] .msg.zuri{background:var(--surface);padding:14px 18px;border-radius:22px 22px 22px 6px}
[data-model="menta"] .composer{border-radius:24px}
[data-model="menta"] .account{border-radius:999px}

/* Floresta: números grandes, conversa sempre ao lado no Início, cantos retos */
[data-model="floresta"] .split{display:grid;grid-template-columns:minmax(0,1fr) 380px;height:100%;min-height:0}
[data-model="floresta"] .split .page{max-width:none;overflow:auto}
[data-model="floresta"] .side-chat{border-left:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;min-height:0}
[data-model="floresta"] .side-chat .thread{padding:var(--s5)}
[data-model="floresta"] .side-chat .dock{padding:var(--s3) var(--s5) var(--s5)}
[data-model="floresta"] .side-chat .chat-head{padding:var(--s4) var(--s5)}
[data-model="floresta"] h1{font-size:clamp(36px,3vw + 12px,60px);line-height:1;text-transform:none}
[data-model="floresta"] .stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin-top:var(--s6)}
[data-model="floresta"] .stats div{padding:var(--s4) var(--s4) var(--s4) 0}
[data-model="floresta"] .stats div + div{border-left:1px solid var(--line);padding-left:var(--s4)}
[data-model="floresta"] .stats b{display:block;font:500 56px/1 var(--f-display);letter-spacing:-0.05em;color:var(--head)}
[data-model="floresta"] .card{background:transparent;border:0;padding:0}
[data-model="floresta"] .card-head{border-bottom:2px solid var(--head);padding-bottom:8px}
[data-model="floresta"] .msg.me{background:var(--raised)}
[data-model="floresta"] .msg.zuri{padding:0}
[data-model="floresta"] .nav a[aria-current="page"]{background:var(--head);color:var(--bg)}
[data-model="floresta"] .convs{border-right:1px solid var(--line);padding:var(--s4) var(--s3);overflow:auto;background:var(--bg)}
[data-model="floresta"] .conv-layout{display:grid;grid-template-columns:300px minmax(0,1fr);height:100%;min-height:0}
[data-model="floresta"] .convs a{display:block;padding:12px;border-bottom:1px solid var(--line);color:var(--ink);text-decoration:none}
[data-model="floresta"] .convs a[aria-current="page"]{background:var(--surface);box-shadow:inset 3px 0 0 var(--accent-text)}
[data-model="floresta"] .convs small{display:block;color:var(--muted);font:500 13px/1.4 var(--f-mono);margin-top:2px}

[data-model] .chat-head h1{font-size:20px;line-height:1.25;letter-spacing:-0.02em}

/* ---------- celular ---------- */
@media (max-width:820px){
  .app{grid-template-columns:1fr}
  .side{display:none}
  .top{display:flex;align-items:center;gap:var(--s2);padding:var(--s2) var(--s3);border-bottom:1px solid var(--line);background:var(--bg);position:sticky;top:0;z-index:2}
  .top .brand{margin-right:auto;font-size:18px}
  .page{padding:var(--s5) var(--s4) var(--s7)}
  .grid,[data-model="cobalto"] .grid{grid-template-columns:1fr;gap:var(--s4)}
  [data-model="cobalto"] .grid .wide{grid-column:auto}
  [data-model="cobalto"] .bar{display:none}
  [data-model="menta"] .tiles{grid-template-columns:1fr}
  [data-model="menta"] .hero-card{padding:var(--s5) var(--s4);border-radius:24px}
  [data-model="floresta"] .split{grid-template-columns:1fr}
  [data-model="floresta"] .side-chat{display:none}
  [data-model="floresta"] .conv-layout{grid-template-columns:1fr}
  [data-model="floresta"] .convs{display:none}
  [data-model="floresta"] .stats b{font-size:40px}
  .chat-head{padding:var(--s3) var(--s4)}
  .thread{padding:var(--s5) var(--s4)}
  .dock{padding:var(--s2) var(--s3) calc(var(--s3) + env(safe-area-inset-bottom))}
  .msg{max-width:92%}
  [data-model="petroleo"] .summary{font-size:18px}
  [data-model="petroleo"] .timeline li{grid-template-columns:96px 1fr}
}
</style>
</head>
<body>
<a class="skip" href="#conteudo">Pular para o conteúdo</a>
<aside aria-label="Controles do protótipo"><fieldset class="picker"><legend class="sr">Escolher o que ver no protótipo</legend>
  <label>Modelo
    <select id="pm">
      <option value="lima">1 · Lima</option>
      <option value="cobalto">2 · Cobalto</option>
      <option value="petroleo">3 · Petróleo</option>
      <option value="menta">4 · Menta</option>
      <option value="floresta">5 · Floresta</option>
    </select>
  </label>
  <label>Tela
    <select id="ps"><option value="inicio">Início</option><option value="conversa">Conversa</option></select>
  </label>
  <label>Tema
    <select id="pt"><option value="claro">Claro</option><option value="escuro">Escuro</option></select>
  </label>
</fieldset></aside>
<div class="app" id="app"></div>

<script>
const I = {
  menu: '<path d="M4 6h16M4 12h16M4 18h16"/>',
  plus: '<path d="M12 5v14M5 12h14"/>',
  newchat: '<path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/>',
  search: '<circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>',
  home: '<path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1Z"/>',
  chat: '<path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12Z"/>',
  tasks: '<path d="m9 11 3 3 8-8"/><path d="M20 12v7a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h9"/>',
  notes: '<path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9Z"/><path d="M14 3v6h6M8 13h8M8 17h5"/>',
  cal: '<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 10h18"/>',
  zap: '<path d="M13 2 4 14h7l-1 8 9-12h-7Z"/>',
  memory: '<path d="M12 3a4 4 0 0 0-4 4v1a4 4 0 0 0-2 7 4 4 0 0 0 6 4 4 4 0 0 0 6-4 4 4 0 0 0-2-7V7a4 4 0 0 0-4-4Z"/>',
  bell: '<path d="M6 8a6 6 0 1 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.9 1.9 0 0 0 3.4 0"/>',
  send: '<path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/>',
  mic: '<rect x="9" y="2" width="6" height="12" rx="3"/><path d="M19 10a7 7 0 0 1-14 0M12 17v5"/>',
  spark: '<path d="M12 3v4M12 17v4M3 12h4M17 12h4M6 6l2.5 2.5M15.5 15.5 18 18M6 18l2.5-2.5M15.5 8.5 18 6"/>',
  check: '<path d="M20 6 9 17l-5-5"/>',
  clock: '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
  more: '<circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/>'
};
const ic = (n, c = "") => `<svg class="ic ${c}" viewBox="0 0 24 24" aria-hidden="true">${I[n]}</svg>`;

const params = new URLSearchParams(location.search);
const st = {
  m: params.get("m") || "lima",
  s: params.get("s") || "inicio",
  t: params.get("t") || "claro"
};
if (params.get("captura")) document.documentElement.dataset.captura = "1";

const FONTS = {
  lima: "Red+Hat+Display:wght@400;500;600&family=Red+Hat+Text:wght@400;500&family=IBM+Plex+Mono:wght@500",
  cobalto: "Instrument+Sans:wght@400;500;600&family=DM+Mono:wght@500",
  petroleo: "Onest:wght@400;500;600&family=JetBrains+Mono:wght@500",
  menta: "Outfit:wght@400;500;600&family=DM+Mono:wght@500",
  floresta: "Epilogue:wght@400;500;600&family=JetBrains+Mono:wght@500"
};

const NAV = [
  ["inicio", "home", "Início"], ["conversa", "chat", "Conversa"], ["tarefas", "tasks", "Tarefas"],
  ["notas", "notes", "Notas"], ["agenda", "cal", "Agenda"], ["automacoes", "zap", "Automações"], ["memoria", "memory", "Memória"]
];
const RECENT = ["O que tenho amanhã?", "Lista da mudança", "Resumo da semana", "Presente da Bia"];
const TODAY = [
  ["Separar documentos para a imobiliária", "Atrasada", true],
  ["Pagar o condomínio", "Hoje", false],
  ["Ligar para a transportadora", "Hoje", false]
];
const NEXT = [
  ["Vistoria do apartamento novo", "Amanhã, 09:00", ""],
  ["Resumo da manhã", "Qua, 07:30", "Automação"],
  ["Aula do curso de fotografia", "Sex, 19:00", ""]
];
const IDEAS = ["Organizar a semana", "O que tenho amanhã?", "Me lembre de pagar a luz"];

function side() {
  const nav = NAV.map(([id, i, l]) => `<li><a href="?m=${st.m}&s=${id === "conversa" ? "conversa" : "inicio"}&t=${st.t}"${id === st.s ? ' aria-current="page"' : ""}>${ic(i)}${l}</a></li>`).join("");
  const rec = RECENT.map((r, n) => `<li><a href="?m=${st.m}&s=conversa&t=${st.t}"${st.s === "conversa" && n === 0 ? ' aria-current="page"' : ""}>${r}</a></li>`).join("");
  return `<aside class="side" aria-label="Menu">
    <a class="brand" href="?m=${st.m}&s=inicio&t=${st.t}" aria-label="Zuri, página inicial"><span class="mark" aria-hidden="true">Z</span>Zuri</a>
    <div class="side-actions">
      <a class="btn btn-primary" href="?m=${st.m}&s=conversa&t=${st.t}">${ic("newchat")}Nova conversa</a>
      <button class="btn btn-ghost" type="button">${ic("search")}Buscar<span class="kbd">Ctrl K</span></button>
    </div>
    <nav aria-label="Navegação principal"><ul class="nav">${nav}</ul></nav>
    <div><h2>Recentes</h2><ul class="recent">${rec}</ul></div>
    <button class="account" type="button" aria-label="Menu da conta: Ana"><span class="avatar" aria-hidden="true">A</span><span>Ana<small>Configurações e tema</small></span></button>
  </aside>`;
}

function topbar() {
  return `<header class="top">
    <button class="icon-btn" type="button" aria-label="Abrir menu" aria-expanded="false">${ic("menu")}</button>
    <a class="brand" href="?m=${st.m}&s=inicio&t=${st.t}" aria-label="Zuri, página inicial"><span class="mark" aria-hidden="true">Z</span>Zuri</a>
    <button class="icon-btn" type="button" aria-label="Avisos">${ic("bell")}</button>
    <a class="icon-btn" href="?m=${st.m}&s=conversa&t=${st.t}" aria-label="Nova conversa">${ic("newchat")}</a>
  </header>`;
}

const composer = (ph, id) => `<form class="composer" onsubmit="return false"><label class="sr" for="${id}">${ph}</label>
  <textarea id="${id}" rows="1" placeholder="${ph}"></textarea>
  <button class="icon-btn" type="button" aria-label="Gravar áudio">${ic("mic")}</button>
  <button class="icon-btn send" type="submit" aria-label="Enviar para a Zuri">${ic("send")}</button></form>`;
const chips = () => `<div class="chips" role="group" aria-label="Ideias para começar">${IDEAS.map((x) => `<button class="chip" type="button">${ic("spark", "sm")}${x}</button>`).join("")}</div>`;
const todayList = () => `<ul class="list">${TODAY.map(([t, w, late]) => `<li><button class="check" type="button" aria-label="Concluir: ${t}"></button><span>${t}</span><span class="when${late ? " late" : ""}">${w}</span></li>`).join("")}</ul>`;
const nextList = () => `<ul class="list">${NEXT.map(([t, w, tag]) => `<li><span>${t}${tag ? ` <span class="tag">${tag}</span>` : ""}</span><span class="when">${w}</span></li>`).join("")}</ul>`;
const cardToday = () => `<section class="card" aria-labelledby="h-hoje"><div class="card-head"><h2 id="h-hoje">Hoje</h2><a href="#conteudo">Ver tarefas</a></div>${todayList()}</section>`;
const cardNext = () => `<section class="card" aria-labelledby="h-prox"><div class="card-head"><h2 id="h-prox">Próximos dias</h2><a href="#conteudo">Ver próximas</a></div>${nextList()}</section>`;

function messages(compact) {
  return `<div class="msg me"><span class="sr">Você disse:</span><p>O que tenho amanhã?</p></div>
  <div class="msg zuri"><div class="who">${st.m === "petroleo" ? "" : '<span class="mark" aria-hidden="true" style="width:22px;height:22px;font-size:12px">Z</span>'}Zuri</div>
    <p>Amanhã você tem duas coisas marcadas: a vistoria do apartamento novo às 09:00 e a aula de fotografia às 19:00.</p>
    <p>Também vence “Separar documentos para a imobiliária”, que já está atrasada. Quer que eu te lembre da vistoria às 08:00?</p></div>
  <div class="msg me"><span class="sr">Você disse:</span><p>Quero. E anota que preciso levar a planta.</p></div>
  <div class="msg zuri"><div class="who">${st.m === "petroleo" ? "" : '<span class="mark" aria-hidden="true" style="width:22px;height:22px;font-size:12px">Z</span>'}Zuri</div>
    <div><span class="tool">${ic("clock", "sm")}Lembrete criado · amanhã, 08:00</span>${compact ? "" : `<span class="tool">${ic("notes", "sm")}Nota criada · Vistoria</span>`}</div>
    <p>Pronto. Às 08:00 eu te aviso, e a nota “Vistoria” já tem a planta na lista do que levar.</p></div>`;
}

function chatPane(compact, title) {
  return `<div class="chat">
    <div class="chat-head"><h1>${title}</h1><button class="icon-btn" type="button" aria-label="Mais opções da conversa">${ic("more")}</button></div>
    <div class="thread" role="log" aria-label="Mensagens" tabindex="0"><div class="thread-in">${messages(compact)}</div></div>
    <div class="dock"><div class="dock-in">${composer(compact ? "Escreva para a Zuri" : "Responda ou peça outra coisa", compact ? "c2" : "c1")}<small>A Zuri pede a sua confirmação antes de apagar ou mandar algo.</small></div></div>
  </div>`;
}

function inicio() {
  const head = `<p class="eyebrow">Segunda, 9 de novembro</p><h1>Bom dia, Ana</h1>`;
  if (st.m === "lima") {
    return `<div class="page">${head}
      <p class="status"><span><b>3</b> tarefas para hoje</span><span><b>1</b> atrasada</span><span>próxima automação <b>07:30</b></span></p>
      <div class="home-composer">${composer("Escreva para a Zuri", "h1c")}${chips()}</div>
      <div class="grid">${cardToday()}${cardNext()}</div></div>`;
  }
  if (st.m === "cobalto") {
    return `<div class="page">${head}<p class="lead">Três tarefas para hoje e uma vistoria amanhã cedo.</p>
      <div class="grid">
        <section class="card wide" aria-labelledby="h-ask"><div class="card-head"><h2 id="h-ask">Falar com a Zuri</h2></div>${composer("Escreva para a Zuri", "h1c")}${chips()}</section>
        <section class="card" aria-labelledby="h-num"><div class="card-head"><h2 id="h-num">Resumo</h2></div><p class="stat">3</p><p class="muted" style="margin:6px 0 0">tarefas, <span class="late">1 atrasada</span></p></section>
        <div class="wide">${cardToday()}</div>
        ${cardNext()}
      </div></div>`;
  }
  if (st.m === "petroleo") {
    return `<div class="page">${head}
      <p class="summary">Hoje são <b>três tarefas</b>, uma delas atrasada. Amanhã cedo tem a <b>vistoria do apartamento novo</b>, então vale separar os documentos ainda hoje.</p>
      <div class="section">${composer("Escreva para a Zuri", "h1c")}${chips()}</div>
      <section class="section" aria-labelledby="h-dia"><h2 id="h-dia">O seu dia</h2>
        <ol class="timeline">
          <li><time>Atrasada</time><span>Separar documentos para a imobiliária</span></li>
          <li><time>Hoje</time><span>Pagar o condomínio</span></li>
          <li><time>Hoje</time><span>Ligar para a transportadora</span></li>
          <li><time>Amanhã 09:00</time><span>Vistoria do apartamento novo</span></li>
          <li><time>Qua 07:30</time><span>Resumo da manhã <span class="tag">Automação</span></span></li>
        </ol></section></div>`;
  }
  if (st.m === "menta") {
    return `<div class="page"><div class="hero-card">${head}<p class="lead">Em que posso ajudar hoje?</p>
      <div style="margin-top:24px">${composer("Escreva para a Zuri", "h1c")}</div>${chips()}</div>
      <div class="tiles">
        <a class="tile" href="#conteudo"><span class="ico">${ic("plus")}</span>Nova tarefa</a>
        <a class="tile" href="#conteudo"><span class="ico">${ic("notes")}</span>Nova nota</a>
        <a class="tile" href="#conteudo"><span class="ico">${ic("cal")}</span>Agenda de hoje</a>
      </div>
      <div class="grid">${cardToday()}${cardNext()}</div></div>`;
  }
  return `<div class="split"><div class="page">${head}
      <div class="stats"><div><b>3</b><span class="muted">tarefas hoje</span></div><div><b class="late">1</b><span class="muted">atrasada</span></div><div><b>2</b><span class="muted">compromissos amanhã</span></div></div>
      <div class="grid">${cardToday()}${cardNext()}</div></div>
    <aside class="side-chat" aria-label="Conversa rápida">${chatPane(true, "Conversa")}</aside></div>`;
}

function conversa() {
  if (st.m === "floresta") {
    const list = RECENT.map((r, n) => `<a href="?m=${st.m}&s=conversa&t=${st.t}"${n === 0 ? ' aria-current="page"' : ""}>${r}<small>${["hoje, 08:12", "ontem", "sáb", "qui"][n]}</small></a>`).join("");
    return `<div class="conv-layout"><nav class="convs" aria-label="Conversas">${list}</nav>${chatPane(false, "O que tenho amanhã?")}</div>`;
  }
  return chatPane(false, "O que tenho amanhã?");
}

function render() {
  const html = document.documentElement;
  html.dataset.model = st.m;
  html.dataset.theme = st.t;
  document.getElementById("pm").value = st.m;
  document.getElementById("ps").value = st.s;
  document.getElementById("pt").value = st.t;
  let link = document.getElementById("fonts");
  if (!link) { link = document.createElement("link"); link.id = "fonts"; link.rel = "stylesheet"; document.head.appendChild(link); }
  link.href = `https://fonts.googleapis.com/css2?family=${FONTS[st.m]}&display=swap`;
  const bar = st.m === "cobalto" && st.s === "inicio"
    ? `<div class="bar" role="search"><button class="search" type="button">${ic("search", "sm")}Buscar tarefas, notas e conversas<span class="kbd">Ctrl K</span></button><button class="icon-btn" type="button" aria-label="Avisos">${ic("bell")}</button></div>` : "";
  document.getElementById("app").innerHTML = `${side()}<div class="main">${topbar()}${bar}<main id="conteudo">${st.s === "conversa" ? conversa() : inicio()}</main></div>`;
}
for (const [id, k] of [["pm", "m"], ["ps", "s"], ["pt", "t"]]) {
  document.getElementById(id).addEventListener("change", (e) => {
    st[k] = e.target.value;
    history.replaceState(null, "", `?m=${st.m}&s=${st.s}&t=${st.t}`);
    render();
  });
}
render();
</script>
</body>
</html>
