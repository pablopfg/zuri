name: CI

# Runs on pull requests and on each push to develop, and never sees a secret.
# develop changes only through pull requests (rulesets in .github/rulesets/);
# the push run exists for the README badge (?branch=develop), which reads only
# runs on develop itself, and so develop's own state is always on record.
# Each job name is a check required by the rulesets. A push by update-prs.yml (GITHUB_TOKEN) starts this
# run held for approval, and that workflow approves it: the rulesets count only
# the checks of pull_request runs, never of a workflow_dispatch run.
# deploy.yml calls this same workflow on main before it deploys (step 24).
on:
  pull_request:
  push:
    branches: [develop]
  workflow_call:

permissions:
  contents: read

# A new commit on the same pull request cancels the run still going. On develop
# the running one always finishes (GitHub keeps only the newest waiting run),
# so the badge reads a finished run, not one cut short.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  typecheck:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck

  lint:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint

  test:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # The whole suite with coverage; under the floors in vitest.config.ts it fails.
      - run: npm run test:coverage

  i18n:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run i18n

  build:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      # Rule P11: the initial JavaScript stays under its budget.
      - run: npm run size
      # The production deploy's config and bundle, with example values and no
      # credential: a broken deploy fails here, not halfway through deploy.yml.
      - name: Check the deploy config
        env:
          ZURI_DOMAIN: zuri.exemplo.com.br
          ZURI_ALERT_EMAIL_TO: dono@exemplo.com.br
          ZURI_BACKUP_BUCKET: zuri-backup
        run: |
          node scripts/deploy/gerar-config.ts
          cd apps/agent && npx --no-install wrangler deploy --dry-run -c wrangler.deploy.json

  # e2e and lighthouse open the built interface on the real Worker. A pull
  # request with only text (docs, changelog, the agent's memory) or only the
  # version number (the release pull request) has nothing for them to open:
  # scripts/precisa-de-e2e.ts says so and the steps after it are skipped. The
  # job still runs and ends green, because the rulesets require both checks
  # (a workflow filtered by `paths` would leave them waiting forever). The
  # decision is a step here, not a job these depend on: if that job failed,
  # these would read as "skipped", which the rulesets take for a pass. Any
  # answer other than an explicit "false" runs the suite, and so does every
  # push to develop and the run before a deploy.
  #
  # The e2e suite runs in four parts, each on its own runner with its own
  # Worker and database (playwright --shard splits by file, every test in
  # exactly one part). One worker ran the whole suite until 11/11/2026: 377
  # tests took 25 to 29 min and the next screen's tests hit the 30 min limit
  # with nothing failing. The parts are not required checks; the "e2e" job
  # below is, and it answers for them.
  e2e-parte:
    name: e2e (parte ${{ matrix.parte }} de 4)
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    strategy:
      # Every part reports: a failure in one says nothing about the others.
      fail-fast: false
      matrix:
        parte: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The merge commit and its parents: precisa-de-e2e.ts reads the pull request's changes from them.
          fetch-depth: 2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - id: browser
        run: node scripts/precisa-de-e2e.ts
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
      - if: steps.browser.outputs.run != 'false'
        run: npm ci
      - if: steps.browser.outputs.run != 'false'
        run: npx playwright install --with-deps chromium
      - if: steps.browser.outputs.run != 'false'
        run: npm run test:e2e -- --shard=${{ matrix.parte }}/4

  # The check the rulesets require. It runs whatever happened to the parts
  # (`always()`: without it a failed part would leave this job "skipped", which
  # the rulesets take for a pass) and is green only when every part succeeded:
  # one part failed, cancelled, timed out or skipped makes the result of the
  # matrix something other than "success".
  e2e:
    needs: e2e-parte
    if: ${{ always() }}
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - name: Every part of the e2e suite passed
        env:
          RESULT: ${{ needs.e2e-parte.result }}
        run: |
          echo "e2e-parte: $RESULT"
          test "$RESULT" = "success"

  # Lighthouse on the sign-in and the main screens, against the same Worker as
  # e2e. Floors in tests/lighthouse/lighthouse.spec.ts (accessibility >= 95).
  lighthouse:
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The merge commit and its parents: precisa-de-e2e.ts reads the pull request's changes from them.
          fetch-depth: 2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - id: browser
        run: node scripts/precisa-de-e2e.ts
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
      - if: steps.browser.outputs.run != 'false'
        run: npm ci
      - if: steps.browser.outputs.run != 'false'
        run: npx playwright install --with-deps chromium
      - if: steps.browser.outputs.run != 'false'
        run: npm run test:lighthouse

  # Reads only package-lock.json, so it needs no install. Fails on any
  # high or critical advisory in the dependency tree.
  audit:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm audit --audit-level=high
